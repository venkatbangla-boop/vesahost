<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Designer | VESA</title></head>
<body>
<main class="pdfme-studio-editor">
  <p class="pdfme-caption">LOCAL TEMPLATE DESIGNER · PERSONAL DEMO</p>
  <div class="pdfme-actions">
    <button id="save" type="button">Download Template</button>
    <button id="pdf" type="button">Download Sample PDF</button>
    <label class="pdfme-upload">Open Saved Template <input id="open" type="file" accept=".json,application/json"></label>
  </div>
  <p id="status" role="status" aria-live="polite">Starting local designer…</p>
  <div id="designer" aria-label="Editable PDF template designer"></div>
  <p class="pdfme-disclaimer">Your template stays on this device. No automatic business approvals or cloud synchronization.</p>
</main><script type="module" src="./main.js"></script></body>
</html>
