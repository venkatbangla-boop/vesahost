<style>
/* APP-01: app-owned page content only; shared VESA header/tokens stay external. */
*{box-sizing:border-box}
body{margin:0;background:var(--canvas,#f3f6fa);color:var(--ink,#17263d);font:14px/1.55 var(--ui,Arial,sans-serif)}
#packingMain{width:min(1240px,calc(100vw - 28px));margin:0 auto;padding:20px 0 70px;min-width:0}
.pack-title{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.pack-title h1{font-size:clamp(1.3rem,2.6vw,2rem);margin:0;letter-spacing:-.03em}
.pack-title p{margin:3px 0;color:var(--muted,#526176)}
.pack-card{background:var(--paper,#fff);border:1px solid var(--line,#cbd6e4);border-radius:15px;padding:18px;margin:0 0 16px;min-width:0}
.pack-card h2,.pack-card h3{margin:0 0 12px;font-size:1.1rem}
.pack-note{font-size:.88rem;color:var(--muted,#526176);margin:6px 0 13px}
.pack-alert{padding:12px;border:1px solid var(--line,#cbd6e4);background:var(--look-surface,#eef3f9);border-radius:11px;white-space:pre-wrap;margin:10px 0}
.pack-alert[role=alert]{border-inline-start:4px solid var(--action,#b92f52)}
.pack-toolbar,.pack-tabs,.pack-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}
.pack-tabs{border-bottom:1px solid var(--line,#cbd6e4);padding-bottom:10px}
.pack-tabs button[aria-current=true]{background:var(--blue,#244fd6);color:#fff;border-color:var(--blue,#244fd6)}
.pack-btn,.pack-tabs button{font:inherit;font-weight:700;border:1px solid var(--line,#cbd6e4);border-radius:10px;background:var(--paper,#fff);color:var(--ink,#17263d);padding:10px 14px;min-height:44px;cursor:pointer}
.pack-btn.primary{background:var(--blue,#244fd6);border-color:var(--blue,#244fd6);color:#fff}
.pack-btn:disabled{opacity:.5;cursor:not-allowed}
.pack-btn:focus-visible,.pack-tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--tna-gold,#bb8933);outline-offset:2px}
.pack-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.pack-metric b{display:block;font-size:1.38rem;overflow-wrap:anywhere}
.pack-metric small{color:var(--muted,#526176)}
.pack-table-wrap{overflow:auto;max-width:100%;border:1px solid var(--line,#cbd6e4);border-radius:9px}
.pack-table{width:100%;border-collapse:collapse;font-size:.91rem}
.pack-table th,.pack-table td{padding:10px 12px;vertical-align:top;text-align:left;border-bottom:1px solid var(--line,#cbd6e4);overflow-wrap:anywhere}
.pack-table th{background:var(--look-surface,#eef3f9);font-weight:800;white-space:nowrap}
.pack-table td.numeric{text-align:right;font-variant-numeric:tabular-nums}

.pack-local-info{margin:7px 0 0;font-size:11px;color:var(--muted,#526176)}
.pack-local-info summary{display:inline-flex;align-items:center;min-height:32px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.pack-local-info summary:focus-visible{outline:3px solid var(--tna-gold,#bb8933);outline-offset:2px}
/* APP-01 G4 - actual eight-stage functionality visible from Home.
 * App-owned UI only, no extra sticky header or new domain calculation. */
.pack-explorer{padding:20px}
.pack-explorer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 14px}

.pack-explorer-head .pack-note{margin:0}
.pack-explorer-kicker{display:block;font-size:11px;letter-spacing:.07em;font-weight:800;text-transform:uppercase;color:var(--blue,#244fd6);margin-bottom:5px}
.pack-explorer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pack-explore-action{display:flex;align-items:center;gap:10px;width:100%;min-width:0;min-height:74px;padding:14px 11px;
  text-align:left;background:var(--look-surface,#eef3f9);color:var(--ink,#17263d);
  border:1px solid var(--line,#cbd6e4);border-radius:12px;font:inherit;font-weight:750;line-height:1.35;
  cursor:pointer;transition:border-color .16s ease,background .16s ease}
.pack-explore-action:hover{border-color:var(--blue,#244fd6);background:var(--paper,#fff)}
.pack-explore-action:focus-visible{outline:3px solid var(--tna-gold,#bb8933);outline-offset:2px}
.pack-explore-num{display:grid;place-items:center;flex:0 0 30px;width:30px;height:30px;border-radius:9px;
  background:var(--paper,#fff);color:var(--blue,#244fd6);font-weight:850;font-size:12px}
.pack-explore-label{flex:1 1 auto;min-width:0;font-size:13px;overflow-wrap:anywhere}
.pack-explore-arrow{margin-left:auto;font-size:16px;flex:0 0 auto;color:var(--blue,#244fd6)}
@media screen and (max-width:700px){
  .pack-explorer-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .pack-explorer{padding:14px}
  .pack-explore-action{min-height:70px;padding:10px 8px;gap:7px}
  .pack-explore-num{width:27px;height:27px;flex-basis:27px}
  .pack-explore-label{font-size:12px}
}
@media print{.pack-explorer{display:none!important}}
</style>

<body>
<main id="packingMain" tabindex="-1"><p role="status">Opening VESA Packing &amp; Container 360…</p></main>
<dialog id="packDialog" class="pack-dialog" aria-labelledby="packDialogTitle">
 <div class="pack-dialog-head"><h2 id="packDialogTitle">Action</h2><button class="pack-btn" type="button" id="packClose" aria-label="Close">×</button></div>
 <div id="packDialogBody"></div>
</dialog>
<input id="packFile" type="file" accept=".vesapack,application/json" hidden>
<script>
(function(root){
'use strict';
const VERSION='VESA-PACK360-PLAN-1',COPY_VERSION='VESA-PACK360-COPY-1',KEY='vesa.packing-container.records.v1.';
const LIMIT=2*1024*1024,MAX_CARTONS=30000,SCENE='Packing planning draft only. CBM and payload are mathematical checks, NOT a physical loadability, customs, shipping or buyer approval.';
const deep=value=>JSON.parse(JSON.stringify(value));
const trim=value=>String(value??'').trim();
const id=prefix=>prefix+'-'+(root.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
const safe=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[ch]||'&#39;'));
const spreadsheet=value=>{const v=String(value??'');return /^[=+\-@\t\r]/.test(v)?"'"+v:v;};
const integer=value=>typeof value==='number'&&Number.isSafeInteger(value)&&value>=0;
const positive=value=>typeof value==='number'&&Number.isFinite(value)&&value>0;
const rounded=(n,p=4)=>n===null||!Number.isFinite(n)?'Needs Information':String(Number(n.toFixed(p)));
/**
 * APP-01 pure calculation owner. Input is an untrusted versioned plan; output
 * is a deterministic read-only reconciliation. Never chooses buyer ratios,
 * standard containers, physical stowage, packing efficiency or approvals.
 * Exceptions/invalid entries appear in errors and cannot be saved as valid.
 */
class PackingMath {
 static m(value,unit){return positive(value)?value*({cm:.01,mm:.001,in:.0254}[unit]||NaN):NaN;}
 static kg(value,unit){return positive(value)?value*({kg:1,lb:.45359237}[unit]||NaN):NaN;}
 /** Only homogeneous sourced pieces-per-carton may be rounded automatically. */
 static cartonsNeeded(pieces,per){return integer(pieces)&&integer(per)&&pieces>0&&per>0?
   Math.ceil(pieces/per):null;}
 /** Strict timezone-free civil date for manual loading evidence. */
 static validDate(date){
   if(typeof date!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date))return false;
   const time=Date.parse(date+'T00:00:00Z');
   return Number.isFinite(time)&&new Date(time).toISOString().slice(0,10)===date;
 }
 static range(config,count){
   const start=trim(config.cartonStart),end=trim(config.cartonEnd);
   if(!start||!end)return {error:'Enter both carton range identifiers.'};
   if(!/^[0-9]+$/.test(start)||!/^[0-9]+$/.test(end)||start.length!==end.length||
     start.length>12)return {error:'Use numeric carton IDs with the same digit width, preserving leading zeros.'};
   const first=Number(start),last=Number(end);
   if(!Number.isSafeInteger(first)||!Number.isSafeInteger(last)||last<first||last-first+1!==count)
     return {error:'Carton start/end identifiers do not match the exact carton count.'};
   return {first,last,width:start.length,start,end,count};
 }
 static analyze(plan){
   const errors=[],notes=[],balances=[],packs=[],containers=[],loads=[];
   if(!plan||plan.version!==VERSION||!Array.isArray(plan.orderLines)||!Array.isArray(plan.cartonSpecs)||
     !Array.isArray(plan.packConfigs)||!Array.isArray(plan.containerScenarios)||!Array.isArray(plan.loadEntries))
     return {ok:false,errors:['Unsupported packing plan.'],notes,balances,packs,containers,loads};
   const orderById=new Map(),specById=new Map(), packed=new Map(),keys=new Set();
   for(const line of plan.orderLines){
     const k=[trim(line.style).toLowerCase(),trim(line.color).toLowerCase(),trim(line.size).toLowerCase()].join('|');
     if(!trim(line.style)||!trim(line.color)||!trim(line.size)||!integer(line.quantity)||line.quantity<=0||!trim(line.sourceRef))
       errors.push('Each order line needs style, colour, size, sourced positive whole-piece quantity.');
     if(keys.has(k))errors.push('Duplicate style/colour/size order line.');
     keys.add(k);if(orderById.has(line.id))errors.push('Duplicate order-line ID.');
     orderById.set(line.id,line);packed.set(line.id,0);
   }
   for(const spec of plan.cartonSpecs){
     if(specById.has(spec.id))errors.push('Duplicate carton specification.');
     specById.set(spec.id,spec);
     const cbm=this.m(spec.length,spec.unit)*this.m(spec.width,spec.unit)*this.m(spec.height,spec.unit);
     const gross=this.kg(spec.grossWeight,spec.weightUnit),net=this.kg(spec.netWeight,spec.weightUnit);
     if(!trim(spec.code)||!trim(spec.sourceRef)||!Number.isFinite(cbm)||!Number.isFinite(gross)||
       !Number.isFinite(net)||gross<net)errors.push('Carton dimensions, sourced net and gross weights must be positive; gross must be at least net.');
   }
   let totalCartons=0,totalPieces=0,totalCbm=0,totalGrossKg=0,grossKnown=true;
   const registered=[];
   const seenConfigs=new Set();
   for(const config of plan.packConfigs){
     if(seenConfigs.has(config.id))errors.push('Duplicate packing configuration ID.');
     seenConfigs.add(config.id);
     const spec=specById.get(config.specId);
     if(!spec){errors.push('A packing configuration references a missing carton.');continue;}
     if(!integer(config.fullCartons)||!integer(config.piecesPerCarton)||config.piecesPerCarton<1||
       !Array.isArray(config.composition)||!Array.isArray(config.partialComposition)){
       errors.push('Use whole carton and garment piece numbers.');continue;
     }
     const sums=new Map(),partial=new Map();let fullSum=0,partialSum=0,invalid=false;
     for(const item of config.composition){
       if(!orderById.has(item.lineId)||!integer(item.pieces)||item.pieces<=0||sums.has(item.lineId)){invalid=true;break;}
       sums.set(item.lineId,item.pieces);fullSum+=item.pieces;
     }
     for(const item of config.partialComposition){
       if(!orderById.has(item.lineId)||!integer(item.pieces)||item.pieces<=0||partial.has(item.lineId)){invalid=true;break;}
       partial.set(item.lineId,item.pieces);partialSum+=item.pieces;
       if((sums.get(item.lineId)||0)<item.pieces)invalid=true;
     }
     if(invalid||fullSum!==config.piecesPerCarton||partialSum>=config.piecesPerCarton||
       (config.fullCartons===0&&partialSum===0)||!trim(config.sourceRef)){
       errors.push('Carton composition or partial carton is inconsistent with sourced pieces per carton.');continue;
     }
     if(config.packType!==(sums.size===1?'solid':'mixed'))errors.push('Packing type must match actual carton composition.');
     const count=config.fullCartons+(partialSum>0?1:0),range=this.range(config,count);
     if(range.error||count>MAX_CARTONS||count<1){errors.push(range.error||'Split large loading lots into no more than 30,000 cartons per entry.');continue;}
     for(const existing of registered){
       if(existing.width===range.width&&range.first<=existing.last&&existing.first<=range.last)
         errors.push('Carton identifiers overlap between packing entries.');
     }
     registered.push(range);
     const cbm=this.m(spec.length,spec.unit)*this.m(spec.width,spec.unit)*this.m(spec.height,spec.unit);
     const gross=this.kg(spec.grossWeight,spec.weightUnit);
     const partialGross=partialSum>0?this.kg(config.partialGrossWeight,spec.weightUnit):0;
     if(partialSum>0&&!Number.isFinite(partialGross)){grossKnown=false;notes.push('Partial-carton actual gross weight is missing. Overall weight needs information.');}
     const qty=config.fullCartons*config.piecesPerCarton+partialSum;
     if(!Number.isSafeInteger(qty)||qty>1000000000){
       errors.push('Packing entry quantity exceeds the safe whole-piece calculation limit.');continue;
     }
     for(const [lineId,each] of sums)packed.set(lineId,(packed.get(lineId)||0)+config.fullCartons*each);
     for(const [lineId,each] of partial)packed.set(lineId,(packed.get(lineId)||0)+each);
     totalCartons+=count;totalPieces+=qty;
     totalCbm+=count*cbm;totalGrossKg+=config.fullCartons*gross+(partialSum?Number.isFinite(partialGross)?partialGross:0:0);
     packs.push({id:config.id,packType:config.packType,code:spec.code,cbm,count,pieces:qty,
       grossKg:partialSum&&!Number.isFinite(partialGross)?null:config.fullCartons*gross+(partialSum?partialGross:0),
       start:range.start,end:range.end,range,composition:config.composition,
       partialComposition:config.partialComposition,partialPieces:partialSum,
       sourceRef:config.sourceRef,specId:spec.id,
       homogeneousCartonsNeeded:sums.size===1?
         this.cartonsNeeded(orderById.get([...sums.keys()][0])?.quantity,config.piecesPerCarton):null});
   }
   for(const line of plan.orderLines){
     const value=packed.get(line.id)||0,remaining=line.quantity-value;
     if(remaining<0)errors.push('Packed pieces exceed the sourced quantity for '+line.style+' / '+line.color+' / '+line.size+'.');
     balances.push({id:line.id,style:line.style,color:line.color,size:line.size,
       ordered:line.quantity,packed:value,remaining,sourceRef:line.sourceRef});
   }
   if(!plan.orderLines.length)notes.push('Enter sourced PO style/colour/size quantities before packing.');
   if(!plan.packConfigs.length)notes.push('No packing configuration has been entered.');
   const totalOrdered=balances.reduce((s,r)=>s+r.ordered,0);
   const requiredCbm=totalCartons?totalCbm:null,requiredWeight=totalCartons&&grossKnown?totalGrossKg:null;
   for(const scene of plan.containerScenarios){
     const values=['length','width','height','doorWidth','doorHeight'];
     const dims=values.map(k=>this.m(scene[k],scene.unit));
     const payload=this.kg(scene.payload,scene.weightUnit);
     const confirmed=!!scene.sourceConfirmed&&!!trim(scene.sourceRef)&&!!trim(scene.verifiedBy);
     const headroom=scene.headroomPercent;
     const possible=confirmed&&dims.every(Number.isFinite)&&Number.isFinite(payload)&&
       Number.isFinite(headroom)&&headroom>=0&&headroom<100;
     if(scene.sourceConfirmed&&!possible)errors.push('Confirmed container needs verified internal/door dimensions, payload, approved headroom and source.');
     const interior=possible?dims[0]*dims[1]*dims[2]:null;
     const usable=interior===null?null:interior*(1-headroom/100);
     const volumeEligible=requiredCbm===null||usable===null?null:requiredCbm<=usable+1e-9;
     const weightEligible=requiredWeight===null||!possible?null:requiredWeight<=payload+1e-9;
     let doorEligible=null;
     if(possible&&packs.length){
       doorEligible=true;
       for(const pack of packs){
         const spec=specById.get(pack.specId),a=[spec.length,spec.width,spec.height].map(v=>this.m(v,spec.unit));
         const faces=[[a[0],a[1]],[a[0],a[2]],[a[1],a[2]]];
         if(!faces.some(pair=>(pair[0]<=dims[3]&&pair[1]<=dims[4])||(pair[1]<=dims[3]&&pair[0]<=dims[4])))doorEligible=false;
       }
     }
     containers.push({id:scene.id,name:scene.name,type:scene.type,sourceConfirmed:confirmed,
       sourceRef:scene.sourceRef,interiorCbm:interior,usableCbm:usable,payloadKg:possible?payload:null,
       volumeEligible,weightEligible,doorEligible,
       status:!possible?'Needs Information':(volumeEligible===false||weightEligible===false||doorEligible===false)?
         'Not eligible on entered checks':'Mathematical checks only — physical fit not verified'});
   }
   // A physical carton lot cannot be dispatched twice by labeling the entries
   // as different comparison scenarios. Reconcile counts across all scenarios.
   const totalsByLoad=new Map(),sceneIds=new Set(plan.containerScenarios.map(s=>s.id));
   for(const item of plan.loadEntries){
     const config=packs.find(p=>p.id===item.configId);
     if(!sceneIds.has(item.scenarioId)||!config||!integer(item.cartonCount)||item.cartonCount<1||
       !trim(item.evidenceRef)||!this.validDate(item.date)){
       errors.push('Loading entry needs a valid scenario, pack entry, carton count, date and manual evidence.');continue;
     }
     const loaded=(totalsByLoad.get(item.configId)||0)+item.cartonCount;
     totalsByLoad.set(item.configId,loaded);
     if(loaded>config.count)errors.push('Actual loaded cartons exceed the matching planned carton count across all container entries.');
     loads.push({scenarioId:item.scenarioId,configId:item.configId,
       loaded:item.cartonCount,evidenceRef:item.evidenceRef,date:item.date});
   }
   return {ok:errors.length===0,errors,notes,balances,packs,containers,loads,
     totalOrdered,totalPieces,totalCartons,totalCbm:requiredCbm,
     totalGrossKg:requiredWeight,totalRemaining:balances.reduce((s,r)=>s+r.remaining,0)};
 }
 static create(seed={},practice=false){
   return {version:VERSION,id:id('PACK'),revision:0,createdAt:new Date().toISOString(),
     updatedAt:new Date().toISOString(),mode:practice?'practice':'local',status:'draft',
     meta:{buyer:trim(seed.buyer),factory:trim(seed.factory),po:trim(seed.po),style:trim(seed.style),
       sourceRef:trim(seed.sourceRef),reference:null},orderLines:[],cartonSpecs:[],
     packConfigs:[],containerScenarios:[],loadEntries:[],frozenSnapshots:[],audit:[]};
 }
 static sample(){
   const p=this.create({buyer:'SYNTHETIC BUYER — PRACTICE ONLY',factory:'SYNTHETIC FACTORY',
     po:'TEST-PO-0001',style:'TEST-STYLE',sourceRef:'DEMO INPUT — NOT APPROVED'},true);
   p.orderLines=[{id:'L1',style:'TEST-STYLE',color:'Navy',size:'M',quantity:120,sourceRef:'DEMO SOURCE'},
     {id:'L2',style:'TEST-STYLE',color:'Navy',size:'L',quantity:60,sourceRef:'DEMO SOURCE'}];
   p.cartonSpecs=[{id:'C1',code:'TEST-BOX-01',length:60,width:40,height:30,unit:'cm',
     grossWeight:11,netWeight:10,weightUnit:'kg',sourceRef:'SYNTHETIC BOX ONLY'}];
   p.packConfigs=[{id:'P1',specId:'C1',packType:'mixed',fullCartons:6,piecesPerCarton:30,
     cartonStart:'0001',cartonEnd:'0006',composition:[{lineId:'L1',pieces:20},{lineId:'L2',pieces:10}],
     partialComposition:[],partialGrossWeight:null,sourceRef:'SYNTHETIC RATIO ONLY'}];

/**
 * Portable copy / private browser storage owner. No network, no cross-app
 * data. All inputs are bounded, checksum protected and decoded before write.

 */
class PackingStore {

   const result=PackingMath.analyze(plan);
   if(!result.ok)throw Error(result.errors.join('\n'));
   if(!trim(plan.id)||!Number.isSafeInteger(plan.revision)||plan.revision<0||!plan.meta||
     !Array.isArray(plan.frozenSnapshots)||!Array.isArray(plan.audit))
     throw Error('This saved packing plan has an unsupported structure.');
   if(JSON.stringify(plan).length>LIMIT)throw Error('This plan exceeds the safe saved-copy size.');
   return result;
 }

   let raw=null;try{raw=localStorage.getItem(this.key);}catch{throw Error('This browser cannot open local records.');}
   if(!raw)return [];
   const box=JSON.parse(raw);
   if(box.version!==VERSION||!Array.isArray(box.records))throw Error('Local record format not supported; saved data has not been replaced.');
   return box.records;

   try{localStorage.setItem(temp,text);localStorage.setItem(this.key,localStorage.getItem(temp));}
   catch{throw Error('Could not save locally; original records were not intentionally deleted.');}
   finally{try{localStorage.removeItem(temp);}catch{}}

 }

   this.validate(plan);const text=JSON.stringify(plan);
   return JSON.stringify({format:COPY_VERSION,checksum:this.checksum(text),savedAt:new Date().toISOString(),record:plan});

   if(typeof text!=='string'||text.length>LIMIT)throw Error('Saved copy is too large or unreadable.');

     this.checksum(JSON.stringify(packet.record))!==packet.checksum)

}
/** Source-only, no-cost report owner; reports cannot convert local drafts to approval. */
class PackingReport {
 static rows(p,calc){
   const rowText=(line)=>[line.style,line.color,line.size,line.ordered,line.packed,line.remaining,line.sourceRef];
   const cartonLines=[];
   for(const c of calc.packs){
     const spec=p.cartonSpecs.find(x=>x.id===c.specId);
     cartonLines.push([c.start+' – '+c.end,spec.code,c.packType,c.count,c.pieces,c.cbm,c.grossKg??'Needs Information',c.homogeneousCartonsNeeded??'Not applicable',c.sourceRef]);
   }
   return {
     'Packing Config':[['Carton range','Carton ID','Pack type','Cartons','Packed pcs','CBM/carton','Gross kg','Homogeneous cartons needed','Source'],...cartonLines],
     'Carton List':[['Carton ID','Carton specification','Configuration','Pieces','Composition','Source'],
       ...calc.packs.flatMap(c=>{
         const spec=p.cartonSpecs.find(x=>x.id===c.specId),codes=[];
         const count=Math.min(c.count,MAX_CARTONS);
         for(let i=0;i<count;i++){
           const partial=i===c.count-1&&c.partialPieces>0;
           const parts=partial?c.partialComposition:c.composition;
           const composition=parts.map(item=>{
             const line=p.orderLines.find(l=>l.id===item.lineId);
             return (line?.style||'?')+' / '+(line?.color||'?')+' / '+(line?.size||'?')+': '+item.pieces;
           }).join('; ');
           codes.push([String(c.range.first+i).padStart(c.range.width,'0'),spec.code,c.id,
             partial?c.partialPieces:c.composition.reduce((s,row)=>s+row.pieces,0),composition,c.sourceRef]);
         }
         return codes;
       })],
     'CBM & Weight':[['Measure','Value','Meaning'],
       ['Total cartons',calc.totalCartons,'All declared full and partial cartons'],
       ['Total packing pieces',calc.totalPieces,'Sourced quantity check required'],
       ['CBM (m³)',calc.totalCbm??'Needs Information','Exact carton exterior volume; no packing efficiency assumed'],
       ['Gross weight (kg)',calc.totalGrossKg??'Needs Information','Actual gross for partial cartons required'],
       ['Unpacked pieces',calc.totalRemaining,'By source PO style / colour / size']],
     'Container Comparison':[['Scenario','Type','Verified source','Interior m³','Usable m³','Payload kg','CBM eligible','Weight eligible','Door eligible','Decision'],
       ...calc.containers.map(s=>[s.name,s.type,s.sourceConfirmed?s.sourceRef:'Needs Information',
         s.interiorCbm??'Needs Information',s.usableCbm??'Needs Information',
         s.payloadKg??'Needs Information',s.volumeEligible??'Needs Information',
         s.weightEligible??'Needs Information',s.doorEligible??'Needs Information',s.status])],
     'Packing Balance':[['Style','Colour','Size','Sourced qty','Packed qty','Remaining','PO source'],
       ...calc.balances.map(rowText)],
     'Draft Load Plan':[['Scenario','Pack ID','Loaded cartons','Recorded date','Manual evidence'],
       ...calc.loads.map(s=>[p.containerScenarios.find(x=>x.id===s.scenarioId)?.name||s.scenarioId,
         s.configId,s.loaded,s.date,s.evidenceRef])]
   };
 }

/**
 * Application controller owns DOM, actions, and in-memory draft state only.
 * All mutations are validated via the pure engine before persistence. The
 * shared VESA shell exclusively owns global nav, settings, language, logout.
 */
class PackingWorkspace {
 constructor(){
   this.main=document.getElementById('packingMain');this.dialog=document.getElementById('packDialog');
   this.body=document.getElementById('packDialogBody');this.file=document.getElementById('packFile');
   this.current=null;this.section='summary';this.reportOpen=false;this.dirty=false;this.lastFocus=null;
   this.user=trim(root.VesaAuth?.session?.()?.email||'local-browser-user');
   this.store=new PackingStore(this.user);this.shell=null;
 }
 tr(k){const l=root.VesaPrefs?.read?.()?.language||'en';return COPY[l]?.[k]||COPY.en[k]||k;}
 fmt(x){return x===null||!Number.isFinite(x)?this.tr('needs'):rounded(x);}
 node(k,v='',opts={},wide=false){
   const attrs=Object.entries(opts).map(([a,b])=>' '+safe(a)+'="'+safe(b)+'"').join('');
   return '<label class="'+(wide?'wide':'')+'"><span>'+safe(this.tr(k))+'</span><input name="'+safe(k)+'" value="'+safe(v)+'"'+attrs+'></label>';
 }
 field(k,value='',kind='text',extra='',wide=false){
   return '<label class="'+(wide?'wide':'')+'"><span>'+safe(this.tr(k))+'</span><input name="'+safe(k)+'" type="'+safe(kind)+'" value="'+safe(value??'')+'" '+extra+'></label>';
 }
 select(k,values,value){
   return '<label><span>'+safe(this.tr(k))+'</span><select name="'+safe(k)+'">'+values.map(([id,label])=>
     '<option value="'+safe(id)+'"'+(String(id)===String(value)?' selected':'')+'>'+safe(label)+'</option>').join('')+'</select></label>';
 }
 textArea(k,value=''){return '<label class="wide"><span>'+safe(this.tr(k))+'</span><textarea name="'+safe(k)+'" maxlength="400">'+safe(value)+'</textarea></label>';}
 notice(text,error=false){const box=this.main.querySelector('#packNotice');if(box){box.textContent=text;box.setAttribute('role',error?'alert':'status');}if(this.shell)this.shell.setSavedState(error?'failed':this.dirty?'unsaved':'saved');}
 start(){
   if(!root.VesaWorkspaceShell?.VesaWorkspaceShell){this.main.textContent='VESA shared workspace shell missing.';return;}
   const session=root.VesaAuth?.session?.()||{};
   this.shell=new root.VesaWorkspaceShell.VesaWorkspaceShell({root:document.body,
     descriptor:{id:'packing-container',name:'VESA Packing & Container 360',route:'/apps/packing-container/',
       contentTarget:'#packingMain',userLabel:session.name||session.email||'',userRole:session.role||'',
       savedState:'Unsaved changes'},
     callbacks:{menu:name=>this.menu(name)}});
   this.shell.mount();
   document.getElementById('packClose').addEventListener('click',()=>this.dialog.close());
   this.main.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target){event.preventDefault();this.action(target.dataset.action,target.dataset.id);}});
   this.dialog.addEventListener('submit',event=>{if(event.target.matches('form[data-form]')){event.preventDefault();this.submit(event.target);}});
   this.file.addEventListener('change',async()=>{const file=this.file.files?.[0];this.file.value='';if(!file)return;try{if(file.size>LIMIT)throw Error('This copy is too large.');const record=PackingStore.decode(await file.text());
      if(this.store.load(record.id)){record.id=id('PACK-COPY');record.audit.push({at:new Date().toISOString(),action:'Restored as separate plan because original ID already exists'});}
      record.mode='local';this.store.save(record);this.current=record;this.section='summary';this.dirty=false;this.render();this.message('Saved copy opened safely.');
     }catch(e){this.message(e.message,true);}});
   root.addEventListener('vesa-preferences-change',()=>this.render());
   root.addEventListener('beforeunload',event=>{if(this.dirty&&this.current?.mode!=='practice'){event.preventDefault();event.returnValue='';}});
   this.render();
 }
 message(text,error=false){this.openDialog(error?'Please review':'VESA Packing 360','<p class="pack-alert"'+(error?' role="alert"':'')+'>'+safe(text)+'</p>');}
 openDialog(title,html){this.lastFocus=document.activeElement;document.getElementById('packDialogTitle').textContent=title;this.body.innerHTML=html;
   if(!this.dialog.open)this.dialog.showModal();this.dialog.addEventListener('close',()=>this.lastFocus?.focus?.(),{once:true});
   this.dialog.querySelector('input:not([type=hidden]),select,button')?.focus?.();
 }
 menu(name){
   const menus={Home:[['home',this.tr('home')],['new',this.tr('new')],['continue',this.tr('continue')]],
     File:[['save',this.tr('save')],['download',this.tr('download')],['upload',this.tr('upload')],['open',this.tr('open')]],
     Edit:[['meta',this.tr('editData')],['add-line',this.tr('order')],['add-carton',this.tr('cartons')],['add-pack',this.tr('packs')]],
     View:[['summary',this.tr('summary')],['order',this.tr('order')],['packs',this.tr('packs')],['containers',this.tr('containers')]],
     Tools:[['report',this.tr('report')],['add-scene',this.tr('containers')],['add-load',this.tr('record')],['freeze',this.tr('freeze')]],
     Help:[['help','How to use Packing 360'],['practice',this.tr('practice')]]};
   this.openDialog(name,'<div class="pack-actions">'+(menus[name]||[]).map(([key,label])=>
     '<button type="button" class="pack-btn" data-dialog-action="'+safe(key)+'">'+safe(label)+'</button>').join('')+'</div>');
   this.body.querySelectorAll('[data-dialog-action]').forEach(button=>button.addEventListener('click',()=>{
     this.dialog.close();this.action(button.dataset.dialogAction);
   }));
 }
 action(name,key){
   try{
     if(name==='home'){this.current=null;this.section='summary';this.render();return;}
     if(name==='new')return this.form('new');
     if(name==='practice'){this.current=PackingMath.sample();this.section='summary';this.dirty=false;this.render();return;}
     if(name.startsWith('preview-')){
       const section=name.slice('preview-'.length);
       if(!['summary','order','cartons','packs','containers','loads','reports','revision'].includes(section))
         throw Error('Unknown practice section.');
       this.current=PackingMath.sample();
       this.section=section;this.reportOpen=section==='reports';this.dirty=false;
       this.render();return;
     }
     if(name==='open'){this.current=null;this.render();return;}
     if(name==='continue'){const items=this.store.list();if(!items.length)throw Error('No saved plan on this device.');return this.action('open-record',items[0].id);}
     if(name==='open-record'){const p=this.store.load(key);if(!p)throw Error('Saved plan not found.');this.current=p;this.section='summary';this.dirty=false;this.render();return;}
     if(name==='upload'){this.file.click();return;}
     if(name==='save'){if(!this.current)throw Error('Create a packing plan first.');if(this.current.mode==='practice')throw Error('Practice is not a real packing order. Create a new plan first.');this.store.save(this.current);this.dirty=false;this.render();return;}
     if(name==='download'){if(!this.current)throw Error('Create a plan first.');if(this.current.mode==='practice')throw Error('Practice data is not a production record.');this.download(PackingStore.encode(this.current),
       'VESA-PACKING-'+this.current.id+'.vesapack','application/json');return;}
     if(['summary','order','cartons','packs','containers','loads','reports','revision'].includes(name)){
       if(!this.current)throw Error('Create or open a plan first.');this.section=name;this.reportOpen=name==='reports';this.render();return;}
     if(['add-line','add-carton','add-pack','add-scene','add-load','meta','freeze','reference','new'].includes(name))return this.form(name);
     if(name.startsWith('edit-'))return this.form(name.slice(5),key);
     if(name.startsWith('delete-'))return this.remove(name.slice(7),key);
     if(name==='report'){if(!this.current)throw Error('Open a plan first.');this.section='reports';this.reportOpen=true;this.render();return;}
     if(name==='excel')return this.excel();
     if(name==='print'){if(!this.current)throw Error('Open a plan first.');this.section='reports';this.reportOpen=true;this.render();root.print();return;}
     if(name==='csv'){if(!this.current)throw Error('Open a plan first.');const x=PackingReport.rows(this.current,PackingMath.analyze(this.current));
       this.download(PackingReport.csvContent(x['Packing Balance']),'VESA-PACKING-BALANCE-'+this.current.id+'.csv','text/csv');return;}
     if(name==='help')return this.openDialog('Packing 360 · Help','<p>'+safe(SCENE)+'</p><p>1. Enter source-backed PO colour/size pieces. 2. Enter actual carton dimensions and weights. 3. Build solid or mixed packs and optional partial cartons. 4. Compare sourced container dimensions without claiming physical fit. 5. Record manual loading, Save and Print/Excel. All records remain local to this browser.</p>');
   }catch(e){this.message(e.message,true);}
 }
 commit(label,mutator){
   if(!this.current)throw Error('Open a plan first.');
   if(this.current.mode==='practice')throw Error('Practice is read-only. Start a real plan.');
   const next=deep(this.current),wasFrozen=next.status==='frozen-local';
   mutator(next);
   next.revision+=1;next.updatedAt=new Date().toISOString();
   // Only a subsequent edit starts a new draft; a deliberate freeze must
   // remain locally frozen and never imply buyer/factory approval.
   if(wasFrozen&&next.status==='frozen-local'&&!label.startsWith('Local revision frozen:'))
     next.status='draft';
   next.audit.push({at:next.updatedAt,revision:next.revision,action:label});
   PackingStore.validate(next);
   if(this.store.load(next.id))this.store.save(next);else this.dirty=true;
   this.current=next;this.render();
 }
 remove(kind,key){
   if(!this.current)throw Error('Open a plan.');
   const maps={line:'orderLines',carton:'cartonSpecs',pack:'packConfigs',scene:'containerScenarios',load:'loadEntries'};
   const prop=maps[kind];if(!prop)throw Error('Unknown record.');
   const plan=this.current;
   if(kind==='line'&&plan.packConfigs.some(c=>c.composition.some(i=>i.lineId===key)||c.partialComposition.some(i=>i.lineId===key)))
     throw Error('This PO line is used by a packing entry; remove the packing entry first.');
   if(kind==='carton'&&plan.packConfigs.some(c=>c.specId===key))throw Error('This carton is used by a packing entry.');
   if(kind==='pack'&&plan.loadEntries.some(e=>e.configId===key))throw Error('This packing entry is used in manual loading.');
   if(kind==='scene'&&plan.loadEntries.some(e=>e.scenarioId===key))throw Error('This container has manual loading entries.');
   if(!root.confirm('Remove this entry from the local draft?'))return;
   this.commit('Removed '+kind,p=>{p[prop]=p[prop].filter(item=>item.id!==key);});
 }
 render(){
   const l=k=>this.tr(k),records=this.store.list();
   const title='<div class="pack-title"><div><h1>'+safe(l('title'))+'</h1><p>'+safe(l('lead'))+'</p><p class="pack-note">'+safe(l('privacy'))+'</p>'+
     '<details class="pack-local-info"><summary>'+safe(l('localInfo'))+'</summary>'+
     '<p><b>NON-COMMERCIAL PERSONAL DEMO.</b> Use fictional examples only. Do not enter actual buyer/factory orders, personal information, payments or passwords. Browser-local login is not secure authentication, and this app cannot certify physical loading.</p></details></div></div>';
   if(!this.current){
     const tour=['summary','order','cartons','packs','containers','loads','reports','revision'];
     const explorer='<section class="pack-card pack-explorer" aria-labelledby="packExploreTitle">'+
       '<div class="pack-explorer-head"><div><span class="pack-explorer-kicker">'+safe(l('practice'))+'</span>'+
       '<h2 id="packExploreTitle">'+safe(l('explore'))+'</h2>'+
       '<p class="pack-note">'+safe(l('exploreHint'))+'</p></div></div>'+
       '<div class="pack-explorer-grid">'+tour.map((id,i)=>
         '<button type="button" class="pack-explore-action" data-action="preview-'+id+
         '" aria-label="'+safe(l(id)+' · '+l('practice'))+'">'+
         '<span class="pack-explore-num" aria-hidden="true">'+String(i+1).padStart(2,'0')+'</span>'+
         '<span class="pack-explore-label">'+safe(l(id))+'</span>'+
         '<span class="pack-explore-arrow" aria-hidden="true">→</span></button>').join('')+
       '</div></section>';
     this.main.innerHTML=title+'<section class="pack-card">'+
     '<div class="pack-toolbar"><button class="pack-btn primary" data-action="new">'+safe(l('new'))+'</button>'+
     '<button class="pack-btn" data-action="continue">'+safe(l('continue'))+'</button>'+
     '<button class="pack-btn" data-action="upload">'+safe(l('upload'))+'</button>'+
     '<button class="pack-btn" data-action="practice">'+safe(l('practice'))+'</button></div></section>'+explorer+
     '<section class="pack-card"><h2>'+safe(l('files'))+'</h2>'+
     (records.length?records.map(r=>'<div class="pack-record"><span><b>'+safe(r.po||'PO missing')+
       '</b> · '+safe(r.style||'')+'<small>'+safe(r.buyer||'')+' · Revision '+r.revision+'</small></span>'+
       '<button class="pack-btn" data-action="open-record" data-id="'+safe(r.id)+'">'+safe(l('open'))+'</button></div>').join(''):'<p>'+safe(l('none'))+'</p>')+
     '</section><p id="packNotice" class="pack-note"></p>';
     this.shell?.setSavedState('unsaved');return;
   }
   let data=PackingMath.analyze(this.current),p=this.current,practice=p.mode==='practice';
   const tabs=['summary','order','cartons','packs','containers','loads','reports','revision'];
   const name={summary:l('summary'),order:l('order'),cartons:l('cartons'),packs:l('packs'),containers:l('containers'),loads:l('loads'),reports:l('reports'),revision:l('revision')};
   this.main.innerHTML=title+
     '<section class="pack-card"><h2>'+safe(p.meta.po||'Draft PO')+' · '+safe(p.meta.style||'Style not entered')+'</h2>'+
     '<p class="pack-note">'+safe(practice?l('pract'):p.meta.buyer+' · '+p.meta.factory+' · '+p.meta.sourceRef)+
     ' · '+safe(p.status==='frozen-local'?'Locally frozen revision — NOT buyer approved':'Local draft — NOT buyer approved')+'</p>'+
     '<div class="pack-toolbar pack-noprint"><button class="pack-btn" data-action="home">'+safe(l('back'))+'</button>'+
     '<button class="pack-btn primary" data-action="save"'+(practice?' disabled':'')+'>'+safe(l('save'))+'</button>'+
     '<button class="pack-btn" data-action="download"'+(practice?' disabled':'')+'>'+safe(l('download'))+'</button>'+
     '<button class="pack-btn" data-action="report">'+safe(l('report'))+'</button>'+
     '<button class="pack-btn" data-action="freeze"'+(practice?' disabled':'')+'>'+safe(l('freeze'))+'</button></div>'+
     '<p role="status" id="packNotice" class="pack-note">'+safe(this.dirty?l('notSaved'):l('saveNote'))+'</p>'+
     '</section><nav class="pack-tabs pack-noprint" aria-label="Packing workspace sections">'+tabs.map(t=>
     '<button data-action="'+t+'" aria-current="'+(this.section===t)+'">'+safe(name[t])+'</button>').join('')+'</nav>'+
     (data.errors.length?'<section class="pack-card" role="alert"><h3 class="pack-danger">Please correct</h3>'+
       '<ul>'+data.errors.map(x=>'<li>'+safe(x)+'</li>').join('')+'</ul></section>':'')+
     this.panel(this.section,p,data,practice)+
     '<p class="pack-note">'+safe(l('warn'))+'</p>';
   this.shell?.setSavedState(this.dirty?'unsaved':'saved');
 }
 panel(section,p,d,practice){
   const l=k=>this.tr(k),tool=(a,key,extra='')=>'<button class="pack-btn" data-action="'+safe(a)+'"'+(key?' data-id="'+safe(key)+'"':'')+
     (practice?' disabled':'')+'>'+safe(extra||l('edit'))+'</button>';
   const table=(headers,rows)=>'<div class="pack-table-wrap"><table class="pack-table"><thead><tr>'+headers.map(x=>'<th>'+safe(x)+'</th>').join('')+
     '</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
   const head=(title,act,label)=>'<div class="pack-toolbar"><h2>'+safe(title)+'</h2>'+
     (act?tool(act,null,label||l('add')):'')+'</div>';
   const metric=(v,title)=>'<div class="pack-metric"><b>'+safe(v)+'</b><small>'+safe(title)+'</small></div>';
   if(section==='summary'){
     return '<section class="pack-card">'+head(l('summary'),'meta',l('editData'))+
       '<div class="pack-grid">'+metric(d.totalOrdered,l('qty'))+
       metric(d.totalPieces,'Packed pieces')+metric(d.totalRemaining,l('balance'))+
       metric(d.totalCartons,'Cartons')+metric(this.fmt(d.totalCbm),'Total CBM (m³)')+
       metric(this.fmt(d.totalGrossKg),'Gross kg')+'</div>'+
       '<p class="pack-note">'+safe(l('sourceNote'))+'</p>'+
       (d.notes.length?'<ul>'+d.notes.map(s=>'<li>'+safe(s)+'</li>').join('')+'</ul>':'')+
       '<div class="pack-actions">'+tool('reference',null,l('reference'))+'</div></section>';
   }
   if(section==='order')return '<section class="pack-card">'+head(l('order'),'add-line')+
     table(['Style','Colour','Size','PO pcs','Packed','Remaining','Source','Action'],
       d.balances.map(r=>[safe(r.style),safe(r.color),safe(r.size),safe(r.ordered),safe(r.packed),
         safe(r.remaining),safe(r.sourceRef),tool('edit-line',r.id)+' '+tool('delete-line',r.id,l('remove'))]))+'</section>';
   if(section==='cartons')return '<section class="pack-card">'+head(l('cartons'),'add-carton')+
     table(['Code','L × W × H','Gross','Net','Source','Action'],p.cartonSpecs.map(c=>[
       safe(c.code),safe(c.length+' × '+c.width+' × '+c.height+' '+c.unit),
       safe(c.grossWeight+' '+c.weightUnit),safe(c.netWeight+' '+c.weightUnit),
       safe(c.sourceRef),tool('edit-carton',c.id)+' '+tool('delete-carton',c.id,l('remove'))]))+'</section>';
   if(section==='packs')return '<section class="pack-card">'+head(l('packs'),'add-pack')+
     table(['Carton range','Pack type','Pieces','Cartons','CBM','Gross kg','Source','Action'],
       d.packs.map(r=>[safe(r.start+' – '+r.end),safe(r.packType),safe(r.pieces),
         safe(r.count),safe(this.fmt(r.count*r.cbm)),safe(this.fmt(r.grossKg)),
         safe(r.sourceRef),tool('edit-pack',r.id)+' '+tool('delete-pack',r.id,l('remove'))]))+'</section>';
   if(section==='containers')return '<section class="pack-card">'+head(l('containers'),'add-scene')+
     '<p class="pack-note">'+safe(SCENE)+'</p>'+
     table(['Scenario','Type','Internal / usable CBM','Payload kg','Volume','Weight','Door','Result','Action'],
       d.containers.map(s=>[safe(s.name),safe(s.type),safe(this.fmt(s.interiorCbm)+' / '+this.fmt(s.usableCbm)),
         safe(this.fmt(s.payloadKg)),safe(String(s.volumeEligible??l('needs'))),
         safe(String(s.weightEligible??l('needs'))),safe(String(s.doorEligible??l('needs'))),
         safe(s.status),tool('edit-scene',s.id)+' '+tool('delete-scene',s.id,l('remove'))]))+'</section>';
   if(section==='loads')return '<section class="pack-card">'+head(l('loads'),'add-load',l('record'))+
     '<p class="pack-note">'+safe(l('loadNotice'))+'</p>'+
     table(['Container','Pack','Loaded cartons','Date','Evidence','Action'],
       p.loadEntries.map(row=>[safe(p.containerScenarios.find(x=>x.id===row.scenarioId)?.name||'–'),
         safe(p.packConfigs.find(x=>x.id===row.configId)?.cartonStart||'–'),safe(row.cartonCount),
         safe(row.date),safe(row.evidenceRef),tool('edit-load',row.id)+' '+tool('delete-load',row.id,l('remove'))]))+'</section>';
   if(section==='reports')return '<section class="pack-card">'+head(l('reports'))+
     '<div class="pack-actions pack-noprint">'+
     '<button class="pack-btn primary" data-action="excel">'+safe(l('excel'))+'</button>'+
     '<button class="pack-btn" data-action="print">'+safe(l('print'))+'</button>'+
     '<button class="pack-btn" data-action="csv">Download Balance Sheet</button></div>'+
     PackingReport.html(p,d)+'</section>';
   if(section==='revision')return '<section class="pack-card">'+head(l('revision'))+
     '<p>'+safe(l('freezeNote'))+'</p>'+
     table(['Revision','Date','Local action'],p.audit.map(a=>[safe(a.revision??'—'),safe(a.at),safe(a.action)]))+
     '<p>'+safe(l('signed'))+': '+p.frozenSnapshots.length+'</p></section>';
   return '<section class="pack-card">'+safe(l('none'))+'</section>';
 }
 form(kind,key){
   const p=this.current,l=k=>this.tr(k),opts=x=>x.map((o,i)=>i===0?[o,o]:[o,o]);
   if(kind!=='new'&&!p)throw Error('Create or open a plan first.');
   let entity=null,arr='',content='',title='';
   const formStart='<form class="pack-form" data-form="'+safe(kind)+'"><input type="hidden" name="id" value="'+safe(key||'')+'">';
   const finish='<div class="wide pack-actions"><button class="pack-btn primary" type="submit">'+safe(l('save'))+'</button></div></form>';
   if(kind==='new'||kind==='meta'){
     const m=kind==='meta'?p.meta:{};
     title=kind==='new'?l('new'):l('editData');
     content=this.field('buyer',m.buyer,'text','required maxlength="120"')+
       this.field('factory',m.factory,'text','required maxlength="120"')+
       this.field('po',m.po,'text','required maxlength="90"')+
       this.field('style',m.style,'text','required maxlength="90"')+
       this.field('source',m.sourceRef,'text','required maxlength="200"');
   }else if(kind==='add-line'||kind==='line'){
     entity=p.orderLines.find(x=>x.id===key)||{};
     title=l('order');content=this.field('style',entity.style||p.meta.style,'text','required maxlength="90"')+
       this.field('color',entity.color,'text','required maxlength="60"')+
       this.field('size',entity.size,'text','required maxlength="35"')+
       this.field('qty',entity.quantity,'number','required min="1" step="1"')+
       this.field('source',entity.sourceRef||p.meta.sourceRef,'text','required maxlength="200"');
   }else if(kind==='add-carton'||kind==='carton'){
     entity=p.cartonSpecs.find(x=>x.id===key)||{};title=l('cartons');
     content=this.field('code',entity.code,'text','required maxlength="70"')+
       this.field('length',entity.length,'number','required min="0.001" step="any"')+
       this.field('width',entity.width,'number','required min="0.001" step="any"')+
       this.field('height',entity.height,'number','required min="0.001" step="any"')+
       this.select('unit',opts(['cm','mm','in']),entity.unit||'cm')+
       this.field('net',entity.netWeight,'number','required min="0.001" step="any"')+
       this.field('gross',entity.grossWeight,'number','required min="0.001" step="any"')+
       this.select('weightUnit',opts(['kg','lb']),entity.weightUnit||'kg')+
       this.field('source',entity.sourceRef,'text','required maxlength="200"',true);
   }else if(kind==='add-pack'||kind==='pack'){
     entity=p.packConfigs.find(x=>x.id===key)||{};title=l('packs');
     if(!p.orderLines.length||!p.cartonSpecs.length)throw Error('Enter the PO quantities and carton specification first.');
     content=this.select('selectCarton',p.cartonSpecs.map(x=>[x.id,x.code]),entity.specId||p.cartonSpecs[0].id)+
       this.field('full',entity.fullCartons??0,'number','min="0" step="1" required')+
       this.field('start',entity.cartonStart,'text','required inputmode="numeric" maxlength="12"')+
       this.field('end',entity.cartonEnd,'text','required inputmode="numeric" maxlength="12"')+
       this.field('partialWeight',entity.partialGrossWeight,'number','min="0.001" step="any"')+
       this.field('packSource',entity.sourceRef,'text','required maxlength="200"',true)+
       '<div class="wide pack-composition"><h4>'+safe(l('fullMixed'))+'</h4>'+
       p.orderLines.map(line=>'<label><span>'+safe(line.style+' / '+line.color+' / '+line.size)+'</span>'+
         '<input type="number" min="0" step="1" name="q_'+safe(line.id)+'" value="'+
         safe(entity.composition?.find(x=>x.lineId===line.id)?.pieces??0)+'"></label>').join('')+'</div>'+
       '<div class="wide pack-composition"><h4>'+safe(l('partialMixed'))+'</h4>'+
       p.orderLines.map(line=>'<label><span>'+safe(line.style+' / '+line.color+' / '+line.size)+'</span>'+
         '<input type="number" min="0" step="1" name="p_'+safe(line.id)+'" value="'+
         safe(entity.partialComposition?.find(x=>x.lineId===line.id)?.pieces??0)+'"></label>').join('')+'</div>';
   }else if(kind==='add-scene'||kind==='scene'){
     entity=p.containerScenarios.find(x=>x.id===key)||{};title=l('containers');
     content='<p class="wide pack-note">No standard 20ft/40ft/40HC values are prefilled. Enter the actual equipment source dimensions.</p>'+
       this.field('type',entity.type,'text','required maxlength="70"')+
       this.field('name',entity.name,'text','required maxlength="100"')+
       this.field('length',entity.length,'number','min="0.001" step="any"')+
       this.field('width',entity.width,'number','min="0.001" step="any"')+
       this.field('height',entity.height,'number','min="0.001" step="any"')+
       this.select('unit',opts(['cm','mm','in']),entity.unit||'cm')+
       this.field('doorWidth',entity.doorWidth,'number','min="0.001" step="any"')+
       this.field('doorHeight',entity.doorHeight,'number','min="0.001" step="any"')+
       this.field('payload',entity.payload,'number','min="0.001" step="any"')+
       this.select('weightUnit',opts(['kg','lb']),entity.weightUnit||'kg')+
       this.field('headroom',entity.headroomPercent,'number','min="0" max="99" step="any"')+
       this.field('source',entity.sourceRef,'text','maxlength="200"')+
       this.field('verifiedBy',entity.verifiedBy,'text','maxlength="100"')+
       '<label class="wide pack-check"><input type="checkbox" name="sourceConfirmed"'+
       (entity.sourceConfirmed?' checked':'')+'><span>'+safe(l('confirm'))+'</span></label>';
   }else if(kind==='add-load'||kind==='load'){
     entity=p.loadEntries.find(x=>x.id===key)||{};title=l('record');
     if(!p.containerScenarios.length||!p.packConfigs.length)throw Error('Add a packing entry and container scenario first.');
     content=this.select('selectScene',p.containerScenarios.map(x=>[x.id,x.name]),entity.scenarioId)+
       this.select('selectPack',p.packConfigs.map(x=>[x.id,x.cartonStart+' – '+x.cartonEnd]),entity.configId)+
       this.field('loaded',entity.cartonCount,'number','required min="1" step="1"')+
       this.field('date',entity.date,'date','required')+
       this.field('evidence',entity.evidenceRef,'text','required maxlength="200"');
   }else if(kind==='freeze'){
     title=l('freeze');content='<p class="wide pack-note">'+safe(l('freezeNote'))+'</p>'+
       this.textArea('reason');
   }else if(kind==='reference'){
     title=l('reference');entity=p.meta.reference||{};
     content=this.field('sourceApp',entity.sourceApp,'text','maxlength="60"')+
       this.field('recordType',entity.recordType,'text','maxlength="60"')+
       this.field('recordId',entity.recordId,'text','maxlength="90"')+
       this.field('revisionId',entity.revisionId,'text','maxlength="60"')+
       this.field('sourceDate',entity.sourceDate,'date')+
       this.field('verifiedBy',entity.verifiedBy,'text','maxlength="100"')+
       this.field('verifiedAt',entity.verifiedAt,'date')+
       this.textArea('displaySnapshot',entity.displaySnapshot);
   }else throw Error('Unknown form.');
   this.openDialog(title,formStart+content+finish);
 }
 submit(form){
   try{
     const f=Object.fromEntries(new FormData(form).entries()),type=form.dataset.form;
     const text=k=>trim(f[k]),num=k=>text(k)===''?null:Number(text(k));
     if(type==='new'){
       if(!text('buyer')||!text('factory')||!text('po')||!text('style')||!text('source'))throw Error('Enter all order details and their source.');
       this.current=PackingMath.create({buyer:text('buyer'),factory:text('factory'),
         po:text('po'),style:text('style'),sourceRef:text('source')});
       this.dirty=true;this.section='order';
     }else if(type==='meta'){
       this.commit('Order header updated',p=>{p.meta={...p.meta,buyer:text('buyer'),factory:text('factory'),
         po:text('po'),style:text('style'),sourceRef:text('source')};});
     }else if(type==='add-line'||type==='line'){
       this.commit('PO quantity line updated',p=>{const item={id:text('id')||id('L'),style:text('style'),
         color:text('color'),size:text('size'),quantity:num('qty'),sourceRef:text('source')};
         p.orderLines=p.orderLines.filter(x=>x.id!==item.id).concat([item]);});
     }else if(type==='add-carton'||type==='carton'){
       this.commit('Carton specification updated',p=>{const item={id:text('id')||id('C'),code:text('code'),
         length:num('length'),width:num('width'),height:num('height'),unit:text('unit'),
         grossWeight:num('gross'),netWeight:num('net'),weightUnit:text('weightUnit'),
         sourceRef:text('source')};p.cartonSpecs=p.cartonSpecs.filter(x=>x.id!==item.id).concat(item);});
     }else if(type==='add-pack'||type==='pack'){
       this.commit('Packing configuration updated',p=>{
         const composition=p.orderLines.map(line=>({lineId:line.id,pieces:num('q_'+line.id)||0})).filter(x=>x.pieces);
         const partial=p.orderLines.map(line=>({lineId:line.id,pieces:num('p_'+line.id)||0})).filter(x=>x.pieces);
         const item={id:text('id')||id('P'),specId:text('selectCarton'),
           packType:composition.length===1?'solid':'mixed',
           piecesPerCarton:composition.reduce((s,x)=>s+x.pieces,0),
           fullCartons:num('full'),cartonStart:text('start'),cartonEnd:text('end'),
           partialGrossWeight:num('partialWeight'),sourceRef:text('packSource'),
           composition,partialComposition:partial};
         p.packConfigs=p.packConfigs.filter(x=>x.id!==item.id).concat(item);});
     }else if(type==='add-scene'||type==='scene'){
       this.commit('Container scenario updated',p=>{
         const item={id:text('id')||id('S'),name:text('name'),type:text('type'),
           length:num('length'),width:num('width'),height:num('height'),
           doorWidth:num('doorWidth'),doorHeight:num('doorHeight'),unit:text('unit'),
           payload:num('payload'),weightUnit:text('weightUnit'),
           headroomPercent:num('headroom'),sourceRef:text('source'),
           verifiedBy:text('verifiedBy'),sourceConfirmed:form.querySelector('[name="sourceConfirmed"]').checked};
         p.containerScenarios=p.containerScenarios.filter(x=>x.id!==item.id).concat(item);});
     }else if(type==='add-load'||type==='load'){
       this.commit('Manual loaded carton count updated',p=>{
         const item={id:text('id')||id('LD'),scenarioId:text('selectScene'),
           configId:text('selectPack'),cartonCount:num('loaded'),date:text('date'),evidenceRef:text('evidence')};
         p.loadEntries=p.loadEntries.filter(x=>x.id!==item.id).concat(item);});
     }else if(type==='reference'){
       this.commit('Reviewed PO reference recorded',p=>{
         p.meta.reference={sourceApp:text('sourceApp'),recordType:text('recordType'),
           recordId:text('recordId'),revisionId:text('revisionId'),sourceDate:text('sourceDate'),
           verifiedBy:text('verifiedBy'),verifiedAt:text('verifiedAt'),
           displaySnapshot:text('displaySnapshot')};});
     }else if(type==='freeze'){
       if(!text('reason'))throw Error('Enter a reason before freezing a local revision.');
       this.commit('Local revision frozen: '+text('reason').slice(0,120),p=>{
         p.frozenSnapshots.push({revision:p.revision,at:new Date().toISOString(),
           reason:text('reason').slice(0,300),record:deep({...p,frozenSnapshots:[],audit:[]})});
         p.status='frozen-local';});
     }
     this.dialog.close();this.render();
   }catch(e){
     let box=form.querySelector('[role=alert]');
     if(!box){box=document.createElement('p');box.setAttribute('role','alert');box.className='pack-alert pack-danger';form.prepend(box);}
     box.textContent=e.message;
   }
 }
 download(data,name,mime){const blob=data instanceof Blob?data:new Blob([data],{type:mime});
   const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;
   document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);
 }
 excel(){
   if(!this.current)throw Error('Open a plan first.');
   if(!root.XLSX?.utils?.book_new)throw Error('The locally bundled Excel library is unavailable.');
   const sheets=PackingReport.rows(this.current,PackingMath.analyze(this.current));
   const wb=root.XLSX.utils.book_new();
   for(const [name,rows] of Object.entries(sheets)){
     const arr=rows.map(r=>r.map(PackingReport.csvSafe));
     const ws=root.XLSX.utils.aoa_to_sheet(arr);
     ws['!cols']=rows[0].map(()=>({wch:24}));
     root.XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31));
   }
   const bytes=root.XLSX.write(wb,{bookType:'xlsx',type:'array',compression:true});
   this.download(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
     'VESA-PACKING-'+this.current.id+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
 }
}
root.VesaPacking360=Object.freeze({PackingMath,PackingStore,PackingReport,VERSION,COPY_VERSION});
if(typeof module!=='undefined'&&module.exports)module.exports=root.VesaPacking360;
if(typeof document!=='undefined'){
 const open=()=>new PackingWorkspace().start();
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',open);else open();
}
})(typeof globalThis!=='undefined'?globalThis:this);
</script>
