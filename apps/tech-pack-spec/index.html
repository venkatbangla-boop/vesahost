<script>
(function(global){

/**
 * APP-03 garment measurement calculation owner. All values are fixed-point

 * No buyer rule, grading increment, approval or tolerance is synthesized.

class GarmentSpecEngine{
 static scaled(value,signed=false){

  const re=signed?/^(-?)(\d{1,8})(?:\.(\d{1,4}))?$/:/^(\d{1,8})(?:\.(\d{1,4}))?$/;

  if(from==='cm'&&to==='in')return (n*100n+127n)/254n;

 }
 static base(pom){return pom?.baseReviewed===true&&trim(pom.baseSource)&&trim(pom.reviewedBy)&&this.date(pom.reviewDate);}
 static tolerance(pom){return pom?.toleranceReviewed===true&&trim(pom.toleranceSource)&&trim(pom.toleranceReviewedBy);}
 static gradeReady(rule){return rule?.reviewed===true&&trim(rule.sourceRef)&&trim(rule.reviewedBy)&&this.date(rule.reviewDate);}
 static project(p,options={}){
  const cells=[],problems=[],baseIndex=p.meta?.sizes?.indexOf(p.meta.baseSize)??-1;
  const precision=p.meta?.precision,rule=p.meta?.rounding;
  if(baseIndex<0||!Array.isArray(p.meta.sizes))return {cells,problems:['Specify a valid base size and size sequence.']};
  for(const pom of p.poms){
   const base=this.scaled(pom.baseValue),minus=this.scaled(pom.toleranceMinus),
     plus=this.scaled(pom.tolerancePlus);

     for(let i=baseIndex;i!==j;i+=direction){
      const from=p.meta.sizes[Math.min(i,i+direction)],to=p.meta.sizes[Math.max(i,i+direction)];
      const matched=p.grades.filter(x=>x.pomId===pom.id&&x.fromSize===from&&x.toSize===to);

     low=t-minus;high=t+plus;
     if(low<0n){low=null;high=null;missing='Lower tolerance is below zero';}

      source:pom.baseSource,issue:missing||(!this.tolerance(pom)?'Asymmetric tolerance requires reviewed source':'')};

    if(options.basis&&options.basis!==pom.basis&&t!==null){
      if(!['flat','circumference'].includes(options.basis)||pom.geometry!=='girth'||
        pom.conversionReviewed!==true||!trim(pom.conversionSource)||!trim(pom.conversionBy)){

    if(options.unit&&options.unit!==pom.unit&&convertedTarget!==null){
      if(!['in','cm'].includes(options.unit)){

        result.issue='Unsupported output unit';
      }else{
        const unitConvert=value=>value===null?null:this.convert(value,pom.unit,options.unit);
        convertedTarget=unitConvert(convertedTarget);

      }
    }
    result.target=convertedTarget===null?null:this.text(convertedTarget,precision,rule);
    result.lower=convertedLower===null?null:this.text(convertedLower,precision,rule);

 static validate(p){

    !Array.isArray(p.grades)||!Array.isArray(p.bom)||!Array.isArray(p.revisions)||!Array.isArray(p.audit))
    return {ok:false,errors:['Unsupported tech-spec saved-record format.']};
  const meta=p.meta;
  if(!trim(meta.style)||!trim(meta.fabric)||!trim(meta.category)||!trim(meta.sourceRef)||
     !trim(meta.gender)||!trim(meta.season))errors.push('Style/fabric/category/gender/season and original source are required.');
  if(new Set(meta.sizes).size!==meta.sizes.length||!meta.sizes.length||meta.sizes.length>20||
     meta.sizes.some(s=>!trim(s))||!meta.sizes.includes(meta.baseSize))
    errors.push('Size range requires unique named sizes with a real base size.');

    errors.push('Choose an explicit measurement precision and rounding convention.');

   if(pomIds.has(pom.id)||codes.has(trim(pom.code).toLowerCase()))
     errors.push('Duplicate POM IDs or measurement codes.');
   pomIds.add(pom.id);codes.add(trim(pom.code).toLowerCase());
   if(!trim(pom.code)||!trim(pom.name)||!trim(pom.location)||!trim(pom.baseSource)||
      !['cm','in'].includes(pom.unit)||!['flat','circumference'].includes(pom.basis)||
      !['girth','length','other'].includes(pom.geometry)||this.scaled(pom.baseValue)===null||
      this.scaled(pom.baseValue)<=0n)errors.push('POM needs code/description/location, positive base value, explicit unit/basis/geometry and source.');
   if(pom.baseReviewed===true&&(!trim(pom.reviewedBy)||!this.date(pom.reviewDate)))
      errors.push('Source-reviewed POM needs reviewer and valid date.');
   if(trim(pom.toleranceMinus)||trim(pom.tolerancePlus)||pom.toleranceReviewed){
    if(this.scaled(pom.toleranceMinus)===null||this.scaled(pom.tolerancePlus)===null||
      !trim(pom.toleranceSource))errors.push('Separate plus/minus tolerances need exact nonnegative values and written source.');
   }
   if(pom.toleranceReviewed===true&&!trim(pom.toleranceReviewedBy))
      errors.push('Reviewed tolerance needs named local reviewer.');
   if(pom.conversionReviewed===true&&(pom.geometry!=='girth'||!trim(pom.conversionSource)||!trim(pom.conversionBy)))
      errors.push('Flat/circumference conversion requires explicit girth geometry and reviewed rule.');
  }

   const key=g.pomId+'|'+g.fromSize+'|'+g.toSize;
   if(gradeKeys.has(key))errors.push('Duplicate POM size-transition grade.');gradeKeys.add(key);
   const index=meta.sizes.indexOf(g.fromSize);
   const pom=p.poms.find(x=>x.id===g.pomId);
   if(!pom||index<0||meta.sizes[index+1]!==g.toSize||g.unit!==pom.unit||
     this.scaled(g.delta,true)===null||!trim(g.sourceRef))
     errors.push('Grade must be a sourced adjacent-size transition matching POM unit.');
   if(g.reviewed===true&&!this.gradeReady(g))errors.push('Reviewed grade needs actor, source and date.');
  }
  for(const bom of p.bom){
   if(!['fabric','trim','construction','packing','other'].includes(bom.kind)||
     !trim(bom.description)||!trim(bom.sourceRef)||!trim(bom.id))
     errors.push('Each fabric, trim, construction or packing instruction needs a source reference.');

   if(ids.has(snap.id))errors.push('Duplicate specification revision ID.');ids.add(snap.id);
   if(!trim(snap.id)||!trim(snap.approver)||!trim(snap.evidenceRef)||!this.date(snap.effectiveDate)||
      !snap.snapshot||!Array.isArray(snap.snapshot.poms))errors.push('Recorded specification revision needs dated document, actor and immutable snapshot.');

 static compare(current,snapshot){
  if(!snapshot)return [];
  const old=snapshot.snapshot||{},rows=[];
  for(const field of ['meta','poms','grades','bom']){
   const before=JSON.stringify(old[field]??null),after=JSON.stringify(current[field]??null);

/** Browser-local versioned records and checksum-only corruption guard (not auth). */
class TechSpecStore{

 static digest(text){let v=2166136261;for(let i=0;i<text.length;i++){v^=text.charCodeAt(i);v=Math.imul(v,16777619);}return (v>>>0).toString(16);}
 static validate(p){const valid=GarmentSpecEngine.validate(p);
  if(!valid.ok)throw Error(valid.errors.join('\n'));
  if(!trim(p.id)||!Number.isSafeInteger(p.revision)||p.revision<0||JSON.stringify(p).length>MAX_BYTES)
   throw Error('Invalid or oversized specification record.');
  return p;
 }
 read(){let raw;try{raw=localStorage.getItem(this.key);}catch{throw Error('Browser storage unavailable.');}
  if(!raw)return [];const box=JSON.parse(raw);
  if(box.version!==VERSION||!Array.isArray(box.records))throw Error('Local version not supported.');
  return box.records;
 }
 list(){return this.read().map(p=>({id:p.id,style:p.meta.style,category:p.meta.category,revision:p.revision,at:p.updatedAt}));}
 load(id){const p=this.read().find(r=>r.id===id);if(!p)return null;TechSpecStore.validate(p);return clone(p);}
 save(p){
  TechSpecStore.validate(p);const records=[clone(p),...this.read().filter(x=>x.id!==p.id)];
  const contents=JSON.stringify({version:VERSION,records});
  if(contents.length>MAX_BYTES)throw Error('Too many local saved records. Download Saved Copy first.');
  const tmp=this.key+'.tmp';
  try{localStorage.setItem(tmp,contents);localStorage.setItem(this.key,contents);}
  catch{throw Error('Local save failed; prior records were not intentionally deleted.');}
  finally{try{localStorage.removeItem(tmp)}catch{}}
  return p.id;
 }
 static encode(p){this.validate(p);const text=JSON.stringify(p);
  return JSON.stringify({format:FORMAT,checksum:this.digest(text),exportedAt:new Date().toISOString(),record:p});}
 static decode(text){
  if(typeof text!=='string'||text.length>MAX_BYTES)throw Error('Saved copy exceeds safe size.');
  const box=JSON.parse(text);
  if(box?.format!==FORMAT||!box.record||box.checksum!==this.digest(JSON.stringify(box.record)))
   throw Error('Saved copy is altered or unsupported. Existing records remain unchanged.');
  this.validate(box.record);return clone(box.record);
 }
}
/** Export projection; any untrusted spreadsheet-leading character is escaped. */
class TechSpecReport{
 static sheets(p,calculated,changes){
  const findPom=id=>p.poms.find(x=>x.id===id)||{};
  return {
   'Measurement Specification':[['POM','Name','Location','Size','Target','Minus bound','Plus bound','Unit','Basis','Source / issue'],
    ...calculated.cells.map(x=>[x.code,findPom(x.pomId).name,findPom(x.pomId).location,x.size,x.target??'Needs Information',
     x.lower??'Needs Information',x.upper??'Needs Information',x.unit,x.basis,x.issue||x.source])],
   'Grading':[['POM','From size','To size','Grade','Unit','Reviewed source','Reviewed by','Reviewed date'],
    ...p.grades.map(x=>[findPom(x.pomId).code,x.fromSize,x.toSize,x.delta,x.unit,x.sourceRef,x.reviewedBy,x.reviewDate])],
   'Tolerance Matrix':[['POM','Minus','Plus','Unit','Basis','Tolerance source','Local review'],
    ...p.poms.map(x=>[x.code,x.toleranceMinus||'Needs Information',x.tolerancePlus||'Needs Information',
     x.unit,x.basis,x.toleranceSource||'Needs Information',x.toleranceReviewed?'Locally reviewed':'Needs Information'])],
   'BOM Construction':[['Kind','Description','Source','Note','Reference image path'],
    ...p.bom.map(x=>[x.kind,x.description,x.sourceRef,x.note,x.photoRef])],
   'Revision Comparison':[['Field','Older confirmed revision','Current draft'],
    ...changes.map(x=>[x.field,JSON.stringify(x.before),JSON.stringify(x.after)])],
   'Revision History':[['Revision','Recorded at','Actor','Evidence','Effective','Local status'],
    ...p.revisions.map(x=>[x.recordRevision,x.recordedAt,x.approver,x.evidenceRef,x.effectiveDate,
      'Source declared — authenticity not independently verified'])],
   'Order Source':[['Field','Value'],...Object.entries(p.meta).map(([k,v])=>[k,
      typeof v==='object'?JSON.stringify(v):v])]
  };
 }
 static html(p,calc,changes){
  const sheets=this.sheets(p,calc,changes);
  return '<article class="sp-report"><h2>VESA Tech Pack & Spec 360 · DRAFT</h2><p class="sp-note">'+
   escape(DISCLAIMER)+'</p>'+Object.entries(sheets).map(([name,rows])=>
   '<section><h3>'+escape(name)+'</h3><div class="sp-scroll"><table class="sp-table"><thead><tr>'+
   rows[0].map(v=>'<th>'+escape(v)+'</th>').join('')+'</tr></thead><tbody>'+
   rows.slice(1,1501).map(row=>'<tr>'+row.map(x=>'<td>'+escape(x??'Needs Information')+'</td>').join('')+'</tr>').join('')+
   '</tbody></table></div></section>').join('')+'</article>';
 }
 static excelRows(rows,sheetName){
  return rows.map((row,i)=>row.map((v,j)=>{
   const numeric=sheetName==='Measurement Specification'&&i>0&&[4,5,6].includes(j)||
     sheetName==='Grading'&&i>0&&j===3||sheetName==='Tolerance Matrix'&&i>0&&[1,2].includes(j);
   return numeric&&typeof v==='string'&&/^-?\d+(\.\d{1,4})?$/.test(v)?Number(v):sheetSafe(v);
  }));
 }
}

const TECH_LAB_TABS=['summary','poms','grades','bom','revisions','reports'];
/** Single application controller for local record editing, saved-copy and six VESA menus. */
class TechSpecWorkspace{
 constructor(){

  this.body.innerHTML=html;if(!this.dialog.open)this.dialog.showModal();

  this.body.querySelector('input:not([type=hidden]),select,button')?.focus?.();
 }

  const Shell=global.VesaWorkspaceShell?.VesaWorkspaceShell;

  const session=global.VesaAuth?.session?.()||{};
  this.shell=new Shell({root:document.body,descriptor:{id:'tech-pack-spec',name:'VESA Tech Pack & Spec 360',
    route:'/apps/tech-pack-spec/',contentTarget:'#specMain',savedState:'Unsaved changes',

   }catch(error){this.alert(error.message);}

 menu(name){
  const commands={Home:[['home','back'],['new','new'],['continue','continue'],['practice','practice']],
   File:[['save','save'],['download','download'],['upload','upload'],['open','open']],
   Edit:[['meta','details'],['add-pom','poms'],['add-grade','grades'],['add-bom','bom']],
   View:[['summary','summary'],['poms','poms'],['grades','grades'],['bom','bom']],
   Tools:[['report','report'],['approve','approval'],['reference','reference']],
   Help:[['help','title'],['practice','practice']]};
  this.dialogShow(name,'<div class="sp-actions">'+(commands[name]||[]).map(([action,label])=>

 action(action,id){
  try{
   if(action==='home'||action==='open'){this.current=null;this.section='summary';this.dirty=false;this.render();return;}
   if(action==='new')return this.form('new');
   if(action==='practice'){this.current=GarmentSpecEngine.practice();this.section='summary';this.dirty=false;this.render();return;}
   if(action.startsWith('preview-')){
    const section=action.slice('preview-'.length);
    if(!TECH_LAB_TABS.includes(section))throw Error('Unknown measurement practice section.');
    this.current=GarmentSpecEngine.practice();this.section=section;this.dirty=false;
    this.render();return;
   }
   if(action==='continue'){const all=this.store.list();if(!all.length)throw Error('No saved specs on this device.');
    return this.action('open-record',all[0].id);}
   if(action==='open-record'){const p=this.store.load(id);if(!p)throw Error('Saved specification not found.');
    this.current=p;this.section='summary';this.dirty=false;this.render();return;}
   if(action==='upload'){this.file.click();return;}
   if(action==='save'){if(!this.current||this.current.mode==='practice')throw Error('Practice cannot be saved as production evidence.');
    this.store.save(this.current);this.dirty=false;this.render();return;}
   if(action==='download'){if(!this.current||this.current.mode==='practice')throw Error('Open a real local spec first.');
    this.download(TechSpecStore.encode(this.current),'VESA-TECHSPEC-'+this.current.id+'.vesaspec','application/json');return;}
   if(['summary','poms','grades','bom','revisions','reports'].includes(action)){
    if(!this.current)throw Error('Open a specification first.');this.section=action;this.render();return;}
   if(action==='report'){if(!this.current)throw Error('Open a specification.');this.section='reports';this.render();return;}
   if(action==='excel')return this.excel();
   if(action==='print'){if(!this.current)throw Error('Open a specification.');this.section='reports';this.render();global.print();return;}
   if(action==='help')return this.dialogShow('Tech Pack & Spec 360','<p>'+escape(DISCLAIMER)+'</p>'+
    '<p>Enter a sourced POM value and explicitly signed size-transition grades. A missing approval/tolerance displays Needs Information. Use Save Now and Download Saved Copy. User-entered buyer approval evidence does not mean this system verified the buyer.</p>');
   if(['meta','add-pom','add-grade','add-bom','approve','reference'].includes(action))return this.form(action);
   if(action.startsWith('edit-'))return this.form(action.slice(5),id);
   if(action.startsWith('delete-'))return this.remove(action.slice(7),id);
  }catch(error){this.alert(error.message);}

 update(label,callback){

 form(kind,id){

 submit(form){
  try{
   const values=Object.fromEntries(new FormData(form).entries()),
     get=k=>trim(values[k]),type=form.dataset.form,flag=k=>form.querySelector('[name="'+k+'"]')?.checked||false;
   if(type==='new'){
    const sizes=get('sizes').split(',').map(x=>x.trim()).filter(Boolean);
    const profile={style:get('style'),fabric:get('fabric'),category:get('category'),gender:get('gender'),
      season:get('season'),sourceRef:get('source'),sizes,baseSize:get('baseSize'),
      precision:get('precision')===''?null:Number(get('precision')),rounding:get('rounding')};
    const item=GarmentSpecEngine.make(profile);item.meta.sketchReference=get('photoRef');
    TechSpecStore.validate(item);
    this.current=item;this.section='poms';this.dirty=true;
   }else if(type==='meta'){
    this.update('Style spec source profile updated',p=>{
     const sizes=get('sizes').split(',').map(x=>x.trim()).filter(Boolean);
     if(p.poms.length&&(JSON.stringify(p.meta.sizes)!==JSON.stringify(sizes)||
       p.meta.baseSize!==get('baseSize')))
      throw Error('Size range changes need a separate approved revision workflow; existing POM grades remain protected.');
     p.meta={...p.meta,style:get('style'),fabric:get('fabric'),category:get('category'),gender:get('gender'),
      season:get('season'),sourceRef:get('source'),sizes,baseSize:get('baseSize'),
      precision:get('precision')===''?null:Number(get('precision')),rounding:get('rounding'),
      sketchReference:get('photoRef')};
    });
   }else if(type==='add-pom'||type==='pom'){
    this.update('POM measurement source updated',p=>{
     const id=get('id')||uniqueId('POM'),before=p.poms.find(x=>x.id===id);
     const item={id,code:get('code'),name:get('name'),location:get('location'),geometry:get('geometry'),
      basis:get('basis'),unit:get('unit'),baseValue:get('baseValue'),baseSource:get('baseSource'),
      baseReviewed:flag('reviewed'),reviewedBy:get('reviewedBy'),reviewDate:get('reviewDate'),
      toleranceMinus:get('toleranceMinus'),tolerancePlus:get('tolerancePlus'),
      toleranceSource:get('toleranceSource'),toleranceReviewed:flag('toleranceReviewed'),
      toleranceReviewedBy:get('toleranceReviewedBy'),
      conversionReviewed:flag('conversionReviewed'),conversionSource:get('conversionSource'),
      conversionBy:get('conversionBy')};
     if(before&&before.unit!==item.unit&&p.grades.some(x=>x.pomId===id))
      throw Error('Remove/replace the sourced grades before changing a POM measurement unit.');
     p.poms=p.poms.filter(x=>x.id!==id).concat(item);
    });
   }else if(type==='add-grade'||type==='grade'){
    this.update('Size-transition source grade updated',p=>{
     const id=get('id')||uniqueId('GR'),pom=p.poms.find(x=>x.id===get('code'));
     if(!pom)throw Error('Select an actual POM.');
     const item={id,pomId:pom.id,fromSize:get('fromSize'),toSize:get('toSize'),
      delta:get('delta'),unit:pom.unit,sourceRef:get('gradeSource'),
      reviewed:flag('reviewed'),reviewedBy:get('reviewedBy'),reviewDate:get('reviewDate')};
     p.grades=p.grades.filter(x=>x.id!==id).concat(item);
    });
   }else if(type==='add-bom'||type==='bom'){
    this.update('BOM/construction source updated',p=>{
     const id=get('id')||uniqueId('BOM'),item={id,kind:get('kind'),description:get('description'),
      sourceRef:get('source'),photoRef:get('photoRef'),note:get('note')};
     p.bom=p.bom.filter(x=>x.id!==id).concat(item);
    });
   }else if(type==='approve'){
    if(!flag('reviewed'))throw Error('Confirm you have independently reviewed an actual buyer source document.');
    this.update('External specification decision recorded from user-entered evidence',p=>{
     if(!p.poms.length||GarmentSpecEngine.project(p).cells.some(x=>x.target===null))
      throw Error('Do not record an approved revision with unknown POM base/size grades.');
     if(!trim(get('approver'))||!trim(get('evidence'))||!GarmentSpecEngine.date(get('effective')))
      throw Error('Approver, original evidence source and date are required.');
     p.revisions.push({id:uniqueId('REV'),recordRevision:p.revision+1,
       recordedAt:new Date().toISOString(),approver:get('approver'),
       evidenceRef:get('evidence'),effectiveDate:get('effective'),
       reason:get('reason'),snapshot:{meta:clone(p.meta),poms:clone(p.poms),
         grades:clone(p.grades),bom:clone(p.bom)}});
    });
   }else if(type==='reference'){
    this.update('Manual reviewed source reference attached',p=>{
     p.meta.reference=Object.fromEntries(
      ['sourceApp','recordType','recordId','revisionId','sourceDate','verifiedBy','verifiedAt','displaySnapshot']
       .map(k=>[k,get(k)]));
    });
   }
   this.dialog.close();this.render();
  }catch(e){
   let error=form.querySelector('[role=alert]');
   if(!error){error=document.createElement('p');error.className='sp-warning wide';error.setAttribute('role','alert');form.prepend(error);}
   error.textContent=e.message;
  }
 }
 download(contents,name,mime){
  const blob=contents instanceof Blob?contents:new Blob([contents],{type:mime});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);
 }
 excel(){
  if(!this.current)throw Error('Open a spec first.');
  if(!global.XLSX?.utils?.book_new)throw Error('Local Excel exporter is not loaded.');
  const p=this.current,project=GarmentSpecEngine.project(p),last=p.revisions.at(-1);
  const sheets=TechSpecReport.sheets(p,project,GarmentSpecEngine.compare(p,last));
  const wb=global.XLSX.utils.book_new();
  for(const [name,rows] of Object.entries(sheets)){
   const table=TechSpecReport.excelRows(rows,name),sheet=global.XLSX.utils.aoa_to_sheet(table);
   sheet['!cols']=rows[0].map(()=>({wch:27}));
   global.XLSX.utils.book_append_sheet(wb,sheet,name.slice(0,31));
  }
  const data=global.XLSX.write(wb,{bookType:'xlsx',type:'array',compression:true});
  this.download(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
    'VESA-TECHPACK-'+p.id+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
 }
}
global.VesaTechSpec360=Object.freeze({GarmentSpecEngine,TechSpecStore,TechSpecReport,VERSION,FORMAT});
if(typeof module!=='undefined'&&module.exports)module.exports=global.VesaTechSpec360;
if(typeof document!=='undefined'){
 const run=()=>new TechSpecWorkspace().begin();
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
}
})(typeof globalThis!=='undefined'?globalThis:this);
