<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>App Centre | VESA Enterprise Inc</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/css/vesa-workspace.css?v=20261013-platform-g09">
  <link rel="stylesheet" href="/css/vesa-app-centre.css?v=20261018-u02">
  <script src="/js/preferences.js?v=20261015-costing-demo"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/vesa-workspace-shell.js?v=20261013-platform-g09"></script>
  <script src="/js/app-catalogue.js?v=20261018-egenva-v2&rollback=20261019-20"></script>
  <script src="/js/vesa-app-centre.js?v=20261018-egenva-v2&rollback=20261019-20"></script>
</head>
<body class="app-centre-page">
  <script>VesaAuth.requireAuth();</script>
  <main class="app-centre-shell" id="appCentreMain">
    <section class="app-centre-hero" aria-labelledby="centreTitle">
      <div>
        <span class="app-centre-eyebrow" data-centre-copy="eyebrow">YOUR WORKSPACES</span>
        <h1 id="centreTitle" data-centre-copy="title">Find the right tool for the job</h1>
        <p class="app-centre-lead" data-centre-copy="intro">Planning, production, sourcing and reports in one organised place.</p>
      </div>
      <div class="app-centre-total">
        <strong id="appCount">20</strong>
        <span data-centre-copy="available">Available applications</span>
      </div>
    </section>
    <section class="app-centre-tools" aria-label="Find applications">
      <div class="app-centre-search">
        <label for="appSearch" data-centre-copy="search">Find an application</label>
        <input id="appSearch" type="search" placeholder="Search by app, task or report…" autocomplete="off" spellcheck="false">
      </div>
      <button id="appClear" class="app-clear" data-centre-copy="clear" type="button" hidden>Clear search</button>
    </section>
    <div class="app-centre-toolbar">
      <div id="appFilters" class="app-filters" role="group" aria-label="Filter applications"></div>
      <p id="appResults" class="app-results" role="status" aria-live="polite"></p>
    </div>
    <section class="app-catalogue" aria-label="Applications" id="appCatalogue" tabindex="-1">
      <p role="status">Opening applications…</p>
    </section>
  </main>
  <script>
    const pageSession=VesaAuth.session();
    const pageShell=new VesaWorkspaceShell.VesaWorkspaceShell({
      root:document.body,
      descriptor:{id:'app-centre',name:'Workspaces',route:'/apps/',savedState:'Local browser only',userLabel:pageSession?.name||pageSession?.email||'',userRole:pageSession?.role||''},
      callbacks:{
        menu(name){
          if(name==='Edit')return pageShell.openSettings();
          if(name==='Tools'&&pageSession?.role==='admin'){location.href='/admin/';return;}
          const target=name==='Home'||name==='Help'?document.querySelector('.app-centre-hero'):document.getElementById('appCatalogue');
          target?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});target?.focus?.({preventScroll:true});
        }
      }
    });
    pageShell.mount();
    const explorer=new VesaAppCentreExplorer({
      catalogue:document.getElementById('appCatalogue'),
      filters:document.getElementById('appFilters'),
      search:document.getElementById('appSearch'),
      clear:document.getElementById('appClear'),
      status:document.getElementById('appResults'),
      count:document.getElementById('appCount')
    });
    explorer.mount();
  </script>
</body>
</html>
