<script>
(function(global){
'use strict';
const VERSION='VESA-OC360-PLAN-1',COPY_VERSION='VESA-OC360-COPY-1',PREFIX='vesa.order-commission.records.v1.';
const MAX_BYTES=2*1024*1024;
const guide='Planning and locally reviewed commission evidence only. Expected is not earned; invoices are not receipts; browser records are not bank or buyer certification.';
const trim=value=>String(value??'').trim();
const copy=value=>JSON.parse(JSON.stringify(value));
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sheetCell=v=>typeof v==='number'?v:/^[=+\-@\t\r]/.test(String(v??''))?"'"+String(v):String(v??'');
const keygen=p=>p+'-'+(global.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
/**
 * Exact decimal-money owner. No binary-float multiplication for contracted FOB,
 * rate, adjustment or receipt. Base FOB/unit prices use four decimal places;
 * commission payouts use two decimal places with EXPLICIT chosen rounding mode.
 * Accepts nonnegative amounts only. Currency conversion requires a sourced
 * local currency-to-agreement-currency exchange rate/date.
 */
class CommissionMoney{
 static parse(text,digits=2,zero=true){
  if(typeof text!=='string'&&typeof text!=='number')return null;
  const s=trim(text),re=new RegExp('^([0-9]{1,10})(?:\\.([0-9]{1,'+digits+'}))?$');
  const m=s.match(re);if(!m)return null;
  const n=BigInt(m[1])*10n**BigInt(digits)+BigInt((m[2]||'').padEnd(digits,'0'));
  return !zero&&n===0n?null:n;
 }
 static rate(value){const v=this.parse(value,4,false);return v!==null&&v<=1000000n?v:null;}
 static round(n,d,rule){if(d<=0n||n<0n)throw Error('Unsupported commission calculation.');
   if(rule==='total-half-up-2')return (n+d/2n)/d;
   if(rule==='total-down-2')return n/d;
   throw Error('Choose the documented commission rounding convention.');
 }
 static cents(n){if(n===null)return null;const sign=n<0n?'-':'';const x=n<0n?-n:n;
   return sign+(x/100n).toString()+'.'+(x%100n).toString().padStart(2,'0');}
 static value(n){return n===null?null:Number(this.cents(n));}
 static fob(line,rule){
   if(line.valueMode==='sourced-total')return this.parse(line.authoritativeFob,4,false);
   if(line.valueMode==='quantity-unit'){
     if(!Number.isSafeInteger(line.quantity)||line.quantity<=0||line.quantity>100000000)return null;
     const unit=this.parse(line.unitFob,4,false);
     return unit===null?null:BigInt(line.quantity)*unit;
   }
   return null;
 }
 static convert(receipt,agreement){
   const foreign=this.parse(receipt.amount,2,false);if(foreign===null)return null;
   if(receipt.currency===agreement.currency)return foreign;
   const fx=this.parse(receipt.fxRate,8,false);
   if(fx===null||!receipt.fxSource||!this.iso(receipt.fxDate))return null;
   // A foreign currency unit becomes fxRate agreement currency units.
   return this.round(foreign*fx,100000000n,agreement.rounding);
 }
 static iso(text){if(typeof text!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(text))return false;
   const t=Date.parse(text+'T00:00:00Z');return Number.isFinite(t)&&new Date(t).toISOString().slice(0,10)===text;}
}
/**
 * Pure commission projection. Input contains separately sourced agreement,
 * FOB lines, manual earning events, issued invoices, receipts and contract-
 * backed credits. Output distinguishes expected/earned/billed/paid/overdue
 * even when terms are unverified. Never infers a buyer milestone or default
 * percentage, FX rate, due date, payment or approval.
 */
class CommissionDomain{
 static blank(seed={},practice=false){
   const t=new Date().toISOString();
   return {version:VERSION,id:keygen('OC'),revision:0,createdAt:t,updatedAt:t,mode:practice?'practice':'local',
     meta:{buyer:trim(seed.buyer),factory:trim(seed.factory),po:trim(seed.po),style:trim(seed.style),
       sourceRef:trim(seed.sourceRef),manualReference:null},
     agreement:{id:keygen('AGR'),version:1,sourceRef:'',effectiveDate:'',ratePercent:'',currency:'',
       basis:'',rounding:'',earnedRule:'',debtor:'',confirmed:false,reviewedBy:'',reason:''},
     agreementHistory:[],lines:[],exclusions:[],earnings:[],invoices:[],receipts:[],adjustments:[],audit:[]};
 }
 static demo(){
   const p=this.blank({buyer:'SYNTHETIC BUYER',factory:'SYNTHETIC FACTORY',
     po:'DEMO-PO',style:'DEMO-TEE',sourceRef:'SYNTHETIC DOCUMENT ONLY'},true);
   p.agreement={...p.agreement,sourceRef:'DEMO SIGNED TERMS (NOT REAL)',effectiveDate:'2026-10-01',
     ratePercent:'3',currency:'USD',basis:'total-fob',rounding:'total-half-up-2',
     earnedRule:'manual-shipment-evidence',debtor:'factory',confirmed:true,reviewedBy:'Synthetic reviewer'};
   p.lines=[{id:'L1',po:'DEMO-PO',style:'DEMO-TEE',basis:'total-fob',valueMode:'quantity-unit',
     quantity:1000,unitFob:'2.5000',authoritativeFob:'',currency:'USD',sourceRef:'DEMO-FOB-001'}];
   return p;
 }
 static analyze(p,asOf=''){
  const errors=[],notes=[],detail=[],overdue=[],A=p?.agreement||{},ids=new Set(),lines=[],currency=A.currency;
  if(!p||p.version!==VERSION||!Array.isArray(p.lines)||!Array.isArray(p.earnings)||
     !Array.isArray(p.receipts)||!Array.isArray(p.invoices)||!Array.isArray(p.adjustments)||
     !Array.isArray(p.exclusions)||!Array.isArray(p.agreementHistory))
    return {ok:false,errors:['Unsupported commission record.'],notes,expected:null,earned:null,
      invoiced:null,received:null,outstanding:null,overdue:[],detail:[],basis:null,currency:null};
  const active=A.confirmed===true&&trim(A.sourceRef)&&trim(A.reviewedBy)&&
    CommissionMoney.iso(A.effectiveDate)&&['total-fob','shipped-fob','invoiced-fob','received-fob'].includes(A.basis)&&
    ['total-half-up-2','total-down-2'].includes(A.rounding)&&
    ['buyer','factory','other'].includes(A.debtor)&&trim(A.earnedRule)&&
    /^[A-Z]{3}$/.test(currency||'')&&CommissionMoney.rate(A.ratePercent)!==null;
  if(!active)notes.push('Written agreement terms, basis, rate, round policy and locally reviewed source are Needed Information.');
  let baseMicro=0n,excludedCents=0n,expected=null,earn=0n,billed=0n,paid=0n,credited=0n;
  for(const line of p.lines){
    if(ids.has(line.id))errors.push('Duplicate order commission line ID.');
    ids.add(line.id);
    const fob=CommissionMoney.fob(line,A.rounding);
    if(!trim(line.po)||!trim(line.style)||!trim(line.sourceRef)||line.basis!==A.basis||
       line.currency!==currency||fob===null)
      errors.push('FOB line needs a sourced PO/style, matching basis/currency and positive supported amount.');
    else{baseMicro+=fob;lines.push({id:line.id,po:line.po,style:line.style,source:line.sourceRef,
      baseFourDecimal:(fob/10000n).toString()+'.'+(fob%10000n).toString().padStart(4,'0')});}
  }
  if(!p.lines.length)notes.push('Enter at least one sourced FOB order line.');
  const excludeIds=new Set();
  for(const x of p.exclusions){
    if(excludeIds.has(x.id))errors.push('Duplicate exclusion ID.');excludeIds.add(x.id);
    const amount=CommissionMoney.parse(x.amount,2,false);
    if(amount===null||!trim(x.contractSource)||!trim(x.reason)||!CommissionMoney.iso(x.date))
      errors.push('Each excluded charge requires an agreement reference, amount, reason and recorded date.');
    else excludedCents+=amount;
  }
  if(excludedCents*100n>baseMicro)errors.push('Contract exclusions exceed total sourced FOB basis.');
  if(active&&p.lines.length&&errors.length===0){
    const commissionMicro=baseMicro-excludedCents*100n;
    expected=CommissionMoney.round(commissionMicro*CommissionMoney.rate(A.ratePercent),
      100000000n,A.rounding);
  }
  const earningIds=new Set();
  for(const e of p.earnings){
    if(earningIds.has(e.id))errors.push('Duplicate earned record.');earningIds.add(e.id);
    const amt=CommissionMoney.parse(e.amount,2,false);
    if(amt===null||e.currency!==currency||!trim(e.milestone)||e.milestone!==A.earnedRule||
       !CommissionMoney.iso(e.date)||!trim(e.evidenceRef)||!trim(e.actor))
      errors.push('Earned commission needs a matching documented milestone, currency, date, actor and evidence.');
    else earn+=amt;
  }
  if(p.earnings.length&&expected===null)errors.push('Cannot post earned commission without sourced agreement and FOB expectation.');
  if(expected!==null&&earn>expected)errors.push('Earned commission cannot exceed the current sourced expected amount.');
  const invoiceIds=new Set(),invoiceRefs=new Set(),invoiceAmounts=new Map(),applied=new Map();
  for(const inv of p.invoices){
    if(invoiceIds.has(inv.id)||invoiceRefs.has(trim(inv.invoiceNo).toLowerCase()))errors.push('Duplicate commission invoice ID/reference.');
    invoiceIds.add(inv.id);invoiceRefs.add(trim(inv.invoiceNo).toLowerCase());
    const amount=CommissionMoney.parse(inv.amount,2,false);
    if(amount===null||!trim(inv.invoiceNo)||inv.currency!==currency||!['draft','issued'].includes(inv.status))
      errors.push('Commission invoice needs positive amount, unique number and matching currency.');
    else if(inv.status==='issued'){
      if(!CommissionMoney.iso(inv.issuedOn)||!trim(inv.sourceRef)||!trim(inv.issuedBy))
        errors.push('Issued commission invoice needs a dated manual issuing actor and source.');
      billed+=amount;invoiceAmounts.set(inv.id,amount);
    }
  }
  if(billed>earn)notes.push('Issued invoice value exceeds locally recorded earned commission; review agreement milestone.');
  const receiptIds=new Set();
  for(const item of p.receipts){
    if(receiptIds.has(item.id))errors.push('Duplicate receipt ID.');receiptIds.add(item.id);
    if(!trim(item.ref)||!CommissionMoney.iso(item.date)||!trim(item.evidenceRef)||!trim(item.actor)||!trim(item.currency))
      errors.push('Receipt requires actual date, reference, currency, actor and evidence.');
    const value=CommissionMoney.convert(item,A);
    if(value===null){errors.push('Receipt amount or explicitly sourced currency conversion is invalid.');continue;}
    paid+=value;
    if(item.invoiceId){
      if(!invoiceAmounts.has(item.invoiceId))errors.push('Receipt allocation requires an issued invoice.');
      else applied.set(item.invoiceId,(applied.get(item.invoiceId)||0n)+value);
    }else notes.push('Unallocated receipt must be reconciled to an issued invoice separately.');
  }
  const adjustmentIds=new Set();
  for(const item of p.adjustments){
    if(adjustmentIds.has(item.id))errors.push('Duplicate adjustment ID.');adjustmentIds.add(item.id);
    const amount=CommissionMoney.parse(item.amount,2,false);
    if(amount===null||item.currency!==currency||!trim(item.contractRef)||!trim(item.reason)||
       !CommissionMoney.iso(item.date)||!trim(item.actor))
      errors.push('Credit/deduction needs contractual source, currency, dated actor, reason and positive amount.');
    else credited+=amount;
  }
  if(credited>earn)errors.push('Contractual deductions exceed earned commission.');
  if(paid>earn-credited)errors.push('Receipts exceed available earned commission after documented adjustments.');
  for(const inv of p.invoices){
    if(inv.status!=='issued')continue;
    const amount=invoiceAmounts.get(inv.id);if(amount===undefined)continue;
    const allocated=applied.get(inv.id)||0n;
    if(allocated>amount)errors.push('Allocated receipts exceed the issued invoice amount.');
    if(asOf&&CommissionMoney.iso(asOf)&&CommissionMoney.iso(inv.dueDate)&&inv.dueDate<asOf&&amount>allocated)
      overdue.push({invoiceNo:inv.invoiceNo,dueDate:inv.dueDate,open:CommissionMoney.cents(amount-allocated)});
    if(!CommissionMoney.iso(inv.dueDate))notes.push('Invoice '+inv.invoiceNo+' has no sourced due date; overdue cannot be calculated.');
  }
  const valid=errors.length===0;
  const outstanding=active&&valid?earn-credited-paid:null;
  return {ok:valid,errors,notes,active:Boolean(active),currency:currency||null,
    basis:A.basis||null,expected:expected===null?null:CommissionMoney.cents(expected),
    earned:active&&valid?CommissionMoney.cents(earn):null,
    invoiced:active&&valid?CommissionMoney.cents(billed):null,
    received:active&&valid?CommissionMoney.cents(paid):null,
    adjustment:active&&valid?CommissionMoney.cents(credited):null,
    outstanding:outstanding===null?null:CommissionMoney.cents(outstanding),
    overdue,details:lines,asOf:CommissionMoney.iso(asOf)?asOf:null};
 }
}
/** Private, browser-scoped record adapter and bounded checksummed portable copy. */
class CommissionStore{
 constructor(user){this.key=PREFIX+(trim(user).replace(/[^a-zA-Z0-9-]/g,'-').slice(0,100)||'local');}
 static hash(s){let v=2166136261;for(let i=0;i<s.length;i++){v^=s.charCodeAt(i);v=Math.imul(v,16777619);}return (v>>>0).toString(16);}
 static validate(p){
  const r=CommissionDomain.analyze(p);
  if(!r.ok)throw Error(r.errors.join('\n'));
  if(!trim(p.id)||!Number.isSafeInteger(p.revision)||p.revision<0||!p.meta||
     !Array.isArray(p.audit)||!Array.isArray(p.agreementHistory))
    throw Error('Unsupported commission record structure.');
  if(JSON.stringify(p).length>MAX_BYTES)throw Error('Saved commission record exceeds the safe local size.');
  return r;
 }
 read(){let raw;try{raw=localStorage.getItem(this.key)}catch{throw Error('Cannot read device-saved records.')}
  if(!raw)return [];
  const box=JSON.parse(raw);
  if(box.version!==VERSION||!Array.isArray(box.records))throw Error('Stored commission records are not a supported version.');
  return box.records;
 }
 list(){return this.read().map(x=>({id:x.id,po:x.meta.po,buyer:x.meta.buyer,revision:x.revision,at:x.updatedAt}));}
 open(id){const p=this.read().find(x=>x.id===id);if(!p)return null;this.constructor.validate(p);return copy(p);}
 save(p){
  this.constructor.validate(p);
  const list=[copy(p),...this.read().filter(x=>x.id!==p.id)];
  const value=JSON.stringify({version:VERSION,records:list});
  if(value.length>MAX_BYTES)throw Error('Local save limit exceeded; download your saved copy.');
  const temp=this.key+'.tmp';
  try{localStorage.setItem(temp,value);localStorage.setItem(this.key,value);}
  catch{throw Error('Local saving failed. Original saved records were not intentionally overwritten.');}
  finally{try{localStorage.removeItem(temp)}catch{}}
  return p.id;
 }
 static encode(p){this.validate(p);const content=JSON.stringify(p);
  return JSON.stringify({format:COPY_VERSION,hash:this.hash(content),exportedAt:new Date().toISOString(),record:p});}
 static decode(text){
  if(typeof text!=='string'||text.length>MAX_BYTES)throw Error('Saved copy is too large.');
  const box=JSON.parse(text);
  if(box?.format!==COPY_VERSION||!box.record||box.hash!==this.hash(JSON.stringify(box.record)))
    throw Error('This saved copy is altered or unsupported. Original records remain unchanged.');
  this.validate(box.record);return copy(box.record);
 }
}
/** Immutable escaped report projection, never represents local records as receipts/approval. */
class CommissionReport{
 static sheets(plan,calc){
  const rows={
   'Agreement':[['Field','Sourced value'],['Agreement ID',plan.agreement.id],
    ['Terms version',plan.agreement.version],['Buyer',plan.meta.buyer],
    ['Factory',plan.meta.factory],['PO',plan.meta.po],['Agreement source',plan.agreement.sourceRef],
    ['Basis',plan.agreement.basis||'Needs Information'],['Rate %',plan.agreement.ratePercent||'Needs Information'],
    ['Rounding',plan.agreement.rounding||'Needs Information'],['Currency',plan.agreement.currency||'Needs Information'],
    ['Earned milestone',plan.agreement.earnedRule||'Needs Information'],
    ['Locally reviewed',plan.agreement.confirmed?'Yes (not third-party approval)':'Needs Information']],
   'PO Commission':[['PO','Style','Basis','FOB source','FOB amount (4dp)','Currency'],
    ...calc.details.map(x=>[x.po,x.style,calc.basis,x.source,x.baseFourDecimal,calc.currency])],
   'Expected Earned Paid':[['Measure','Agreement currency value','Note'],
    ['Expected',calc.expected??'Needs Information','Not automatically earned'],
    ['Earned',calc.earned??'Needs Information','Separate milestone/evidence'],
    ['Issued invoices',calc.invoiced??'Needs Information','Draft invoices excluded'],
    ['Received',calc.received??'Needs Information','Currency conversions source-verified'],
    ['Deductions',calc.adjustment??'Needs Information','Documented contract credits'],
    ['Outstanding',calc.outstanding??'Needs Information','Earned minus receipts and deductions']],
   'Invoice Ledger':[['Invoice','Currency','Amount','Status','Issued date','Explicit due date','Document'],
    ...plan.invoices.map(x=>[x.invoiceNo,x.currency,x.amount,x.status,x.issuedOn,x.dueDate,x.sourceRef])],
   'Receipt Reconciliation':[['Reference','Date','Amount','Currency','Invoice allocation','FX rate','FX date','FX source','Evidence'],
    ...plan.receipts.map(x=>[x.ref,x.date,x.amount,x.currency,
      plan.invoices.find(inv=>inv.id===x.invoiceId)?.invoiceNo||'Unallocated',x.fxRate||'',x.fxDate||'',x.fxSource||'',x.evidenceRef])],
   'Earned and Credits':[['Kind','Amount','Currency','Date','Source','Milestone or reason'],
    ...plan.earnings.map(x=>['Earned',x.amount,x.currency,x.date,x.evidenceRef,x.milestone]),
    ...plan.adjustments.map(x=>['Deduction',x.amount,x.currency,x.date,x.contractRef,x.reason])],
   'Overdue':[['Invoice','Due date','Open amount', 'As of date'],
    ...calc.overdue.map(x=>[x.invoiceNo,x.dueDate,x.open,calc.asOf])],
   'Revision History':[['Version or revision','Date','Action','Source'],
    ...plan.audit.map(x=>[x.revision,x.at,x.action,x.sourceRef||'']),
    ...plan.agreementHistory.map(x=>[x.version,x.replacedAt,'Historical agreement',x.agreement.sourceRef])]
  };
  // Ensure money cells in the workbook have true numeric types; no formula
  // injection in untrusted source strings.
  for(const sheet of ['Expected Earned Paid','Overdue'])

      if(i===0||j!==1&&(sheet==='Expected Earned Paid'||j!==2))return x;
      return /^\d+(\.\d{2})$/.test(String(x))?Number(x):x;
    }));
  return rows;
 }

 }

   '</select></label>';

  this.shell=new global.VesaWorkspaceShell.VesaWorkspaceShell({root:document.body,
   descriptor:{id:'order-commission',name:'VESA Order & Commission 360',route:'/apps/order-commission/',
    contentTarget:'#commissionMain',userLabel:session.name||session.email||'',userRole:session.role||'',
    savedState:'Unsaved changes'},callbacks:{menu:name=>this.menu(name)}});
  this.shell.mount();
  document.getElementById('comClose').onclick=()=>this.close();
  this.main.onclick=event=>{const button=event.target.closest('[data-action]');
    if(button){event.preventDefault();this.action(button.dataset.action,button.dataset.id);}};
  this.dialog.addEventListener('submit',event=>{if(event.target.matches('form[data-form]')){
    event.preventDefault();this.submit(event.target);}});
  this.file.addEventListener('change',async()=>{
    const f=this.file.files?.[0];this.file.value='';if(!f)return;
    try{
      if(f.size>MAX_BYTES)throw Error('Saved copy exceeds safe size.');
      const p=CommissionStore.decode(await f.text());
      if(this.store.open(p.id)){p.id=keygen('OC-RESTORED');p.audit.push({at:new Date().toISOString(),action:'Restored a separate saved copy',revision:p.revision});}
      p.mode='local';this.store.save(p);this.current=p;this.section='summary';this.dirty=false;this.render();

  });
  global.addEventListener('vesa-preferences-change',()=>this.render());

   View:[['summary',this.tr('summary')],['lines',this.tr('lines')],['receipts',this.tr('receipts')],['history',this.tr('history')]],
   Tools:[['report',this.tr('report')],['add-invoice',this.tr('invoices')],['add-receipt',this.tr('receipts')],['add-adjustment',this.tr('adjustments')]],
   Help:[['help','How to use Commission 360'],['practice',this.tr('practice')]]};
  this.dialogOpen(name,'<div class="com-actions">'+(options[name]||[]).map(([action,label])=>

 action(action,id){
  try{
   if(action==='home'){this.current=null;this.section='summary';this.render();return;}
   if(action==='new')return this.form('new');
   if(action==='practice'){this.current=CommissionDomain.demo();this.section='summary';this.dirty=false;this.render();return;}
   if(action==='open'){this.current=null;this.render();return;}
   if(action==='continue'){const list=this.store.list();if(!list.length)throw Error('No saved commission record on this device.');return this.action('open-record',list[0].id);}
   if(action==='open-record'){const item=this.store.open(id);if(!item)throw Error('Saved commission record not found.');this.current=item;this.section='summary';this.dirty=false;this.render();return;}
   if(action==='upload'){this.file.click();return;}
   if(action==='save'){if(!this.current||this.current.mode==='practice')throw Error('Start a real commission record first.');this.store.save(this.current);this.dirty=false;this.render();return;}
   if(action==='download'){if(!this.current||this.current.mode==='practice')throw Error('Open a real commission record first.');
    this.download(CommissionStore.encode(this.current),'VESA-COMMISSION-'+this.current.id+'.vesacommission','application/json');return;}
   if(['summary','agreement','lines','exclusions','earnings','invoices','receipts','adjustments','history','reports'].includes(action)){
    if(!this.current)throw Error('Create a commission record first.');this.section=action;this.render();return;}
   if(action==='report'){if(!this.current)throw Error('Create a record first.');this.section='reports';this.render();return;}
   if(action==='print'){if(!this.current)throw Error('Create a record first.');this.section='reports';this.render();global.print();return;}
   if(action==='excel')return this.excel();
   if(action==='set-asof'){this.dialogOpen(this.tr('asOf'),'<form data-form="asof" class="com-form">'+
     this.field('asOf',this.asOf,'date','required')+
     '<div class="wide"><button type="submit" class="com-btn primary">'+esc(this.tr('save'))+'</button></div></form>');return;}
   if(action==='help'){this.dialogOpen('Commission 360 · Help','<p>'+esc(this.tr('help'))+'</p><p>'+esc(this.tr('warning'))+'</p>');return;}
   if(['meta','agreement','reference','add-line','add-exclusion','add-earning','add-invoice',
        'add-receipt','add-adjustment'].includes(action))return this.form(action);
   if(action.startsWith('edit-'))return this.form(action.slice(5),id);
   if(action.startsWith('delete-'))return this.remove(action.slice(7),id);
   if(action==='issue-invoice')return this.form('issue-invoice',id);
  }catch(e){this.error(e.message);}
 }
 mutate(label,fn,source=''){
  if(!this.current||this.current.mode!=='local')throw Error('Practice records cannot be edited.');
  const next=copy(this.current);fn(next);
  next.revision+=1;next.updatedAt=new Date().toISOString();
  next.audit.push({at:next.updatedAt,revision:next.revision,action:label,sourceRef:source});
  CommissionStore.validate(next);
  if(this.store.open(next.id))this.store.save(next);else this.dirty=true;
  this.current=next;this.render();
 }
 remove(kind,id){
  if(!this.current||this.current.mode==='practice')throw Error('Only a real draft can be changed.');
  const fields={line:'lines',exclusion:'exclusions',invoice:'invoices'};
  const field=fields[kind];if(!field)throw Error('Posted financial events cannot be deleted; preserve evidence and record a documented adjustment.');
  if(kind==='invoice'&&this.current.invoices.find(x=>x.id===id)?.status!=='draft')
    throw Error('Issued commission invoices cannot be deleted.');
  if(kind==='line'&&(this.current.earnings.length||this.current.invoices.some(x=>x.status==='issued')||this.current.receipts.length))
    throw Error('Cannot silently change sourced FOB after earned/invoiced/received records. Keep the history and seek a documented revision.');
  if(!global.confirm('Remove this unsigned local draft item?'))return;
  this.mutate('Removed unsigned '+kind,p=>{p[field]=p[field].filter(x=>x.id!==id);});
 }

 submit(form){

   const v=Object.fromEntries(new FormData(form).entries()),get=k=>trim(v[k]),type=form.dataset.form;
   if(type==='asof'){if(!CommissionMoney.iso(get('asOf')))throw Error('Enter a real date.');

   if(type==='new'){

    this.current=CommissionDomain.blank({buyer:get('buyer'),factory:get('factory'),
      po:get('po'),style:get('style'),sourceRef:get('source')});
    this.section='agreement';this.dirty=true;
   }else if(type==='meta'){
    this.mutate('Order context manually updated',p=>{
      p.meta={...p.meta,buyer:get('buyer'),factory:get('factory'),po:get('po'),
        style:get('style'),sourceRef:get('source')};},get('source'));
   }else if(type==='agreement'){
    this.mutate('Commission agreement reviewed as new terms version',p=>{
      const old=p.agreement,changed=['sourceRef','ratePercent','basis','currency','rounding','earnedRule','debtor',
        'effectiveDate'].some((key,i)=>old[key]!==({sourceRef:get('source'),ratePercent:get('rate'),
          basis:get('basis'),currency:get('currency'),rounding:get('rounding'),
          earnedRule:get('milestone'),debtor:get('debtor'),effectiveDate:get('effective')})[key]);
      if(changed&&old.confirmed&&!get('reason'))
        throw Error('Enter a documented reason to create a new agreement version.');
      if(changed&&old.confirmed)
        p.agreementHistory.push({version:old.version,replacedAt:new Date().toISOString(),
          reason:get('reason'),agreement:copy(old),
          postedInvoices:copy(p.invoices.filter(x=>x.status==='issued')),
          earnedAtRevision:copy(p.earnings),receiptsAtRevision:copy(p.receipts)});
      p.agreement={...old,id:changed&&old.confirmed?keygen('AGR'):old.id,
        version:changed&&old.confirmed?old.version+1:old.version,sourceRef:get('source'),
        effectiveDate:get('effective'),ratePercent:get('rate'),currency:get('currency'),
        basis:get('basis'),rounding:get('rounding'),earnedRule:get('milestone'),debtor:get('debtor'),
        reviewedBy:get('reviewer'),confirmed:form.querySelector('[name="confirmed"]').checked,
        reason:get('reason')};
    },get('source'));
   }else if(type==='add-line'||type==='line'){
    this.mutate('Sourced FOB order line updated',p=>{
      if(p.earnings.length||p.invoices.some(x=>x.status==='issued')||p.receipts.length)
        throw Error('Sourced FOB cannot be silently repriced after posting earned/invoiced/received entries.');
      const id=get('id')||keygen('L');
      const item={id,po:get('po'),style:get('style'),basis:get('lineBasis'),
        valueMode:get('fobMode'),quantity:get('quantity')===''?null:Number(get('quantity')),
        unitFob:get('unitFob'),authoritativeFob:get('totalFob'),
        currency:get('currency'),sourceRef:get('lineSource')};
      p.lines=p.lines.filter(x=>x.id!==id).concat(item);
    },get('lineSource'));
   }else if(type==='add-exclusion'||type==='exclusion'){
    this.mutate('Contract FOB exclusion recorded',p=>{
      if(p.earnings.length||p.invoices.some(x=>x.status==='issued')||p.receipts.length)
        throw Error('Contract base cannot be changed silently after earned/invoice/receipt posting.');
      const id=get('id')||keygen('X');
      const item={id,amount:get('amount'),date:get('date'),
        contractSource:get('contractRef'),reason:get('creditReason')};
      p.exclusions=p.exclusions.filter(x=>x.id!==id).concat(item);
    },get('contractRef'));
   }else if(type==='add-earning'){
    this.mutate('Earned milestone manually recorded',p=>{
      p.earnings.push({id:keygen('E'),amount:get('amount'),currency:get('currency'),
        milestone:get('milestone'),date:get('date'),evidenceRef:get('evidence'),actor:get('actor')});
    },get('evidence'));
   }else if(['add-invoice','invoice','issue-invoice'].includes(type)){
    this.mutate('Commission invoice recorded',p=>{
      const id=get('id')||keygen('INV');
      const previous=p.invoices.find(x=>x.id===id);
      if(previous?.status==='issued')throw Error('An issued invoice is immutable.');
      const item={id,invoiceNo:get('invoiceNo'),amount:get('amount'),currency:get('currency'),
        status:get('invoiceStatus'),issuedOn:get('issuedOn'),dueDate:get('dueDate'),
        sourceRef:get('source'),issuedBy:get('issuedBy')};
      p.invoices=p.invoices.filter(x=>x.id!==id).concat(item);
    },get('source'));
   }else if(type==='add-receipt'){
    this.mutate('Documented commission receipt recorded',p=>{
      p.receipts.push({id:keygen('REC'),ref:get('receiptRef'),date:get('date'),
        amount:get('amount'),currency:get('receiptCurrency'),invoiceId:get('invoiceChoice'),
        fxRate:get('fxRate'),fxDate:get('fxDate'),fxSource:get('fxSource'),
        evidenceRef:get('evidence'),actor:get('actor')});
    },get('evidence'));
   }else if(type==='add-adjustment'){
    this.mutate('Documented contractual credit/deduction recorded',p=>{
      p.adjustments.push({id:keygen('ADJ'),amount:get('amount'),currency:get('currency'),
        date:get('date'),contractRef:get('contractRef'),reason:get('creditReason'),actor:get('actor')});
    },get('contractRef'));
   }else if(type==='reference'){
    this.mutate('Manual reference recorded',p=>{
      p.meta.manualReference={sourceApp:get('sourceApp'),recordType:get('recordType'),
        recordId:get('recordId'),revisionId:get('revisionId'),sourceDate:get('sourceDate'),
        verifiedBy:get('verifiedBy'),verifiedAt:get('verifiedAt'),
        displaySnapshot:get('displaySnapshot')};
    },get('sourceApp'));
   }
   this.dialog.close();this.render();
  }catch(e){
   let box=form.querySelector('[role=alert]');
   if(!box){box=document.createElement('p');box.className='com-warning wide';box.setAttribute('role','alert');form.prepend(box);}
   box.textContent=e.message;
  }
 }
 download(data,name,mime){const file=data instanceof Blob?data:new Blob([data],{type:mime});
  const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);
  a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);
 }
 excel(){
  if(!this.current)throw Error('Open a commission record first.');
  if(!global.XLSX?.utils?.book_new)throw Error('Local spreadsheet library unavailable.');
  const source=CommissionReport.sheets(this.current,CommissionDomain.analyze(this.current,this.asOf));
  const workbook=global.XLSX.utils.book_new();
  for(const [name,rows] of Object.entries(source)){
   const table=rows.map(row=>row.map(CommissionReport.csvSafe));
   const sheet=global.XLSX.utils.aoa_to_sheet(table);sheet['!cols']=rows[0].map(()=>({wch:25}));
   global.XLSX.utils.book_append_sheet(workbook,sheet,name.slice(0,31));
  }
  const buffer=global.XLSX.write(workbook,{bookType:'xlsx',type:'array',compression:true});
  this.download(new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
    'VESA-COMMISSION-'+this.current.id+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
 }
}
global.VesaOrderCommission360=Object.freeze({CommissionMoney,CommissionDomain,CommissionStore,CommissionReport,VERSION,COPY_VERSION});
if(typeof module!=='undefined'&&module.exports)module.exports=global.VesaOrderCommission360;
if(typeof document!=='undefined'){
 const open=()=>new CommissionWorkspace().start();
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',open);else open();
}
})(typeof globalThis!=='undefined'?globalThis:this);
</script></body></html>
