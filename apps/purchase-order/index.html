<script>
(function(global){
'use strict';
const VERSION='VESA-PO360-PLAN-1',COPY_VERSION='VESA-PO360-COPY-1',PREFIX='vesa.purchase-order.records.v1.';
const MAX_BYTES=2097152;
const NOTICE='NON-COMMERCIAL PERSONAL DEMO. Synthetic inputs only. Browser login is not secure authentication. A locally recorded PO revision or buyer/factory acknowledgment is NOT a verified external buyer approval or shipment release.';
const trim=x=>String(x??'').trim(),deep=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const sheetSafe=x=>typeof x==='number'&&Number.isFinite(x)?x:/^[=+\-@\t\r]/.test(String(x??''))?"'"+String(x):String(x??'');
const identifier=prefix=>prefix+'-'+(global.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
/**
 * Canonical PO quantity and money projection. Each source line owns
 * style/colour/size, intentional split, whole-piece qty and 4-decimal FOB.
 * The selected line-rounding convention is explicit and fixed-point. No
 * currency exchange, incoterm, signature, shipment or acceptance inferred.
 */
class PurchaseOrderEngine {
 static parse(value,decimals=4,allowZero=false){
  if(typeof value!=='number'&&typeof value!=='string')return null;
  const re=new RegExp('^([0-9]{1,11})(?:\\.([0-9]{1,'+decimals+'}))?$'),m=trim(value).match(re);
  if(!m)return null;
  const n=BigInt(m[1])*10n**BigInt(decimals)+BigInt((m[2]||'').padEnd(decimals,'0'));
  return !allowZero&&n===0n?null:n;
 }
 static date(value){if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
  const t=Date.parse(value+'T00:00:00Z');return Number.isFinite(t)&&new Date(t).toISOString().slice(0,10)===value;}
 static currency(value){return /^[A-Z]{3}$/.test(trim(value));}
 static round(value,rule){
  if(value<0n)throw Error('Unexpected negative order price.');
  if(rule==='line-half-up-2')return (value+50n)/100n;
  if(rule==='line-down-2')return value/100n;
  return null;
 }
 static money(n){
  if(n===null||n===undefined)return null;
  const v=n<0n?-n:n;return (n<0n?'-':'')+(v/100n).toString()+'.'+(v%100n).toString().padStart(2,'0');
 }
 static lineValue(line,rule){
  if(!Number.isSafeInteger(line.quantity)||line.quantity<=0||line.quantity>100000000)return null;
  const unit=this.parse(line.unitFob);
  if(unit===null)return null;
  return this.round(BigInt(line.quantity)*unit,rule);
 }
 static create(seed={},practice=false){
  const now=new Date().toISOString();
  return {version:VERSION,id:identifier('PO'),revision:0,mode:practice?'practice':'local',
    createdAt:now,updatedAt:now,status:'draft',
    header:{poNo:trim(seed.poNo),buyer:trim(seed.buyer),issuer:trim(seed.issuer),
     factory:trim(seed.factory),shipTo:trim(seed.shipTo),currency:trim(seed.currency),
     incoterm:trim(seed.incoterm),orderDate:trim(seed.orderDate),shipFrom:trim(seed.shipFrom),
     shipToDate:trim(seed.shipToDate),sourceRef:trim(seed.sourceRef),
     rounding:trim(seed.rounding),declaredQty:seed.declaredQty??null,
     declaredAmount:trim(seed.declaredAmount),ledgerComplete:false,ledgerSource:'',manualReference:null,
     packingInstructionRef:'',sizeRatioRef:''},
    lines:[],cancelled:[],shipments:[],amendments:[],acknowledgments:[],revisions:[],audit:[],factoryConfirmation:null};
 }
 static demo(){
  const p=this.create({poNo:'DEMO-PO',buyer:'SYNTHETIC BUYER',issuer:'SYNTHETIC MERCHANDISER',
   factory:'SYNTHETIC FACTORY',shipTo:'SYNTHETIC PORT',currency:'USD',incoterm:'FOB',
   orderDate:'2026-10-01',shipFrom:'2026-10-20',shipToDate:'2026-11-10',
   sourceRef:'SYNTHETIC PO SOURCE',rounding:'line-half-up-2',declaredQty:60,
   declaredAmount:'165.00'},true);
  p.lines=[{id:'L1',style:'DEMO-TEE',color:'Navy',size:'M',splitId:'',quantity:40,
    unitFob:'2.5000',sourceRef:'SYNTHETIC SIGNED LINE'},
   {id:'L2',style:'DEMO-TEE',color:'Navy',size:'L',splitId:'',quantity:20,
    unitFob:'3.2500',sourceRef:'SYNTHETIC SIGNED LINE'}];
  return p;
 }
 static validate(p){
  const errors=[],notes=[];
  if(!p||p.version!==VERSION||!p.header||!Array.isArray(p.lines)||!Array.isArray(p.cancelled)||
     !Array.isArray(p.shipments)||!Array.isArray(p.amendments)||
     !Array.isArray(p.acknowledgments)||!Array.isArray(p.revisions)||!Array.isArray(p.audit))
    return {ok:false,errors:['Unsupported PO format.'],notes};
  const h=p.header,mand=['poNo','buyer','issuer','factory','shipTo','incoterm','sourceRef'];
  if(mand.some(k=>!trim(h[k]))||!this.currency(h.currency)||!['line-half-up-2','line-down-2'].includes(h.rounding)||
     !this.date(h.orderDate)||!this.date(h.shipFrom)||!this.date(h.shipToDate)||h.shipFrom>h.shipToDate)
    errors.push('PO needs source, buyer/issuer/factory/ship-to, entered ISO currency/incoterm, valid order and shipment dates and explicit rounding.');
  const lineIds=new Set(),combos=new Map(),lineMap=new Map(),lineVal=new Map();
  let quantity=0,amount=0n;
  for(const line of p.lines){
   if(lineIds.has(line.id))errors.push('Duplicate PO line ID.');lineIds.add(line.id);
   const name=[trim(line.style).toLowerCase(),trim(line.color).toLowerCase(),
     trim(line.size).toLowerCase()].join('|'),split=trim(line.splitId);
   const previous=combos.get(name)||new Set();
   if(previous.size&&(!split||previous.has(split)||previous.has('')))
    errors.push('Duplicate style/colour/size; intentional splits require distinct explicit split IDs.');
   previous.add(split);combos.set(name,previous);
   const value=this.lineValue(line,h.rounding);
   if(!trim(line.style)||!trim(line.color)||!trim(line.size)||!trim(line.sourceRef)||value===null)
    errors.push('Each style/colour/size line needs sourced whole-piece quantity and 4-decimal unit FOB.');
   else{quantity+=line.quantity;amount+=value;lineVal.set(line.id,value);}
   lineMap.set(line.id,line);
  }
  if(!Number.isSafeInteger(quantity)||quantity>1000000000)errors.push('Quantity total exceeds whole-piece limit.');
  const quantityReconciled=p.lines.length>0&&Number.isSafeInteger(h.declaredQty)&&
    h.declaredQty===quantity;
  const declaredCents=trim(h.declaredAmount)?this.parse(h.declaredAmount,2,true):null;
  const amountReconciled=p.lines.length>0&&declaredCents!==null&&declaredCents===amount;
  // In-progress source lines may be entered one by one. A mismatch remains an
  // explicit visible hold, not a permanent blocker preventing the next line.
  if(h.declaredQty!==null&&h.declaredQty!==undefined&&h.declaredQty!==''){
   if(!Number.isSafeInteger(h.declaredQty)||h.declaredQty<0)
      errors.push('PO control quantity must be a positive or zero whole-piece value.');
   if(!quantityReconciled)
      notes.push('HOLD: Buyer PO control quantity does not yet match complete style/colour/size lines. Revision cannot be recorded.');
  }else notes.push('Buyer PO control quantity not entered; quantity confirmation Needs Information.');
  if(trim(h.declaredAmount)){
   if(declaredCents===null)errors.push('Buyer PO control value must be a nonnegative two-decimal currency amount.');
   if(!amountReconciled)
     notes.push('HOLD: Buyer PO amount has not yet reconciled to the complete line totals. Revision cannot be recorded.');
  }else notes.push('Buyer PO control value missing; totals are calculated but not confirmed against source.');
  if(!p.lines.length)notes.push('PO style/colour/size lines are not entered.');
  const cancelled=new Map(),shipped=new Map();
  const eventIds=new Set();
  for(const [kind,records,map] of [['cancellation',p.cancelled,cancelled],['shipment',p.shipments,shipped]]){
   for(const entry of records){
    if(eventIds.has(entry.id))errors.push('Duplicate shipping/cancellation event ID.');
    eventIds.add(entry.id);
    if(!lineMap.has(entry.lineId)||!Number.isSafeInteger(entry.quantity)||entry.quantity<=0||
       !this.date(entry.date)||!trim(entry.sourceRef)||!trim(entry.actor)||!trim(entry.documentRef))
      errors.push('Each '+kind+' needs source, recorded date/actor, document and positive line quantity.');
    else map.set(entry.lineId,(map.get(entry.lineId)||0)+entry.quantity);
   }
  }
  for(const line of p.lines){
   if((cancelled.get(line.id)||0)+(shipped.get(line.id)||0)>line.quantity)
    errors.push('Recorded shipped + cancelled quantity exceeds the sourced PO line.');
  }
  const revisionIds=new Set();
  for(const rev of p.revisions){
   if(revisionIds.has(rev.id))errors.push('Duplicate PO revision ID.');revisionIds.add(rev.id);
   if(!trim(rev.id)||!trim(rev.authority)||!trim(rev.documentRef)||!this.date(rev.effectiveDate)||
      !rev.snapshot||!Array.isArray(rev.snapshot.lines))
    errors.push('PO revision requires manual approval authority, signed document and effective date.');
  }
  const amendIds=new Set();
  for(const a of p.amendments){
   if(amendIds.has(a.id))errors.push('Duplicate PO amendment ID.');amendIds.add(a.id);
   if(!trim(a.reason)||!trim(a.sourceRef)||!trim(a.requestedBy)||!this.date(a.date)||
      !['pending','acknowledged'].includes(a.status))
    errors.push('Amendment needs requested date/person, source, reason and explicit status.');
   if(a.status==='acknowledged'&&!p.acknowledgments.some(x=>x.amendmentId===a.id))
    errors.push('Amendment may be acknowledged only with a separate dated document.');
  }
  const seenAck=new Set();
  for(const ack of p.acknowledgments){
   if(seenAck.has(ack.amendmentId))errors.push('Duplicate amendment acknowledgment.');
   seenAck.add(ack.amendmentId);
   if(!p.amendments.some(x=>x.id===ack.amendmentId)||!trim(ack.actor)||!this.date(ack.date)||!trim(ack.sourceRef))
    errors.push('Factory/buyer acknowledgment needs matching amendment, actor, source and date.');
  }
  if(h.ledgerComplete&&!trim(h.ledgerSource))errors.push('Complete shipment ledger requires explicit reviewed source evidence.');
  // A separate factory statement never follows automatically from amendment
  // acknowledgement or the buyer-signed order.
  const fc=p.factoryConfirmation??null;
  if(fc!==null&&(!Number.isSafeInteger(fc.quantity)||fc.quantity<0||fc.quantity>1000000000||
     this.parse(fc.amount,2,true)===null||!this.currency(fc.currency)||
     !this.date(fc.shipFrom)||!this.date(fc.shipToDate)||fc.shipFrom>fc.shipToDate||
     !trim(fc.sourceRef)||!trim(fc.documentRef)||!trim(fc.acknowledgedBy)||
     !this.date(fc.acknowledgedOn)||!trim(fc.reviewedBy)||!this.date(fc.reviewedOn)))
    errors.push('Factory statement needs its own documented quantity, value, currency, window, acknowledgment and reviewer.');
  const comparable=fc!==null&&fc.currency===h.currency&&this.currency(fc.currency);
  const factoryComparison=[
   {field:'Total pieces',buyer:h.declaredQty??null,factory:fc?.quantity??null,
     difference:fc&&Number.isSafeInteger(h.declaredQty)?fc.quantity-h.declaredQty:null},
   {field:'PO value',buyer:h.declaredAmount||null,factory:fc?.amount??null,
     difference:comparable&&declaredCents!==null&&this.parse(fc.amount,2,true)!==null?
      this.money(this.parse(fc.amount,2,true)-declaredCents):null},
   {field:'Currency',buyer:h.currency,factory:fc?.currency??null,
     difference:fc?(comparable?'Same currency':'Different currencies; no implied FX'):null},
   {field:'Shipment from',buyer:h.shipFrom,factory:fc?.shipFrom??null,
     difference:fc?(h.shipFrom===fc.shipFrom?'Matches':'Dates differ'):null},
   {field:'Shipment to',buyer:h.shipToDate,factory:fc?.shipToDate??null,
     difference:fc?(h.shipToDate===fc.shipToDate?'Matches':'Dates differ'):null}
  ];
  return {ok:errors.length===0,errors,notes,controlReconciled:quantityReconciled&&amountReconciled,
    quantity,amount:this.money(amount),amountCents:amount,
    currency:h.currency,factoryComparison,
    balances:p.lines.map(line=>{
     const canc=cancelled.get(line.id)||0,ship=shipped.get(line.id)||0;
     return {lineId:line.id,style:line.style,color:line.color,size:line.size,
       ordered:line.quantity,shipped:ship,cancelled:canc,
       unshipped:h.ledgerComplete?line.quantity-ship-canc:null,
       value:lineVal.has(line.id)?this.money(lineVal.get(line.id)):null};
    })};
 }
 /**
  * Compare the immutable signed source against the working copy. Stable
  * style/colour/size/split keys prevent order-of-entry from fabricating a
  * change. Money delta is withheld across currencies/rounding conventions.
  */
 static compare(p,rev){
  if(!rev)return [];
  const from=rev.snapshot||{},oldHead=from.header||{},newHead=p.header||{};
  const changes=[];
  for(const field of ['header','cancelled','shipments','factoryConfirmation']){
   const before=from[field]??null,after=(field==='factoryConfirmation'?p.factoryConfirmation:p[field])??null;
   if(JSON.stringify(before)!==JSON.stringify(after))
    changes.push({field,previous:before,current:after,changeType:'updated'});
  }
  if(oldHead.shipFrom!==newHead.shipFrom||oldHead.shipToDate!==newHead.shipToDate)
   changes.push({field:'shipment-window',changeType:'dates changed',
     previous:{from:oldHead.shipFrom,to:oldHead.shipToDate},
     current:{from:newHead.shipFrom,to:newHead.shipToDate}});
  const key=x=>JSON.stringify([trim(x.style).toLowerCase(),trim(x.color).toLowerCase(),
    trim(x.size).toLowerCase(),trim(x.splitId).toLowerCase()]);
  const oldLines=new Map((from.lines||[]).map(line=>[key(line),line]));
  const newLines=new Map(p.lines.map(line=>[key(line),line]));
  for(const name of [...new Set([...oldLines.keys(),...newLines.keys()])].sort()){
   const before=oldLines.get(name)||null,after=newLines.get(name)||null;
   if(JSON.stringify(before)===JSON.stringify(after))continue;
   const representative=after||before;
   const oldAmount=before?this.lineValue(before,oldHead.rounding):0n;
   const newAmount=after?this.lineValue(after,newHead.rounding):0n;
   const comparable=oldHead.currency===newHead.currency&&oldHead.rounding===newHead.rounding&&
     oldAmount!==null&&newAmount!==null;
   changes.push({field:'size-line',key:name,style:representative.style,color:representative.color,
     size:representative.size,splitId:representative.splitId||'',
     changeType:!before?'added':!after?'removed':'modified',
     previous:before,current:after,quantityDelta:(after?.quantity||0)-(before?.quantity||0),
     fobDelta:comparable?this.money(newAmount-oldAmount):null,
     currency:comparable?newHead.currency:null});
  }
  return changes;
 }
 /**
  * A read-only source reference, never an approval token. Its display data
  * always comes from the last immutable revision rather than a draft edit.
  */
 static reviewedReference(p,review){
  const revision=p?.revisions?.at(-1);
  if(!revision||!revision.snapshot||review?.checked!==true||
      !trim(review.verifiedBy)||!this.date(review.verifiedAt))
   throw Error('Signed-source revision and explicit dated local review are required.');
  const s=revision.snapshot;
  const asSigned={...p,header:deep(s.header),lines:deep(s.lines),
    cancelled:deep(s.cancelled||[]),shipments:deep(s.shipments||[]),
    factoryConfirmation:deep(s.factoryConfirmation??null)};
  const analysis=this.validate(asSigned);
  if(!analysis.ok||!analysis.controlReconciled)
   throw Error('Referenced PO revision has unreconciled buyer control or invalid source.');
  const reference={sourceApp:'VESA Purchase Order 360',recordType:'PurchaseOrder',
    recordId:p.id,revisionId:revision.id,sourceDate:revision.effectiveDate,
    verifiedBy:trim(review.verifiedBy),verifiedAt:review.verifiedAt,
    displaySnapshot:{poNo:s.header.poNo,buyer:s.header.buyer,factory:s.header.factory,
     currency:s.header.currency,incoterm:s.header.incoterm,
     shipFrom:s.header.shipFrom,shipToDate:s.header.shipToDate,
     totalPieces:analysis.quantity,totalAmount:analysis.amount,
     signedSource:s.header.sourceRef,revisionDocument:revision.documentRef,
     factoryEvidence:s.factoryConfirmation?.sourceRef||'Needs Information',
     sourceLines:s.lines.map(x=>({style:x.style,color:x.color,size:x.size,splitId:x.splitId||'',
       quantity:x.quantity,unitFob:x.unitFob,sourceRef:x.sourceRef})),
     localReviewOnly:true,externalAcceptanceNotVerified:true}};
  if(JSON.stringify(reference).length>MAX_BYTES)throw Error('Reviewed reference exceeds size limit.');
  return reference;
 }
}
/** Atomic browser-local saved records; portable hash is corruption detection, not buyer authenticity. */
class PurchaseOrderStore {
 constructor(user){this.key=PREFIX+(trim(user).replace(/[^a-zA-Z0-9-]/g,'-').slice(0,100)||'local');}
 static checksum(value){let x=2166136261;for(let i=0;i<value.length;i++){x^=value.charCodeAt(i);x=Math.imul(x,16777619);}return (x>>>0).toString(16);}
 static verify(record){
  const result=PurchaseOrderEngine.validate(record);
  if(!result.ok)throw Error(result.errors.join('\n'));
  if(!trim(record.id)||!Number.isSafeInteger(record.revision)||record.revision<0||
     JSON.stringify(record).length>MAX_BYTES)throw Error('Invalid or oversized PO saved record.');
  return result;
 }
 read(){let raw;try{raw=localStorage.getItem(this.key);}catch{throw Error('Cannot read local saved POs.');}

  this.focus=document.activeElement;document.getElementById('poDialogTitle').textContent=title;

  const Shell=global.VesaWorkspaceShell?.VesaWorkspaceShell;

  this.shell=new Shell({root:document.body,

      contentTarget:'#poMain',userLabel:session.name||session.email||'',userRole:session.role||'',

  this.file.addEventListener('change',async()=>{

     if(f.size>MAX_BYTES)throw Error('Saved PO copy is too large.');
     const p=PurchaseOrderStore.decode(await f.text());
     if(this.store.load(p.id)){p.id=identifier('PO-COPY');p.audit.push({at:new Date().toISOString(),
      revision:p.revision,action:'Imported separate saved PO copy'});}

 menu(name){

   File:[['save','save'],['download','download'],['upload','upload'],['open','open']],
   Edit:[['meta','poNo'],['add-line','lines'],['factory-entry','confirmation'],['add-amendment','amendments']],
   View:[['summary','summary'],['lines','lines'],['confirmation','confirmation'],['revisions','revisions']],
   Tools:[['report','report'],['record-revision','approval'],['add-shipment','shipment'],['add-cancel','cancel']],
   Help:[['help','title'],['practice','practice']]};

 action(action,id){
  try{
   if(action==='home'||action==='open'){this.current=null;this.section='summary';this.dirty=false;this.render();return;}
   if(action==='new')return this.form('new');
   if(action==='practice'){this.current=PurchaseOrderEngine.demo();this.section='summary';this.dirty=false;this.render();return;}
   if(action==='continue'){const list=this.store.list();if(!list.length)throw Error('No saved PO in this browser.');
    return this.action('open-record',list[0].id);}
   if(action==='open-record'){const p=this.store.load(id);if(!p)throw Error('PO not found.');
    this.current=p;this.section='summary';this.dirty=false;this.render();return;}
   if(action==='upload'){this.file.click();return;}
   if(action==='save'){if(!this.current||this.current.mode==='practice')throw Error('Practice example is not a live PO.');
    this.store.save(this.current);this.dirty=false;this.render();return;}
   if(action==='download'){if(!this.current||this.current.mode==='practice')throw Error('Open a real PO.');
    this.download(PurchaseOrderStore.encode(this.current),'VESA-PO-'+this.current.id+'.vesapo','application/json');return;}
   if(['summary','lines','confirmation','amendments','shipments','revisions','reports'].includes(action)){
    if(!this.current)throw Error('Open a PO first.');this.section=action;this.render();return;}
   if(action==='report'){if(!this.current)throw Error('Open a PO.');this.section='reports';this.render();return;}
   if(action==='excel')return this.excel();
   if(action==='print'){if(!this.current)throw Error('Open a PO.');this.section='reports';this.render();global.print();return;}
   if(action==='help')return this.popup('Purchase Order 360 · Help','<p>'+esc(NOTICE)+'</p>'+
    '<p>Enter exact buyer PO style/colour/size quantities and documented unit FOB. Record immutable revisions only from explicit signed source. Partial shipments, cancellation and acknowledgments require separate evidence. Download Saved Copy for recovery.</p>');
   if(['meta','add-line','factory-entry','add-amendment','add-shipment','add-cancel','record-revision','acknowledge','reference','complete-ledger'].includes(action))
    return this.form(action,id);
   if(action.startsWith('edit-'))return this.form(action.slice(5),id);
   if(action.startsWith('delete-'))return this.remove(action.slice(7),id);
  }catch(e){this.error(e.message);}
 }
 update(action,handler){
  if(!this.current||this.current.mode!=='local')throw Error('Practice is read-only.');
  const p=deep(this.current);handler(p);p.revision++;p.status='draft';p.updatedAt=new Date().toISOString();
  p.audit.push({at:p.updatedAt,revision:p.revision,action});
  PurchaseOrderStore.verify(p);
  if(this.store.load(p.id))this.store.save(p);else this.dirty=true;
  this.current=p;this.render();

 remove(kind,id){
  const field={line:'lines',amendment:'amendments'}[kind];
  if(!field)throw Error('Documented shipment, canceled line, signed revision or acknowledgment must not be deleted.');
  if(kind==='line'&&this.current&&(this.current.shipments.some(x=>x.lineId===id)||
     this.current.cancelled.some(x=>x.lineId===id)))
    throw Error('Line has recorded shipment/cancellation and cannot be deleted.');
  if(kind==='amendment'&&this.current.acknowledgments.some(x=>x.amendmentId===id))
    throw Error('Already acknowledged amendment cannot be deleted.');
  if(!global.confirm('Remove unsigned draft entry? Previous snapshots stay intact.'))return;
  this.update('Removed unsigned '+kind,p=>p[field]=p[field].filter(x=>x.id!==id));

 submit(form){
  try{
   const fields=Object.fromEntries(new FormData(form).entries()),
    get=k=>trim(fields[k]),number=k=>get(k)===''?null:Number(get(k)),
    checked=k=>form.querySelector('[name="'+k+'"]')?.checked||false,
    kind=form.dataset.form;
   if(kind==='new'){
    const data={poNo:get('poNo'),buyer:get('buyer'),issuer:get('issuer'),factory:get('factory'),
      shipTo:get('shipTo'),currency:get('currency'),incoterm:get('incoterm'),
      orderDate:get('orderDate'),shipFrom:get('shipFrom'),shipToDate:get('shipToDate'),
      sourceRef:get('source'),rounding:get('rounding'),declaredQty:number('declaredQty'),
      declaredAmount:get('declaredAmount')};
    const p=PurchaseOrderEngine.create(data);
    p.header.sizeRatioRef=get('sizeRatioRef');p.header.packingInstructionRef=get('packingInstructionRef');
    PurchaseOrderStore.verify(p);this.current=p;this.section='lines';this.dirty=true;
   }else if(kind==='meta'){
    this.update('Sourced commercial PO header updated',p=>{
     if(p.revisions.length&&[p.header.currency,p.header.rounding].some((old,i)=>
       old!==[get('currency'),get('rounding')][i])&&
       (p.shipments.length||p.cancelled.length))
      throw Error('Changing signed currency or rounding after shipment/cancellation needs a new reviewed PO revision.');
     Object.assign(p.header,{poNo:get('poNo'),buyer:get('buyer'),issuer:get('issuer'),factory:get('factory'),
      shipTo:get('shipTo'),currency:get('currency'),incoterm:get('incoterm'),
      orderDate:get('orderDate'),shipFrom:get('shipFrom'),shipToDate:get('shipToDate'),
      sourceRef:get('source'),rounding:get('rounding'),declaredQty:number('declaredQty'),
      declaredAmount:get('declaredAmount'),sizeRatioRef:get('sizeRatioRef'),
      packingInstructionRef:get('packingInstructionRef')});
    });
   }else if(kind==='add-line'||kind==='line'){
    this.update('Style colour size commercial line updated',p=>{
     if(p.shipments.length||p.cancelled.length)throw Error('PO line changes cannot silently replace shipped/canceled source.');
     const id=get('id')||identifier('L');
     const item={id,style:get('style'),color:get('color'),size:get('size'),splitId:get('splitId'),
       quantity:number('quantity'),unitFob:get('unitFob'),sourceRef:get('source')};
     p.lines=p.lines.filter(x=>x.id!==id).concat(item);
    });
   }else if(kind==='add-shipment'||kind==='add-cancel'){
    this.update(kind==='add-shipment'?'Manual shipment evidence':'Documented cancellation evidence',p=>{
     const item={id:identifier('EVENT'),lineId:get('lineId'),quantity:number('quantity'),
      date:get('date'),documentRef:get('document'),sourceRef:get('source'),actor:get('actor')};
     p[kind==='add-shipment'?'shipments':'cancelled'].push(item);
    });
   }else if(kind==='factory-entry'){
    this.update('Separate factory statement source entered',p=>{
     p.factoryConfirmation={quantity:number('factoryQty'),amount:get('factoryAmount'),
       currency:get('factoryCurrency'),shipFrom:get('factoryShipFrom'),shipToDate:get('factoryShipTo'),
       acknowledgedBy:get('ackBy'),acknowledgedOn:get('ackDate'),documentRef:get('document'),
       sourceRef:get('source'),reviewedBy:get('reviewer'),reviewedOn:get('reviewedOn')};
    });
   }else if(kind==='complete-ledger'){
    this.update('Shipment completeness source declaration updated',p=>{
     p.header.ledgerComplete=checked('ledger');p.header.ledgerSource=get('ledgerSource');
    });
   }else if(kind==='add-amendment'){
    this.update('Signed PO amendment request source recorded',p=>{
     p.amendments.push({id:identifier('AMD'),reason:get('reason'),requestedBy:get('requestedBy'),
      date:get('date'),sourceRef:get('source'),status:'pending'});
    });
   }else if(kind==='acknowledge'){
    this.update('Independent amendment acknowledgment evidence recorded',p=>{
     const amendment=p.amendments.find(x=>x.id===get('id'));
     if(!amendment||amendment.status!=='pending')throw Error('Acknowledgment must belong to a pending amendment.');
     const ack={id:identifier('ACK'),amendmentId:amendment.id,actor:get('ackBy'),
      date:get('date'),sourceRef:get('document')};
     p.acknowledgments.push(ack);amendment.status='acknowledged';
    });
   }else if(kind==='record-revision'){
    if(!checked('reviewed'))throw Error('Verify the actual PO document yourself before recording this source.');
    this.update('User-referenced signed PO revision snapshot recorded',p=>{
     if(!p.lines.length||!PurchaseOrderEngine.validate(p).controlReconciled)
       throw Error('Reconcile signed PO control quantity and value with every sourced size line before recording a revision.');
     if(!get('authority')||!get('document')||!PurchaseOrderEngine.date(get('effective')))
      throw Error('Approval source, effective date and recorded authority required.');
     p.revisions.push({id:identifier('REV'),recordRevision:p.revision+1,at:new Date().toISOString(),
      authority:get('authority'),effectiveDate:get('effective'),documentRef:get('document'),
      reason:get('reason'),snapshot:{header:deep(p.header),lines:deep(p.lines),
        cancelled:deep(p.cancelled),shipments:deep(p.shipments),factoryConfirmation:deep(p.factoryConfirmation??null)}});
    });
   }else if(kind==='reference'){
    this.update('Explicit manual cross-app PO source reference recorded',p=>{
     p.header.manualReference=Object.fromEntries(['sourceApp','recordType','recordId','revisionId','sourceDate',
       'verifiedBy','verifiedAt','displaySnapshot'].map(k=>[k,get(k)]));
    });
   }
   this.dialog.close();this.render();
  }catch(error){
   let box=form.querySelector('[role=alert]');
   if(!box){box=document.createElement('p');box.className='po-alert wide';box.setAttribute('role','alert');form.prepend(box);}
   box.textContent=error.message;
  }
 }
 download(data,name,type){
  const blob=data instanceof Blob?data:new Blob([data],{type});
  const url=URL.createObjectURL(blob),anchor=document.createElement('a');
  anchor.href=url;anchor.download=name;document.body.append(anchor);anchor.click();anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
 }
 excel(){
  if(!this.current)throw Error('Open a PO before exporting.');
  if(!global.XLSX?.utils?.book_new)throw Error('Local spreadsheet library is unavailable.');
  const p=this.current,calc=PurchaseOrderEngine.validate(p),
   rows=PurchaseOrderReport.sheets(p,calc,PurchaseOrderEngine.compare(p,p.revisions.at(-1)));
  const wb=global.XLSX.utils.book_new();
  for(const [name,items] of Object.entries(rows)){
   const matrix=PurchaseOrderReport.excelRows(name,items);
   const sheet=global.XLSX.utils.aoa_to_sheet(matrix);sheet['!cols']=items[0].map(()=>({wch:25}));
   global.XLSX.utils.book_append_sheet(wb,sheet,name.slice(0,31));
  }
  const data=global.XLSX.write(wb,{bookType:'xlsx',type:'array',compression:true});
  this.download(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
   'VESA-PO-'+p.id+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
 }
}
global.VesaPurchaseOrder360=Object.freeze({PurchaseOrderEngine,PurchaseOrderStore,PurchaseOrderReport,VERSION,COPY_VERSION});
if(typeof module!=='undefined'&&module.exports)module.exports=global.VesaPurchaseOrder360;
if(typeof document!=='undefined'){
 const start=()=>new PurchaseOrderWorkspace().start();
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
}
})(typeof globalThis!=='undefined'?globalThis:this);
