<script data-costing-module="consumption">
(function (root, factory) {
  'use strict';
  const moduleValue = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = moduleValue;
  root.VesaCostingConsumption = moduleValue;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const METERS_PER_YARD = 0.9144;
  const GRAMS_PER_OZ_PER_SQ_YARD_IN_GSM = 28.349523125 / (METERS_PER_YARD * METERS_PER_YARD);
  function finitePositive(value, name) {
    if (typeof value !== 'number' || !Number.isFinite(value) || value <= 0) throw new Error(`${name} must be a positive finite number.`);
    return value;
  }
  function allowance(value, name) {
    if (typeof value !== 'number' || !Number.isFinite(value) || value < 0 || value > 100) throw new Error(`${name} must be within 0–100 percent.`);
    return value;
  }
  function knitKgPerPiece({ approvedCutAreaM2, gsm, wastePercent = 0, additionalShrinkPercent = 0, areaAlreadyIncludesShrink = false }) {
    finitePositive(approvedCutAreaM2, 'Approved cut area');
    finitePositive(gsm, 'GSM');
    allowance(wastePercent, 'Waste');
    allowance(additionalShrinkPercent, 'Additional shrink allowance');
    if (areaAlreadyIncludesShrink && additionalShrinkPercent !== 0) throw new Error('Shrinkage is already in the cut area; do not apply it twice.');
    const netKgPerPiece = approvedCutAreaM2 * gsm / 1000;
    return Object.freeze({method:'APPROVED_KNIT_AREA',netKgPerPiece, grossKgPerPiece:netKgPerPiece*(1+wastePercent/100)*(1+additionalShrinkPercent/100),unit:'kg/pc',sourceReminder:'Use approved CAD/marker area. GSM alone cannot give garment consumption.'});
  }
  function wovenMarkerPerPiece({ markerLengthM, garmentsPerMarker, wastePercent = 0, markerAlreadyIncludesWaste = false }) {
    finitePositive(markerLengthM, 'Marker length');
    if (!Number.isInteger(garmentsPerMarker) || garmentsPerMarker <= 0) throw new Error('Garments per marker must be a positive integer.');
    allowance(wastePercent, 'Waste');
    if (markerAlreadyIncludesWaste && wastePercent !== 0) throw new Error('Waste is already included in the marker; do not add it twice.');
    const netMPerPiece=markerLengthM/garmentsPerMarker;
    const grossMPerPiece=netMPerPiece*(1+wastePercent/100);
    return Object.freeze({method:'APPROVED_WOVEN_MARKER',netMPerPiece,grossMPerPiece,grossYdPerPiece:grossMPerPiece/METERS_PER_YARD,unit:'m/pc',sourceReminder:'Confirm marker width, size ratio, shrink and usable fabric width separately.'});
  }
  function ozSqYdToGsm(ouncesPerSquareYard) {
    finitePositive(ouncesPerSquareYard, 'oz per square yard');
    return ouncesPerSquareYard*GRAMS_PER_OZ_PER_SQ_YARD_IN_GSM;
  }
  function gsmToOzSqYd(gsm) {
    finitePositive(gsm,'GSM');
    return gsm/GRAMS_PER_OZ_PER_SQ_YARD_IN_GSM;
  }
  return Object.freeze({METERS_PER_YARD, GRAMS_PER_OZ_PER_SQ_YARD_IN_GSM,knitKgPerPiece,wovenMarkerPerPiece,ozSqYdToGsm,gsmToOzSqYd});
});

</script>
<script data-costing-module="engine">
(function (root, factory) {

  const moduleValue = factory();

  const CATEGORY=Object.freeze(['FABRIC','TRIMS','MAKING','PROCESS','PACKING','TESTING','LOGISTICS','BANK','OTHER']);

  function isNumber(v){return typeof v === 'number' && Number.isFinite(v);}
  function nonnegative(v){return isNumber(v) && v>=0;}
  function validText(v,max=600){return typeof v==='string'&&v.trim().length>0&&v.length<=max;}
  function finitePercent(v){return isNumber(v)&&v>=0&&v<=100;}
  function validateLine(line,index, ids) {
    const errors=[];
    const at=`Line ${index+1}`;
    if (!line || typeof line!=='object'||Array.isArray(line))return [`${at} is invalid.`];
    if(!validText(line.id,80)||!(/^[a-zA-Z0-9][a-zA-Z0-9_-]*$/).test(line.id))errors.push(`${at}: invalid line ID.`);
    else if(ids.has(line.id))errors.push(`${at}: duplicate line ID ${line.id}.`);
    else ids.add(line.id);
    if(!CATEGORY.includes(line.category))errors.push(`${at}: select a cost category.`);
    if(!validText(line.description,400))errors.push(`${at}: description missing.`);
    if(!BASIS.includes(line.basis))errors.push(`${at}: choose per piece or per order.`);
    if(!isNumber(line.quantity)||line.quantity<=0)errors.push(`${at}: quantity missing or invalid.`);
    if(!validText(line.unit,32))errors.push(`${at}: unit missing.`);
    if(!finitePercent(line.wastePercent))errors.push(`${at}: waste % missing/invalid.`);
    if(line.basis==='PER_ORDER'&&line.wastePercent!==0)errors.push(`${at}: per-order expense cannot have per-piece waste.`);
    if(!nonnegative(line.rate))errors.push(`${at}: rate missing/invalid.`);
    if(line.rate===0&&!validText(line.zeroRateReason,200))errors.push(`${at}: explicit zero rate needs a reason.`);
    if(!/^[A-Z]{3}$/.test(line.currency||''))errors.push(`${at}: currency must be a 3-letter code.`);
    if(!isNumber(line.localCurrencyPerUSD)||line.localCurrencyPerUSD<=0)errors.push(`${at}: actual currency units per USD is required.`);
    if(line.currency==='USD'&&line.localCurrencyPerUSD!==1)errors.push(`${at}: USD must use 1 USD per USD.`);

    return errors;
  }
  function validateRecord(record){
    const errors=[];
    if(!record||typeof record!=='object'||Array.isArray(record))return ['Missing costing record.'];
    if(record.schemaVersion!==VERSION)errors.push('Unsupported costing record schema version.');
    if(!validText(record.recordId,120))errors.push('Record ID is missing.');
    if(!Number.isInteger(record.revision)||record.revision<1)errors.push('Revision must be 1 or greater.');
    const s=record.style||{};
    if(!validText(s.styleNo,120))errors.push('Style No is required.');
    if(!validText(s.buyer,200))errors.push('Buyer is required.');
    if(!validText(s.factory,200))errors.push('Factory is required.');
    if(!Number.isSafeInteger(s.quantityPieces)||s.quantityPieces<=0)errors.push('Order quantity must be a positive integer.');
    if(!Array.isArray(record.lines)||record.lines.length===0||record.lines.length>MAX_LINES)errors.push('Enter 1–200 cost lines.');
    else {const ids=new Set();record.lines.forEach((line,i)=>errors.push(...validateLine(line,i,ids)));}

    if(!isNumber(policy.marginPercent)||policy.marginPercent!==0)errors.push('Without-margin V1 requires marginPercent 0.');
    if(policy.commissionTreatment==='NONE'){

    } else if(!finitePercent(policy.commissionPercent)||policy.commissionPercent>=100){
      errors.push('Commission percentage is required and must be 0 to less than 100.');
    }
    if(record.sourceKind==='user-entry' && policy.commissionTreatment!=='NONE' && Number(policy.commissionPercent)>0 && !validText(policy.commissionSourceRef,240))errors.push('Commission policy needs an original agreement/source reference.');

  }
  function unitUSDPrice(line){return line.rate/line.localCurrencyPerUSD;}
  function lineUSDPerPiece(line,quantityPieces){
    const usd=unitUSDPrice(line);
    return line.basis==='PER_ORDER'
      ? (line.quantity*usd/quantityPieces)
      : (line.quantity*(1+line.wastePercent/100)*usd);
  }
  function calculate(record){
    const errors=validateRecord(record);
    if(errors.length)return Object.freeze({status:'NEEDS_INFORMATION',errors,summary:null,lines:[]});
    const quantityPieces=record.style.quantityPieces;
    const lines=record.lines.map(line=>Object.freeze({id:line.id,category:line.category,description:line.description,basis:line.basis,quantity:line.quantity,unit:line.unit,unitPriceUSD:unitUSDPrice(line),usdPerPiece:lineUSDPerPiece(line,quantityPieces),sourceRef:line.sourceRef,verifiedSource:!!line.verifiedSource}));

    const treatment=record.policy.commissionTreatment;
    const rate=(record.policy.commissionPercent??0)/100;
    const fobUsdPerPiece=treatment==='IN_FOB'?baseCostUsdPerPiece/(1-rate):baseCostUsdPerPiece;
    const commissionUsdPerPiece=treatment==='NONE'?0:fobUsdPerPiece*rate;
    const includedCommissionUsdPerPiece=treatment==='IN_FOB'?commissionUsdPerPiece:0;
    const separateCommissionUsdPerPiece=treatment==='SEPARATE'?commissionUsdPerPiece:0;
    const netAfterIncludedCommissionUsdPerPiece=fobUsdPerPiece-includedCommissionUsdPerPiece;
    const missingVerifiedEvidence=lines.filter(line=>!line.verifiedSource).map(line=>line.id);

</script>
<script data-costing-module="storage">
(function (root, factory) {

  }
  function updateSummary(){if(!record)return;const result=E.calculate(record);const summary=main.querySelector('#costingCurrentSummary');if(!summary)return;
    if(!result.summary){summary.innerHTML=`<div class="costing-warning"><b>${esc(tr('noValues'))}</b><ol>${result.errors.slice(0,50).map(e=>`<li>${esc(e)}</li>`).join('')}</ol></div>`;return;}
    const s=result.summary;summary.innerHTML=`<p class="costing-badge">${esc(result.status)} ${record.sourceKind==='demo'?' · DEMO ONLY':''}</p><div class="costing-metrics">${[['base',s.baseCostUsdPerPiece],['fob',s.fobUsdPerPiece],['included',s.commissionUsdPerPiece],['orderTotal',s.fobTotalUSD]].map(([label,num])=>`<div class="costing-metric"><small>${esc(tr(label))}</small><strong class="costing-number">${esc(E.roundDisplay(num,6))}</strong></div>`).join('')}</div><p class="costing-warning">${esc(tr('rates'))}</p>`;
  }
  function addLine(){if(!record) return; if(record.lines.length>=E.MAX_LINES)return toast('200 cost lines maximum');const n=record.lines.length+1;record.lines.push({id:`L${String(n).padStart(3,'0')}-${Math.random().toString(36).slice(2,7)}`,category:'FABRIC',description:'',basis:'PER_PIECE',quantity:null,unit:'pcs',wastePercent:0,rate:null,currency:'USD',localCurrencyPerUSD:1,sourceRef:'',sourceDate:'',zeroRateReason:'',verifiedSource:false,isRequired:true});pending();showEditor('lines');}
  function addOffer(){if(!record)return;record.alternatives??=[];record.alternatives.push({lineId:'',label:'',origin:'',rate:null,currency:'USD',fx:1,extraPerPieceUSD:null,sourceRef:'',extraSourceRef:'',zeroRateReason:''});pending();showEditor('offers');}
  function askDiscard(){return !dirty||confirm('This draft is still saving. Continue without waiting for save?')}
  function saveCopy(){if(!record)return toast('Open a costing first');if(!save(false))return;const before=record;record={...structuredClone(before),recordId:id(),revision:1,revisionHistory:[],copiedFromRecordId:before.recordId,updatedAt:new Date().toISOString()};dirty=true;save(true);showEditor();}
  function newRevision(reason){if(!record)return;reason=String(reason||'').trim();if(!reason)return toast('Explain this revision before continuing');if((record.revisionHistory||[]).length>=15)return toast('Download a saved copy before more revisions');const old=structuredClone(record);delete old.revisionHistory;record.revisionHistory??=[];record.revisionHistory.push({revision:record.revision,recordedAt:new Date().toISOString(),reason,snapshot:old});record.revision+=1;record.updatedAt=new Date().toISOString();pending();showEditor('history');}
  function offerApply(i){const a=record?.alternatives?.[i];if(!a)return;const check=P.validatedOffer(a,record);if(check.error)return toast(check.error);if(a.extraPerPieceUSD>0)return toast('Add sourced landed charges as a separate cost line before applying this material rate; they will not be silently omitted.');if(!confirm('Start a new revision and apply this fabric rate? Ensure that relevant commercial charges are included separately.'))return;
    const reason='Applied fabric offer '+a.label+' / source '+a.sourceRef;const old=structuredClone(record);delete old.revisionHistory;record.revisionHistory??=[];record.revisionHistory.push({revision:record.revision,recordedAt:new Date().toISOString(),reason,snapshot:old});record.revision++;const line=record.lines.find(l=>l.id===a.lineId);line.rate=a.rate;line.currency=a.currency;line.localCurrencyPerUSD=a.fx;line.sourceRef=a.sourceRef;line.sourceDate=a.sourceDate||'';line.verifiedSource=false;record.updatedAt=new Date().toISOString();pending();showEditor('lines');}
  const getReport=type=>P.report(type,record);
  function reportAction(type,which){if(!record)return toast('Open a costing first');const html=getReport(type);if(which==='download')return download(html,`VESA-COSTING-${type}-${record.recordId}.html`,'text/html');
    const win=window.open('','_blank');if(win){win.document.open();win.document.write(html);win.document.close();if(which==='print')win.addEventListener('load',()=>win.print(),{once:true});}else download(html,`VESA-COSTING-${type}-${record.recordId}.html`,'text/html');}
  async function loadXLSX(){if(window.XLSX?.read)return window.XLSX;return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='/apps/tna/vendor/xlsx.full.min.js';script.onload=()=>window.XLSX?.read?resolve(window.XLSX):reject(Error('Spreadsheet library missing'));script.onerror=()=>reject(Error('Offline Excel library not available. CSV and saved copies still work.'));document.head.append(script);});}
  async function xlsxExport(){if(!record)return toast('Open a costing first');try{const X=await loadXLSX(),book=X.utils.book_new();for(const [name,arr] of P.exportSheets(record)){X.utils.book_append_sheet(book,X.utils.aoa_to_sheet(arr),name);}const data=X.write(book,{bookType:'xlsx',type:'array',compression:true});download(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`VESA-COSTING-${record.recordId}.xlsx`);}catch(e){toast(e.message)}}
  function reportMenu(){modal(tr('reportType'),`<div class="costing-report-grid">${reportNames.map(([key,name])=>`<article><b>${esc(key)} · ${esc(name)}</b><div><button class="costing-btn secondary" data-report="${key}">${esc(tr('prepare'))}</button><button class="costing-btn secondary" data-report-download="${key}">${esc(tr('downReport'))}</button></div></article>`).join('')}</div>`);}
  function consumption(){if(!record)return toast('Open a costing first');const fabric=record.lines.filter(l=>l.category==='FABRIC'&&l.basis==='PER_PIECE');if(!fabric.length)return toast('Add a per-piece fabric cost line first');const lines=fabric.map(l=>[l.id,l.description||l.id]);
    modal(tr('tools'),`<form id="costingCalculator" class="costing-form"><label>${esc(tr('method'))}${select('name="method" id="calculationMethod"',[['knit',tr('knit')],['woven',tr('woven')]],'knit')}</label><label>${esc(tr('target'))}${select('name="target"',lines,lines[0][0])}</label><label>${esc(tr('area'))}<input type="number" name="area" min="0" step="any"></label><label>${esc(tr('gsm'))}<input type="number" name="gsm" min="0" step="any"></label><label>${esc(tr('marker'))}<input type="number" name="marker" min="0" step="any"></label><label>${esc(tr('markers'))}<input type="number" name="count" min="1" step="1"></label><label>Waste %<input type="number" name="waste" min="0" max="100" step="any" value="0"></label><label>${esc(tr('shrink'))}<input type="number" name="shrink" min="0" max="100" step="any" value="0"></label><label><input type="checkbox" name="alreadyShrink">${esc(tr('alreadyShrink'))}</label><label><input type="checkbox" name="alreadyWaste">${esc(tr('alreadyWaste'))}</label><label>Woven output ${select('name="unit"',[['m','metres'],['yd','yards']],'m')}</label><label>Approved marker / area source<input name="calcSource" required maxlength="240"></label><label>Usable fabric width in cm (woven)<input name="width" type="number" min="1" step="any"></label><button class="costing-btn" type="submit">${esc(tr('run'))}</button></form><p class="costing-warning">${esc(tr('toolsHelp'))}</p>`);
  }
  const number=(v)=>v===''||v==null?null:Number(v);
  function applyConsumption(form){const fd=new FormData(form);const method=fd.get('method'), target=record.lines.find(l=>l.id===fd.get('target'));if(!target)throw Error('Select a valid fabric line');if(!String(fd.get('calcSource')||'').trim())throw Error('Enter the approved marker/area source first');const n=k=>Number(fd.get(k));let quantity,unit;
    if(method==='knit'){const calc=C.knitKgPerPiece({approvedCutAreaM2:n('area'),gsm:n('gsm'),wastePercent:n('waste'),additionalShrinkPercent:n('shrink'),areaAlreadyIncludesShrink:fd.has('alreadyShrink')});quantity=calc.grossKgPerPiece;unit='kg';}
    else{if(!Number.isFinite(n('width'))||n('width')<=0)throw Error('Confirm the approved usable fabric width');const calc=C.wovenMarkerPerPiece({markerLengthM:n('marker'),garmentsPerMarker:n('count'),wastePercent:n('waste'),markerAlreadyIncludesWaste:fd.has('alreadyWaste')});unit=fd.get('unit');quantity=unit==='yd'?calc.grossYdPerPiece:calc.grossMPerPiece;}
    target.quantity=quantity;target.unit=unit;target.wastePercent=0;target.consumptionMethod=method==='knit'?'APPROVED_KNIT_AREA':'APPROVED_WOVEN_MARKER';target.consumptionSourceRef=String(fd.get('calcSource'));target.usableWidthCm=method==='woven'?n('width'):null;pending();dialog.close();showEditor('lines');toast('Consumption applied. Confirm source, rates and waste assumptions.');}
  function commissionCompare(){if(!record)return;const rate=record.policy.commissionPercent;if(rate==null||!Number.isFinite(rate)||rate<0||rate>=100)return toast('Enter a valid commission % first');const rows=['NONE','IN_FOB','SEPARATE'].map(mode=>{const clone=structuredClone(record);clone.policy.commissionTreatment=mode;clone.policy.commissionPercent=mode==='NONE'?0:rate;const result=E.calculate(clone);return `<tr><td>${esc(mode)}</td><td>${esc(result.summary?E.roundDisplay(result.summary.fobUsdPerPiece,6):'Needs information')}</td><td>${esc(result.summary?E.roundDisplay(result.summary.commissionUsdPerPiece,6):'Needs information')}</td></tr>`;});modal(tr('commissionCompare'),`<table class="costing-table"><thead><tr><th>Mode</th><th>Buyer FOB USD/pc</th><th>Commission USD/pc</th></tr></thead><tbody>${rows.join('')}</tbody></table><p>${esc(tr('rates'))}</p>`);}
  const parseCSV=text=>{const out=[],row=[],s=String(text).replace(/^\uFEFF/,'');let buf='',quoted=false;for(let i=0;i<s.length;i++){const ch=s[i];if(quoted){if(ch==='"'&&s[i+1]==='"'){buf+='"';i++;}else if(ch==='"')quoted=false;else buf+=ch;}else if(ch==='"'){if(buf)throw Error('Invalid CSV quoting');quoted=true;}else if(ch===','){row.push(buf);buf='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(buf);if(row.some(v=>v!==''))out.push([...row]);row.length=0;buf='';}else buf+=ch;}if(quoted)throw Error('Unclosed CSV quote');row.push(buf);if(row.some(v=>v!==''))out.push(row);return out;};
  function importedLinesCsv(body){const rows=parseCSV(body);if(!rows.length)throw Error('Cost lines file is empty');const keys=rows[0].map(x=>x.toLowerCase().trim().replace(/^\uFEFF/,''));const required=['line_id','category','description','basis','quantity','unit','waste_percent','rate','currency','currency_units_per_usd','source_ref'];if(!required.every(k=>keys.includes(k)))throw Error('Select the BOM_COST_LINES.csv template with the expected column names');if(rows.length>201)throw Error('Maximum 200 cost lines');const result=[];for(let i=1;i<rows.length;i++){const cells=Object.fromEntries(keys.map((k,j)=>[k,rows[i]?.[j]??'']));const n=k=>number(cells[k]);const line={id:cells.line_id,category:cells.category,description:cells.description,basis:cells.basis,quantity:n('quantity'),unit:cells.unit,wastePercent:n('waste_percent'),rate:n('rate'),currency:cells.currency.toUpperCase(),localCurrencyPerUSD:n('currency_units_per_usd'),sourceRef:cells.source_ref,sourceDate:cells.source_date||'',zeroRateReason:cells.zero_rate_reason||'',verifiedSource:String(cells.verified_source||'').toLowerCase()==='true',isRequired:true};if(!line.id)throw Error('Line ID missing on CSV row '+(i+1));result.push(line);}return result;}
  async function handlePicked(){const file=picker.files?.[0];if(!file)return;try{
      if(pickType==='copy'){if(file.size>S.MAX_BYTES)throw Error('Saved copy exceeds 2 MB');const draft=S.importAsNewDraft(await file.text(),id);if(!askDiscard())return;record=draft;dirty=true;save(true);showEditor('style');}
      else if(pickType==='xlsx'){if(file.size>1024*1024)throw Error('Excel file too large (1 MB maximum)');const X=await loadXLSX(),wb=X.read(await file.arrayBuffer(),{type:'array',cellFormula:true,cellHTML:false,cellText:false});const draft=P.workbookDataToDraft(wb,id);if(!askDiscard())return;record=draft;dirty=true;save(true);showEditor('style');toast('Excel draft imported. Review each rate/source and commission.');}
      else{if(file.size>256*1024)throw Error('CSV file too large (256 KB maximum)');if(!record)throw Error('Open a costing first');const lines=importedLinesCsv(await file.text());const trial=structuredClone(record);trial.lines=[...trial.lines,...lines];if(trial.lines.length>E.MAX_LINES)throw Error('Maximum 200 cost lines');const ids=trial.lines.map(l=>l.id);if(new Set(ids).size!==ids.length)throw Error('Duplicate cost-line IDs');if(!confirm(`Append ${lines.length} cost lines to this draft?`))return;record=trial;pending();showEditor('lines');}
    }catch(e){toast(e.message)}finally{picker.value='';}
  }
  function run(command){if(command==='dismiss'){dialog.close();return;}if(dialog.open)dialog.close();
    const needsRecord=()=>{if(record)return true;toast('Open or create a costing first');return false;};
    switch(command){case 'home':showHome();break;case 'new':if(!askDiscard())return;record=newRecord();dirty=true;pending();showEditor('style');break;case 'practice':if(!askDiscard())return;record=structuredClone(window.VESA_COSTING_DEMO);record.recordId=id();record.revisionHistory=[];record.alternatives=[];dirty=true;pending();showEditor('lines');break;
    case 'resume':try{const saved=S.list(localStorage,USER);if(!saved.length)return toast(tr('noSaved'));record=S.open(localStorage,saved[0].recordId,USER);dirty=false;showEditor('style');}catch(e){toast(e.message)}break;
    case 'open':try{const saved=S.list(localStorage,USER);if(!saved.length)return toast(tr('noSaved'));modal(tr('choose'),saved.map(x=>`<button class="costing-btn secondary" data-open="${esc(x.recordId)}">${esc(x.styleNo||x.recordId)} · ${esc(x.buyer||'')} ${x.sourceKind==='demo'?'· DEMO':''}</button>`).join(''));}catch(e){toast(e.message)}break;
    case 'add':if(needsRecord())addLine();break;case 'addOffer':if(needsRecord())addOffer();break;case 'save':if(needsRecord())save(true);break;case 'duplicate':if(needsRecord())saveCopy();break;
    case 'download':if(needsRecord())try{download(S.encode(record),`VESA-COSTING-${record.recordId}.vesacost`,'application/json')}catch(e){toast(e.message)}break;
    case 'copy':chooseFile('copy');break;case 'xlsxImport':chooseFile('xlsx');break;case 'csvImport':chooseFile('csv');break;case 'xlsxExport':xlsxExport();break;
    case 'report':case 'reports':if(needsRecord())reportMenu();break;case 'print':if(needsRecord())reportAction(currentReport,'print');break;
    case 'share':if(navigator.share)navigator.share({title:'VESA Costing 360 demo',text:'Personal costing tool. No buyer data included.',url:location.origin+'/apps/costing/'}).catch(()=>{});else toast('Share unavailable; you can copy the app URL.');break;
    case 'revision':if(needsRecord())modal(tr('newRev'),`<form id="costingRevision"><label>${esc(tr('reason'))}<input required name="reason" maxlength="200" autofocus></label><button class="costing-btn" type="submit">${esc(tr('newRev'))}</button></form>`);break;
    case 'consumption':consumption();break;case 'commissionCompare':commissionCompare();break;
    case 'help':modal(tr('help'),`<p>${esc(tr('guide2'))}</p><p>${esc(tr('remind'))}</p><p class="costing-warning">${esc(tr('rates'))}</p><p>${esc(tr('toolsHelp'))}</p>`);break;
    case 'style':case 'lines':case 'commission':case 'offers':case 'sources':case 'history':case 'missing':showEditor(command);break;
    case 'viewSummary':showEditor('commission');break;
  }}
  function openSaved(recordId){try{const next=S.open(localStorage,recordId,USER);if(!next)throw Error('Record not found');if(!askDiscard())return;record=next;dirty=false;if(dialog.open)dialog.close();showEditor('style');}catch(e){toast(e.message)}}
  function updateField(el){if(!record)return;const n=v=>v===''?null:Number(v);
    if(el.dataset.style){const k=el.dataset.style;record.style[k]=['quantityPieces','fabricLCdays','fabricWeightValue'].includes(k)?n(el.value):el.value;}
    else if(el.dataset.policy){const k=el.dataset.policy;record.policy[k]=k==='commissionPercent'?n(el.value):el.value;if(k==='commissionTreatment'&&el.value==='NONE')record.policy.commissionPercent=0;}
    else if(el.dataset.line!=null){const l=record.lines[Number(el.dataset.line)];if(!l)return;const k=el.dataset.lkey;l[k]=k==='verifiedSource'?el.checked:['quantity','rate','localCurrencyPerUSD','wastePercent'].includes(k)?n(el.value):k==='currency'?el.value.toUpperCase():el.value;if(k==='basis'&&el.value==='PER_ORDER')l.wastePercent=0;}
    else if(el.dataset.offer!=null){const a=record.alternatives[Number(el.dataset.offer)];if(!a)return;const k=el.dataset.okey;a[k]=['rate','fx','extraPerPieceUSD'].includes(k)?n(el.value):k==='currency'?el.value.toUpperCase():el.value;}
    else return;record.updatedAt=new Date().toISOString();pending();updateSummary();
  }
  main.addEventListener('input',e=>{if(e.target.matches('[data-style],[data-policy],[data-line],[data-offer]')&&!e.target.matches('select,[type="checkbox"]'))updateField(e.target);});
  main.addEventListener('change',e=>{if(e.target.matches('select[data-style],select[data-policy],select[data-line],select[data-offer],input[type="checkbox"][data-line]')){updateField(e.target);if(e.target.dataset.policy==='commissionTreatment'||e.target.dataset.lkey==='basis')showEditor(section);}});
  main.addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;
    if(x.dataset.section){showEditor(x.dataset.section);return;}
    if(x.dataset.open){openSaved(x.dataset.open);return;}
    if(x.dataset.removeLine!=null){record.lines.splice(Number(x.dataset.removeLine),1);pending();showEditor('lines');return;}
    if(x.dataset.removeOffer!=null){record.alternatives.splice(Number(x.dataset.removeOffer),1);pending();showEditor('offers');return;}
    if(x.dataset.applyOffer!=null){offerApply(Number(x.dataset.applyOffer));return;}
    if(x.dataset.report){currentReport=x.dataset.report;reportAction(currentReport,'open');return;}
    if(x.dataset.reportDownload){currentReport=x.dataset.reportDownload;reportAction(currentReport,'download');return;}
    if(x.dataset.cmd)run(x.dataset.cmd);
  });
  dialog.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.report){currentReport=b.dataset.report;reportAction(currentReport,'open');return;}if(b.dataset.reportDownload){currentReport=b.dataset.reportDownload;reportAction(currentReport,'download');return;}if(b.dataset.open){openSaved(b.dataset.open);return;}if(b.dataset.cmd)run(b.dataset.cmd);});
  dialog.addEventListener('submit',e=>{e.preventDefault();try{if(e.target.id==='costingCalculator')applyConsumption(e.target);if(e.target.id==='costingRevision'){const reason=new FormData(e.target).get('reason');dialog.close();newRevision(reason);}}catch(err){toast(err.message)}});
  picker.addEventListener('change',handlePicked);
  window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
  window.addEventListener('vesa-preferences-change',()=>{if(view==='editor')showEditor(section);else showHome()});
  const session=window.VesaAuth?.session?.()||{};
  shell=new window.VesaWorkspaceShell.VesaWorkspaceShell({root:document.body,descriptor:{id:'costing',name:'VESA Costing 360',route:'/apps/costing/',contentTarget:'#costingMain',userLabel:session.name||session.email||'',userRole:session.role||''},callbacks:{menu}});
  shell.mount();showHome();

})();

</script>
</body>
