<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ef">
  <meta name="description" content="Explore VESA apparel categories with individual model visuals and garment details.">
  <title>Product showcase | VESA Enterprise Inc</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="styles.css?v=20261127-4">
  <script src="catalogue.js?v=20261127-4" defer></script>
  <script src="director.js?v=20261127-4" defer></script>
  <script src="garment-details.js?v=20261127-4" defer></script>
  <script src="category-navigation.js?v=20261127-5" defer></script>
  <script src="experience.js?v=20261127-5" defer></script>
  <script src="bootstrap.js?v=20261127-4" defer></script>
</head>
<body>
<main class="vesa-showcase experience with-collections" id="experience" aria-label="VESA product showcase" aria-roledescription="carousel" data-mode="page" data-motion-paused="true" tabindex="-1">
  <div class="scenery" aria-hidden="true"><div class="environment"></div><div class="light-beam"></div></div>
  <header class="masthead">
    <a id="standalone-home" class="brand" href="/" aria-label="VESA Enterprise Inc home"><img src="/assets/vesa-logo.png" alt="VESA Enterprise Inc" width="154" height="70"></a>
    <h2 id="showcase-heading" class="section-title">Product showcase</h2>
    <div class="viewer-actions">
      <button class="index-trigger" id="open-index" type="button" aria-label="Browse all products" aria-haspopup="dialog" aria-controls="index-dialog">
        <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path d="M2 2h5v5H2zM11 2h5v5h-5zM2 11h5v5H2zM11 11h5v5h-5z" fill="currentColor"/></svg><span>Search products</span>
      </button>
      <button class="index-trigger expand-trigger" id="expand-view" type="button" aria-haspopup="dialog">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>View larger</span>
      </button>
    </div>
  </header>
  <nav class="collection-nav" id="chapters" aria-label="Collections">
    <div class="collection-controls" id="collection-controls"></div>
    <section id="collection-panel" class="collection-panel" aria-labelledby="collection-panel-title" hidden>
      <div class="collection-panel-head">
        <h2 id="collection-panel-title">Collections</h2>
        <button id="browse-collection" class="collection-browse" type="button">View collection</button>
        <button id="close-collection" class="collection-close" type="button" aria-label="Close collections"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
      </div>
      <div class="collection-list" id="collection-list"></div>
    </section>
  </nav>
  <div class="presentation">
    <div class="copy" id="copy">
      <div class="eyebrow" id="chapter">Men's apparel</div>
      <div class="headline-mask"><h1 id="headline"><span id="style-name">Casual Woven Shirt (solid)</span></h1></div>
      <span id="style-id" class="sr-only">M16</span>
      <div class="garment-switch" id="garment-switch" role="group" aria-label="Inspect garment">
        <button type="button" data-zone="top" aria-pressed="false">Top</button>
        <button type="button" data-zone="bottom" aria-pressed="false">Bottom</button>
        <button type="button" data-zone="one" aria-pressed="false" hidden>Garment</button>
      </div>
      <div class="detail-slot">
        <p class="inspection-help" id="detail-hint">Select a garment for details.</p>
        <div class="detail-summary" id="detail-summary" hidden>
          <div class="detail-meta"><span id="detail-kind"></span><span aria-hidden="true">·</span><span id="detail-role"></span></div>
          <strong id="detail-name"></strong>
        </div>
      </div>
      <p id="load-status" role="status" hidden></p>
    </div>
    <div class="scene" id="scene" tabindex="0" role="group" aria-label="Garment models. Choose a side model or inspect the main garment.">
      <div class="architecture" aria-hidden="true"><div class="portal-core"></div><div class="floor"></div></div>
      <div id="actor-stage" class="actor-stage"></div>
    </div>
  </div>
  <div id="garment-callout" class="garment-callout" aria-hidden="true" hidden>
    <div class="detail-meta"><span id="callout-kind"></span><span>·</span><span id="callout-role"></span></div><strong id="callout-name"></strong>
  </div>
  <div id="garment-pin" class="garment-pin" aria-hidden="true" hidden></div>
  <svg id="garment-line" class="garment-line" aria-hidden="true" hidden><path id="callout-path" fill="none"/></svg>
  <footer class="control-zone">
    <div class="transport">
      <div class="timeline" aria-label="Position in selected collection"><div class="count"><span id="count">01</span><span class="count-total" id="total"> / 121</span></div><div class="track" aria-hidden="true"><div id="progress" class="progress"></div></div></div>
      <div class="transport-actions">
        <button id="previous" class="arrow" type="button" aria-label="Previous look"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg></button>
        <button id="play" class="play" type="button" aria-label="Play slideshow"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" d="M8 5l12 7-12 7z"/></svg></button>
        <button id="next" class="arrow" type="button" aria-label="Next look"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg></button>
      </div>
    </div>
  </footer>
  <div class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></div>
  <div class="sr-only" id="detail-announcement" aria-live="polite" aria-atomic="true"></div>
  <dialog id="index-dialog" class="index-dialog" aria-labelledby="index-title" aria-describedby="index-note">
    <div class="drawer-head">
      <div><h2 id="index-title">Product collection</h2><p id="index-note" class="drawer-note">AI-generated representative garment visuals.</p></div>
      <button id="close-index" type="button" aria-label="Close collection" class="close-button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
    </div>
    <label class="sr-only" for="search">Search garments</label>
    <input id="search" placeholder="Search garments or style code" type="search" autocomplete="off">
    <div id="index-grid" class="index-grid"></div>
    <p id="empty" role="status" hidden>No matching garments. Try a product name or style code.</p>
  </dialog>
</main>
<noscript><p style="padding:24px;font:16px/1.5 Arial,sans-serif">Enable JavaScript to browse the product showcase. <a href="/#capability-matrix">View apparel categories on the homepage.</a></p></noscript>
</body>
</html>
