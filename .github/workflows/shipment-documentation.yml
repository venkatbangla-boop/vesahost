# APP-07 local branch acceptance. Cannot deploy public site from this workflow.
name: VESA Shipment Documentation 360 verification
on:
  push:
    branches:
      - feature/shipment-documentation-360
    paths:
      - 'apps/shipment-documentation/**'
      - '.github/workflows/shipment-documentation.yml'
      - 'js/app-catalogue.js'
      - 'js/preferences.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shipment-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shipment and legacy engine domain checks
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/shipment-documentation/src/domain/shipment-engine.js
          node --check apps/shipment-documentation/src/data/local-record-port.js
          node --check apps/shipment-documentation/src/reports/report-model.js
          node apps/shipment-documentation/tests/domain.test.cjs
          node --check apps/shipment-documentation/src/application/workspace-controller.js
          node --check apps/shipment-documentation/src/i18n/app-copy.js
          node --check apps/shipment-documentation/src/bootstrap.js
          node --check apps/shipment-documentation/tests/browser-workflow.cjs
          node apps/fabric-trims/tests/domain.test.cjs
          node apps/sampling-approval/tests/domain.test.cjs
          node apps/lc-payment/tests/domain.test.cjs
          node apps/purchase-order/tests/domain.test.cjs
          node apps/packing-container/tests/domain.test.cjs
          node apps/order-commission/tests/domain.test.cjs
          node apps/tech-pack-spec/tests/domain.test.cjs
          node apps/tna/tests/g02-domain.test.js
          node apps/tna/tests/g05-storage.test.js
          node apps/ppm/tests/p-g00-baseline.cjs
          node apps/aql/tests/a-g00-baseline.cjs
          node apps/aql/tests/a-g03-sampling.cjs
          node tests/vesa-workspace-shell-contract.cjs
          git diff --check HEAD~1 HEAD
      - name: Install real Chromium in Github Free runner
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Shipment real browser acceptance
        run: node apps/shipment-documentation/tests/browser-workflow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipment360-synthetic-browser
          path: output/playwright/ship-app07-*
          if-no-files-found: ignore
