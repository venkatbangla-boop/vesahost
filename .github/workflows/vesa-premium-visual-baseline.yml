# Read-only personal showcase visual inventory. No deployment, no external records.
name: VESA 360 Premium UX visual baseline
on:
  push:
    branches:
      - feature/premium-responsive-ux-baseline
    paths:
      - 'tests/vesa-premium-visual-baseline.cjs'
      - 'docs/ux/**'
      - '.github/workflows/vesa-premium-visual-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesa-premium-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen source and screenshot script syntax
        run: |
          set -euo pipefail
          node --check tests/vesa-premium-visual-baseline.cjs
          node tests/vesa-blueprint-integrity.cjs
          git diff --check HEAD~1 HEAD
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Collect 150+ real screenshots and per-route metrics
        run: node tests/vesa-premium-visual-baseline.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesa-premium-150plus-visual-baseline
          path: output/premium-visual-baseline/
          if-no-files-found: error
          retention-days: 7
