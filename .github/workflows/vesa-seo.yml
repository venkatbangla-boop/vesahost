name: VESA Public SEO QA
on:
  push:
    branches: [main, feature/vesa-brand-seo-20261023]
    paths:
      - 'index.html'
      - 'about/**'
      - 'apparel-sourcing/**'
      - 'sourcing-bangladesh/**'
      - 'sourcing-india/**'
      - 'css/vesa-public-pages.css'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'service-worker.js'
      - 'tests/vesa-seo.cjs'
      - '.github/workflows/vesa-seo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check SEO and frozen project integrity
        run: |
          node --check tests/vesa-seo.cjs
          node --check service-worker.js
          node tests/vesa-seo.cjs
          node tests/vesa-blueprint-integrity.cjs
      - name: Install browser for real responsive checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Test pages on mobile and desktop
        run: node tests/vesa-seo.cjs --browser
