name: Chess casual mobile acceptance
on:
  push:
    branches: [feature/chess-casual-mobile-20261023, main]
    paths:
      - 'apps/chess-360/**'
      - 'tests/chess-casual-mobile.cjs'
      - 'tests/chess-panel-layout-qa.cjs'
      - '.github/workflows/chess-casual-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse chess UI and mobile acceptance
        run: |
          node --check apps/chess-360/chess-casual-mobile.js
          node --check apps/chess-360/sw.js
          node --check tests/chess-casual-mobile.cjs
      - name: Install Chromium and WebKit browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          # Avoid a full apt upgrade on ephemeral GitHub runners: it exceeded the CI time limit.
          npx playwright install chromium webkit
      - name: Real phone layout and replay/save acceptance
        run: |
          node tests/chess-casual-mobile.cjs
          node tests/chess-beast-v2.cjs
          node tests/chess-panel-layout-qa.cjs
          node tests/chess-match-experience.cjs
          node tests/chess-real-3d-browser.cjs
