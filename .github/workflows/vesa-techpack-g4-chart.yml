name: VESA Tech Pack G4 real size-chart feature verification
on:
  push:
    branches:
      - feature/techpack-g4-sizechart-discovery
      - main
    paths:
      - 'apps/tech-pack-spec/index.html'
      - 'apps/tech-pack-spec/tests/sizechart-discovery-browser.cjs'
      - 'service-worker.js'
      - 'tests/personal-demo-release.cjs'
      - '.github/workflows/vesa-techpack-g4-chart.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  techpack-real-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Blueprint checksum, source grading engine and 18 sibling rules
        run: |
          set -euo pipefail
          node --check apps/tech-pack-spec/tests/sizechart-discovery-browser.cjs
          node --check service-worker.js
          node tests/vesa-blueprint-integrity.cjs
          node tests/personal-demo-release.cjs
          node apps/tech-pack-spec/tests/domain.test.cjs
          node apps/order-commission/tests/domain.test.cjs
          node apps/packing-container/tests/domain.test.cjs
          node apps/ppm/tests/p-g00-baseline.cjs
          node apps/aql/tests/a-g03-sampling.cjs
          node apps/tna/tests/g02-domain.test.js
          git diff --check
          git diff --exit-code origin/main...HEAD -- index.html css/style.css js/main.js privacy.html terms.html
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Test source-calculated POM, 6 tasks, PDF/XLSX, reopen, siblings and shell
        run: |
          set -euo pipefail
          node apps/tech-pack-spec/tests/sizechart-discovery-browser.cjs
          node apps/tech-pack-spec/tests/browser-workflow.cjs
          node apps/order-commission/tests/browser-workflow.cjs
          node apps/packing-container/tests/browser-workflow.cjs
          node tests/vesa-platform-pages.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesa-techpack-g4-measurement-chart-screenshots
          path: output/playwright/techpack-g4-chart/
          if-no-files-found: ignore
          retention-days: 7
