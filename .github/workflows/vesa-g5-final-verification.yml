# G5 final evidence-only matrix. Runtime, source records and frozen engines are untouched.
# Runs real installed Chromium for original app-owned suites; human UAT is separate.
name: VESA 360 G5 core and 19-app integrated verification
on:
  push:
    branches:
      - feature/vesa-g5-core-final-proof-20261018
    paths:
      - '.github/workflows/vesa-g5-final-verification.yml'
      - 'tests/vesa-19-app-real-screens.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tna:
    name: TNA current-source Node and real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing source and domain contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/vesa-blueprint-integrity.cjs
          node tests/vesa-workspace-shell-contract.cjs
          node apps/tna/tests/g01-shell.test.js
          node apps/tna/tests/g02-domain.test.js
          node apps/tna/tests/g03-scheduling.test.js
          node apps/tna/tests/g04-operations.test.js
          node apps/tna/tests/g05-storage.test.js
          node apps/tna/tests/g05-ui.test.js
          node apps/tna/tests/g06-workspace.test.js
          node apps/tna/tests/g07-reports.test.js
          node apps/tna/tests/g08-scenarios.test.js
          node apps/tna/tests/g10-integration-references.test.js
          node apps/tna/tests/g10-notification-rules.test.js
          node apps/tna/tests/g11-calendar-fixtures.test.js
          node apps/tna/tests/g11-f06-order-master.test.js
          node apps/tna/tests/g11-garment-scenarios.test.js
          node apps/tna/tests/g11-graph-fixtures.test.js
          node apps/tna/tests/g11-risk-fixtures.test.js
          node apps/tna/tests/g11-saved-copy-migration.test.js
          node apps/tna/tests/g11-security-audit.test.js
          node apps/tna/tests/g11-portfolio-performance.test.js
          node apps/tna/tests/g12-local-handoff.test.js
          node apps/tna/tests/g13-merchandising-sheet.test.cjs
          node apps/tna/tests/g14-task-planning-date-revision.test.cjs
          node apps/tna/tests/g15-merchandising-export.test.cjs
          node apps/tna/tests/g16-offline-bundle.test.cjs
      - name: Install real Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require(\"playwright\").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Existing real browser workflows
        shell: bash
        run: |
          set -euo pipefail
          node apps/tna/tests/g11-unified-shell-browser.cjs
          node apps/tna/tests/g11-localization-accessibility.cjs
          node apps/tna/tests/g11-f06-order-master.cjs
          node apps/tna/tests/g11-artifact-viewers.cjs
          node apps/tna/tests/g10-linked-ui.cjs
          node apps/tna/tests/g13-merchandising-sheet-browser.cjs
          node apps/tna/tests/g16-offline-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesa-final-tna-synthetic-browser-evidence
          path: |
            output/playwright/
            output/vesa-19-real-screens/
          if-no-files-found: ignore
          retention-days: 7
