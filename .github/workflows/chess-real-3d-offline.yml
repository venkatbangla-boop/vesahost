# Separate independent acceptance gate; does not publish to GitHub Pages.
# Must PASS before any Real 3D promotion into main.
name: Chess Beast 360 true 3D offline
on:
  push:
    branches: [feature/chess-real-3d-mesh-20261018]
    paths:
      - 'tests/chess-real-3d-offline.cjs'
      - 'apps/chess-360/sw.js'
      - 'apps/chess-360/index.html'
      - 'apps/chess-360/chess-orbit.js'
      - 'apps/chess-360/chess-real-3d.css'
      - 'apps/chess-360/chess-real-3d-studio.mjs'
      - 'apps/chess-360/assets/real3d/**'
      - '.github/workflows/chess-real-3d-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  truly-offline-glb:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          CHROME="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Real Chess SW cache followed by network-off 3D playing board
        run: |
          set -euo pipefail
          node --check tests/chess-real-3d-offline.cjs
          node tests/chess-real-3d-offline.cjs
