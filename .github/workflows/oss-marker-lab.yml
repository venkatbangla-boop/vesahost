# Only a feature-branch offline integration, never a production deployment.
name: VESA offline SVGnest installation pilot
on:
  push:
    branches: [feature/oss-marker-lab-20261019]
    paths:
      - '.github/workflows/oss-marker-lab.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oss-marker-lab-20261019
          persist-credentials: true
      - name: Import pinned SVGnest MIT source (build time only)
        run: |
          set -euo pipefail
          UPSTREAM_SHA=1248dc21efd3f90d1aa52ba5785e27e5217ed2c9
          curl --fail --location --retry 3 --max-time 90 \
            "https://github.com/Jack000/SVGnest/archive/$UPSTREAM_SHA.tar.gz" \
            -o /tmp/vesa-oss-svgnest.tar.gz
          mkdir -p /tmp/vesa-oss-upstream
          tar -xzf /tmp/vesa-oss-svgnest.tar.gz -C /tmp/vesa-oss-upstream
          SOURCE="/tmp/vesa-oss-upstream/SVGnest-$UPSTREAM_SHA"
          test -f "$SOURCE/LICENSE.txt"
          grep -q 'Copyright (c) 2015 Jack Qiao' "$SOURCE/LICENSE.txt"
          grep -q 'The MIT License' "$SOURCE/LICENSE.txt"
          TARGET=apps/marker-lab/vendor
          mkdir -p "$TARGET"
          cp "$SOURCE/LICENSE.txt" "$SOURCE/index.html" "$SOURCE/style.css" \
             "$SOURCE/svgnest.js" "$SOURCE/svgparser.js" "$TARGET/"
          cp -R "$SOURCE/util" "$SOURCE/img" "$SOURCE/font" "$TARGET/"
          cp "$SOURCE/favicon16.gif" "$SOURCE/favicon32.gif" "$TARGET/"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('apps/marker-lab/vendor')
          page=root/'index.html'
          source=page.read_text(encoding='utf-8')
          source=source.replace('href="/favicon32.gif"','href="./favicon32.gif"')
          source=source.replace('href="/favicon16.gif"','href="./favicon16.gif"')
          page.write_text(source,encoding='utf-8')
          assert 'src="svgnest.js"' in source
          assert 'src="util/placementworker.js"' in source
          assert 'src="http' not in source and 'src="//' not in source
          print('SVGnest pinned MIT source imported locally')
          PY
      - name: Check local assets and JavaScript
        run: |
          set -euo pipefail
          node --check apps/marker-lab/src/workspace-controller.js
          node --check apps/marker-lab/service-worker.js
          node --check apps/marker-lab/vendor/svgnest.js
          node --check apps/marker-lab/vendor/svgparser.js
          node --check apps/marker-lab/vendor/util/placementworker.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('apps/marker-lab')
          code=(root/'service-worker.js').read_text(encoding='utf-8')
          assets=re.findall(r"'(\./[^']+)'",code.split('const ASSETS = [',1)[1].split('];',1)[0])
          missing=[p for p in assets if p!='./' and not (root/p).is_file()]
          if missing:raise SystemExit('OFFLINE_ASSETS_MISSING: '+', '.join(missing))
          assert (root/'vendor/LICENSE.txt').is_file()
          assert 'iframe' in (root/'index.html').read_text(encoding='utf-8')
          print('VESA_MARKER_LAB_VENDOR_OFFLINE_ASSETS_PASS',len(assets))
          PY
      - name: Commit vendor only to isolated feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/marker-lab/vendor
          if git diff --cached --quiet; then
            echo SVGnest_VENDOR_ALREADY_INSTALLED
          else
            git commit -m "vendor(marker-lab): install pinned MIT SVGnest offline source"
            git push origin HEAD:feature/oss-marker-lab-20261019
          fi