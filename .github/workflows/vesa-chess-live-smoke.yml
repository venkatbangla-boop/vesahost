# One-time independent live-byte verification. Runs on feature branch and does not touch main.
name: VESA Chess AQL Login final live bytes
on:
  push:
    branches: [feature/aql-direct-chess-ux-20261018]
    paths: ['.github/workflows/vesa-chess-live-smoke.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Compare exact publicly served Chess, AQL, Login and App Centre bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vesa-verified-live
          for file in apps/chess-360/index.html apps/aql/index.html apps/aql/service-worker.js login/index.html apps/index.html js/app-catalogue.js js/vesa-app-centre.js js/preferences.js service-worker.js; do
            local_sha="$(sha256sum "$file" | cut -d ' ' -f 1)"
            output="/tmp/vesa-verified-live/$(echo "$file" | tr / _)"
            url="https://vesaent.com/$file?vesa_final_verify=20261018"
            curl --retry 6 --retry-all-errors --retry-delay 7 --fail --location --silent --show-error --max-time 75 "$url" -o "$output"
            cmp "$file" "$output"
            echo "LIVE_BYTE_PASS $file $local_sha"
          done
          echo "VESA_CHESS_AQL_LOGIN_PUBLIC_9_OF_9_PASS app exact bytes on origin"
