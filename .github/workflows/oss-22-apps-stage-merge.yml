# Only combine already-tested OSS pilot source under an isolated feature branch.
# No main write, no deploy. Source branch is pinned to its accepted Chromium SHA.
name: VESA OSS 22-app stage source merge
on:
  push:
    branches: [feature/oss-22-apps-integration-20261019]
    paths:
      - '.github/workflows/oss-22-apps-stage-merge.yml'
permissions:
  contents: write
jobs:
  merge-two-pilots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oss-22-apps-integration-20261019
          fetch-depth: 0
          persist-credentials: true
      - name: Merge pinned SVG Studio into already-verified Marker Lab pilot
        run: |
          set -euo pipefail
          PIN=2bb179f90de4035e2be0f55c58e7b75ff5465356
          git fetch origin feature/oss-svg-edit-audit-20261019
          ACTUAL="$(git rev-parse FETCH_HEAD)"
          if [ "$ACTUAL" != "$PIN" ]; then
            echo "SVG_STUDIO_SHA_CHANGED; stopping instead of silently widening scope"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit "$PIN"
          # Upstream vendor files include original whitespace; do not rewrite those
          # license-preserved bytes. Check only integration-owned source files.
          git diff --check HEAD^1 HEAD -- ':!apps/artwork-cad-studio/vendor/**' ':!apps/marker-lab/vendor/**'
          test -s apps/marker-lab/vendor/svgnest.js
          test -s apps/artwork-cad-studio/vendor/Editor.js
          test -s apps/artwork-cad-studio/offline-manifest.json
          test -s apps/artwork-cad-studio/vendor/licenseInfo.json
          git push origin HEAD:feature/oss-22-apps-integration-20261019
