name: VESA Costing 360 verification

on:
  push:
    branches:
      - feature/costing-360
      - feature/costing-g4-mobile-dialog
      - feature/fabric-g4-source-journey
      - main
    paths:
      - '.github/workflows/costing-360-verification.yml'
      - 'apps/costing/**'
      - 'apps/index.html'
      - 'service-worker.js'
      - 'apps/tna/tests/g11-route-regression.cjs'
      - 'tests/vesa-platform-pages.cjs'
      - 'login/index.html'
      - 'js/**'
      - 'css/**'
      - 'assets/vesa-logo-black.png'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  costing-real-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout real VESA repository
        uses: actions/checkout@v4
      - name: Use Node for pure deterministic checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Costing calculation and import contract tests
        run: node --test apps/costing/tests/costing.test.cjs
      - name: Check shared JavaScript syntax
        run: |
          node --check js/preferences.js
          node --check js/app-catalogue.js
          node --check js/auth.js
          node --check js/vesa-workspace-shell.js
          node --check service-worker.js
      - name: Test TNA, PPM, AQL, shared shell and saved-format compatibility
        run: |
          node tests/vesa-workspace-shell-contract.cjs
          node tests/vesa-next-app-starter.cjs
          node apps/tna/tests/g01-shell.test.js
          node apps/tna/tests/g03-scheduling.test.js
          node apps/tna/tests/g05-storage.test.js
          node apps/ppm/tests/p-g00-baseline.cjs
          node apps/aql/tests/a-g00-baseline.cjs
          node apps/aql/tests/a-g03-sampling.cjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real browser Login, App Centre, Costing, offline and Excel checks
        run: python apps/costing/tests/costing_real_e2e.py
      - name: Install free Node browser test client (same Chromium revision)
        run: npm install --no-save --no-package-lock playwright@1.56.0
      - name: Prove four-app catalogue, original app routes and platform UI
        run: |
          node tests/vesa-platform-pages.cjs
          node apps/tna/tests/g11-route-regression.cjs
          node tests/vesa-shared-shell-matrix.cjs
          node tests/vesa-uniform-experience.cjs
