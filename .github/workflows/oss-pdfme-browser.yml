name: VESA PDF Studio real Chromium acceptance
on:
  push:
    branches: [feature/oss-pdfme-studio-20261019]
    paths: ['apps/pdf-template-studio/tests/**','.github/workflows/oss-pdfme-browser.yml','apps/pdf-template-studio/vendor/LICENSE-pdfme.md']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Asset and schema gates
        run: |
          set -euo pipefail
          test -s apps/pdf-template-studio/vendor/index.html
          test -s apps/pdf-template-studio/vendor/LICENSE-pdfme.md
          test -s apps/pdf-template-studio/offline-manifest.json
          node --check apps/pdf-template-studio/service-worker.js
          node --check apps/pdf-template-studio/tests/browser-workflow.cjs
          python3 - <<'PY'
          import json,pathlib
          base=pathlib.Path('apps/pdf-template-studio')
          manifest=json.loads((base/'offline-manifest.json').read_text())
          for filename in manifest['files']:
              assert filename.startswith('./'),filename
              assert (base/filename).is_file(),filename
          print('PDF_STUDIO_LOCAL_MANIFEST_PASS',len(manifest['files']))
          PY
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Test PDF export, saved template and offline reload
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pdf-studio-test.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/apps/pdf-template-studio/ >/dev/null && break
            sleep 1
          done
          node apps/pdf-template-studio/tests/browser-workflow.cjs
      - name: Existing garment rules remain preserved
        run: |
          node tests/vesa-blueprint-integrity.cjs
          node apps/tna/tests/g02-domain.test.js
          node apps/ppm/tests/p-g00-baseline.cjs
          node apps/aql/tests/a-g03-sampling.cjs
