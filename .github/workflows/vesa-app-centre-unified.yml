# UI-only, one-app App Centre proof. This job cannot publish or alter records.
name: VESA unified App Centre UI verification
on:
  push:
    branches:
      - feature/vesa-app-centre-unified
      - feature/premium-app-centre-desktop
      - main
    paths:
      - 'apps/index.html'
      - 'css/vesa-app-centre.css'
      - 'js/vesa-app-centre.js'
      - 'service-worker.js'
      - 'tests/vesa-platform-pages.cjs'
      - 'tests/personal-demo-release.cjs'
      - '.github/workflows/vesa-app-centre-unified.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-centre-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source contracts and isolated app-domain baselines
        run: |
          set -euo pipefail
          node --check js/vesa-app-centre.js
          node --check service-worker.js
          node --check tests/vesa-platform-pages.cjs
          node tests/vesa-blueprint-integrity.cjs
          node tests/personal-demo-release.cjs
          node tests/vesa-workspace-shell-contract.cjs
          node apps/tna/tests/g02-domain.test.js
          node apps/ppm/tests/p-g00-baseline.cjs
          node apps/aql/tests/a-g03-sampling.cjs
          node apps/costing/tests/costing.test.cjs
          node apps/product-development/tests/domain.test.cjs
          git diff --check HEAD~1 HEAD
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify 19 apps, responsive search, locales, single shell and old core routes
        run: |
          set -euo pipefail
          node tests/vesa-platform-pages.cjs
          node tests/vesa-uniform-experience.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesa-app-centre-19-route-browser
          path: output/playwright/vesa-platform-*
          if-no-files-found: ignore
