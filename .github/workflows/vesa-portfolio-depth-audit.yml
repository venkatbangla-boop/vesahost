name: VESA 19-app depth and AQL full-source audit
on:
  push:
    branches:
      - audit/aql-vs-portfolio-depth-20261018
    paths:
      - 'tests/vesa-portfolio-depth-audit.cjs'
      - '.github/workflows/vesa-portfolio-depth-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable approved blueprints and syntax
        run: |
          set -euo pipefail
          node --check tests/vesa-portfolio-depth-audit.cjs
          node tests/vesa-blueprint-integrity.cjs
      - name: Audit all 19 actual sources and the entire 11.8MB AQL HTML
        run: |
          node tests/vesa-portfolio-depth-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesa-aql-versus-19-source-audit
          path: output/portfolio-depth-audit/
          if-no-files-found: error
          retention-days: 7
