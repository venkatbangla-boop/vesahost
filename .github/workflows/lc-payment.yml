# LC & Payment local verification only; does not publish GitHub Pages.
name: VESA LC Payment 360 verification
on:
  push:
    branches:
      - feature/lc-payment-360
    paths:
      - 'apps/lc-payment/**'
      - '.github/workflows/lc-payment.yml'
      - 'js/app-catalogue.js'
      - 'js/preferences.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-lc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Domain and sibling verification
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/lc-payment/tests/domain.test.cjs
          node --check apps/lc-payment/tests/browser-workflow.cjs
          node apps/lc-payment/tests/domain.test.cjs
          node tests/personal-demo-release.cjs
          node --check service-worker.js
          node apps/purchase-order/tests/domain.test.cjs
          node apps/packing-container/tests/domain.test.cjs
          node apps/order-commission/tests/domain.test.cjs
          node apps/tech-pack-spec/tests/domain.test.cjs
          node apps/tna/tests/g02-domain.test.js
          node apps/tna/tests/g05-storage.test.js
          node apps/ppm/tests/p-g00-baseline.cjs
          node apps/aql/tests/a-g00-baseline.cjs
          node apps/aql/tests/a-g03-sampling.cjs
          node tests/vesa-workspace-shell-contract.cjs
          git diff --check HEAD~2..HEAD
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Actual synthetic LC browser lifecycle
        run: node apps/lc-payment/tests/browser-workflow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lc360-synthetic-evidence
          path: output/playwright/lc-app05-*
          if-no-files-found: ignore
