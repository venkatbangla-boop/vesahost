# APP-14 pure claims source-domain synthetic M1 only. No legal, financial or AQL control.
name: VESA Claims Disputes 360 verification
on:
  push:
    branches:
      - feature/claims-disputes-360
    paths:
      - 'apps/claims-disputes/**'
      - 'docs/claims-disputes/**'
      - '.github/workflows/claims-disputes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claims-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical 15 blueprints, source-only claims and all previous application domains
        run: |
          set -euo pipefail
          node tests/vesa-blueprint-integrity.cjs
          node --check apps/claims-disputes/src/domain/claim-register.js
          node --check apps/claims-disputes/src/domain/exposure-ledger.js
          node --check apps/claims-disputes/src/domain/settlement-history.js
          node --check apps/claims-disputes/tests/domain.test.cjs
          node apps/claims-disputes/tests/domain.test.cjs
          node --check apps/claims-disputes/src/bootstrap.js
          node --check apps/claims-disputes/src/data/saved-copy-codec.js
          node --check apps/claims-disputes/src/data/local-record-port.js
          node --check apps/claims-disputes/src/i18n/app-copy.js
          node --check apps/claims-disputes/src/application/workspace-controller.js
          node --check apps/claims-disputes/tests/save-reopen.test.cjs
          node --check apps/claims-disputes/tests/browser-workflow.cjs
          node apps/claims-disputes/tests/save-reopen.test.cjs
          node tests/personal-demo-release.cjs
          node tests/vesa-next-app-starter.cjs
          node apps/fabric-supplier-comparison/tests/domain.test.cjs
          node apps/fabric-supplier-comparison/tests/save-reopen.test.cjs
          node apps/fabric-supplier-comparison/tests/report-reference.test.cjs
          node apps/buyer-crm/tests/domain.test.cjs
          node apps/buyer-crm/tests/save-reopen.test.cjs
          node apps/buyer-crm/tests/report-reference.test.cjs
          node apps/label-artwork-approval/tests/domain.test.cjs
          node apps/label-artwork-approval/tests/save-reopen.test.cjs
          node apps/label-artwork-approval/tests/report-reference.test.cjs
          node apps/factory-vendor/tests/domain.test.cjs
          node apps/factory-vendor/tests/save-reopen.test.cjs
          node apps/factory-vendor/tests/report-reference.test.cjs
          node apps/production-tracker/tests/domain.test.cjs
          node apps/production-tracker/tests/save-reopen.test.cjs
          node apps/production-tracker/tests/report-reference.test.cjs
          node apps/shipment-documentation/tests/domain.test.cjs
          node apps/fabric-trims/tests/domain.test.cjs
          node apps/sampling-approval/tests/domain.test.cjs
          node apps/lc-payment/tests/domain.test.cjs
          node apps/purchase-order/tests/domain.test.cjs
          node apps/packing-container/tests/domain.test.cjs
          node apps/order-commission/tests/domain.test.cjs
          node apps/tech-pack-spec/tests/domain.test.cjs
          node apps/tna/tests/g02-domain.test.js
          node apps/tna/tests/g05-storage.test.js
          node apps/ppm/tests/p-g00-baseline.cjs
          node apps/aql/tests/a-g00-baseline.cjs
          node apps/aql/tests/a-g03-sampling.cjs
          node apps/aql/tests/a-g09-cross-app-boundaries.cjs
          node tests/vesa-workspace-shell-contract.cjs
          git diff --check HEAD~1 HEAD
      - name: Install Chromium for APP-14 actual browser proof
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Real Chromium AQL-immutable claim, settlement, copies and four-language workflow
        run: node apps/claims-disputes/tests/browser-workflow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claims-app14-m2-synthetic-browser
          path: output/playwright/claims-app14-*
          if-no-files-found: ignore
