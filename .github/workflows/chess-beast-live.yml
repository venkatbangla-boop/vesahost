name: Chess Beast 360 LIVE acceptance
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chess-public:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify public exact bytes and live synthetic game
        env:
          CHESS_PUBLIC_ORIGIN: https://vesaent.com
          CHESS_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node --check tests/chess-beast-live.cjs
          node tests/chess-beast-live.cjs
