# Chess Beast 360 V2 — independent audited-domain / responsive browser gate.
name: Chess Beast 360 V2 acceptance
on:
  push:
    branches: [feature/chess-beast-v2-20261018, main]
    paths:
      - 'apps/chess-360/**'
      - 'tests/chess-beast-v2.cjs'
      - 'tests/chess-beast-rules.cjs'
      - 'tests/chess-beast-deep-browser.cjs'
      - 'tests/chess-beast-visual.cjs'
      - 'tests/vesa-chess-20th-app.cjs'
      - 'tests/vesa-egenva-branding.cjs'
      - 'js/app-catalogue.js'
      - 'service-worker.js'
      - '.github/workflows/chess-beast-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chess:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node domain / app source smoke
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/chess-360/chess-ai-worker.js
          node --check tests/chess-beast-v2.cjs
          node --check apps/chess-360/chess-beast-ui.js
          node tests/chess-beast-rules.cjs
          node tests/vesa-blueprint-integrity.cjs
          node tests/vesa-egenva-branding.cjs
          node tests/personal-demo-release.cjs
      - name: Install Chromium and WebKit
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium webkit
          CHROME="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Real AI Worker / 320-1440 responsiveness
        run: |
          set -euo pipefail
          node tests/chess-beast-v2.cjs
          node tests/chess-beast-deep-browser.cjs
          CHESS_IMAGE_LOG=1 node tests/chess-beast-visual.cjs
          node tests/vesa-chess-20th-app.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chess-beast-v2-mobile-desktop-synthetic-screens
          path: output/chess-beast-v2/*.jpg
          if-no-files-found: ignore
          retention-days: 7
