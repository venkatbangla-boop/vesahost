# Chess Beast 360 V2 — independent audited-domain / responsive browser gate.
name: Chess Beast 360 V2 acceptance
on:
  push:
    branches: [feature/chess-beast-v2-20261018, feature/chess-beast-v2-20261018-match-experience, feature/chess-beast-pro-orbit-20261018, feature/chess-real-3d-mesh-20261018, main]
    paths:
      - 'apps/chess-360/**'
      - 'tests/chess-beast-v2.cjs'
      - 'tests/chess-match-experience.cjs'
      - 'tests/chess-pro-orbit-qa.cjs'
      - 'tests/chess-panel-layout-qa.cjs'
      - 'tests/chess-real-3d-models.cjs'
      - 'tests/chess-real-3d-browser.cjs'
      - 'tests/chess-beast-live.cjs'
      - 'tests/chess-beast-rules.cjs'
      - 'tests/chess-beast-deep-browser.cjs'
      - 'tests/chess-beast-visual.cjs'
      - 'tests/chess-beast-offline.cjs'
      - 'tests/vesa-chess-20th-app.cjs'
      - 'tests/vesa-egenva-branding.cjs'
      - 'js/app-catalogue.js'
      - 'service-worker.js'
      - '.github/workflows/chess-beast-v2.yml'
  workflow_dispatch:
# Prevent overlapping branch pushes from competing for browser QA resources.
concurrency:
  group: chess-v2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chess:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node domain / app source smoke
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/chess-360/chess-ai-worker.js
          node --check tests/chess-beast-v2.cjs
          node --check apps/chess-360/chess-beast-ui.js
          node --check apps/chess-360/chess-panel-ui.js
          node --check apps/chess-360/chess-orbit.js
          node --check apps/chess-360/chess-real-3d-models.js
          node --check apps/chess-360/chess-real-3d.js
          node --check apps/chess-360/chess-real-3d-studio.mjs
          node tests/chess-real-3d-models.cjs
          node tests/chess-beast-rules.cjs
          node tests/vesa-blueprint-integrity.cjs
          node tests/vesa-egenva-branding.cjs
          node tests/personal-demo-release.cjs
      - name: Install Chromium and WebKit
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium webkit
          CHROME="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Real AI Worker / 320-1440 responsiveness
        run: |
          set -euo pipefail
          node tests/chess-real-3d-browser.cjs
          node tests/chess-panel-layout-qa.cjs
          node tests/chess-beast-v2.cjs
          CHESS_BROWSER=webkit node tests/chess-beast-v2.cjs
          node tests/chess-beast-deep-browser.cjs
          node tests/chess-match-experience.cjs
          node tests/chess-pro-orbit-qa.cjs
          CHESS_IMAGE_LOG=1 node tests/chess-beast-visual.cjs
          node tests/chess-beast-offline.cjs
          node tests/vesa-chess-20th-app.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chess-beast-v2-mobile-desktop-synthetic-screens
          path: |
            output/chess-beast-v2/*.jpg
            output/chess-real-3d/*.png
          if-no-files-found: ignore
          retention-days: 7

  sibling-platform:
    name: Preserve 19 garment apps and shared VESA App Centre
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen TNA PPM AQL and shared source contracts
        run: |
          set -euo pipefail
          node tests/vesa-workspace-shell-contract.cjs
          node apps/ppm/tests/p-g00-baseline.cjs
          node apps/aql/tests/a-g00-baseline.cjs
          node apps/tna/tests/g03-scheduling.test.js
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          CHROME="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Real App Centre and 19 existing opened workflows
        run: |
          set -euo pipefail
          node tests/vesa-platform-pages.cjs
          node tests/vesa-19-app-real-screens.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chess-beast-v2-original-nineteen-app-regression
          path: output/vesa-19-real-screens/
          if-no-files-found: ignore
          retention-days: 5
