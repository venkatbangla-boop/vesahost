# APP-09 full release candidate gate; verifies domain, live catalogue integration and Chromium before public claim.
name: VESA Production Tracker 360 verification
on:
  push:
    branches:
      - feature/production-tracker-360
      - feature/production-g4-guided-practice
      - main
    paths:
      - 'apps/production-tracker/**'
      - 'docs/production-tracker/**'
      - '.github/workflows/production-tracker.yml'
      - 'js/app-catalogue.js'
      - 'js/preferences.js'
      - 'service-worker.js'
      - 'tests/personal-demo-release.cjs'
      - '.github/workflows/vesa-costing-demo-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: APP-09 original source and M1 pure production engine
        run: |
          set -euo pipefail
          node tests/vesa-blueprint-integrity.cjs
          node tests/personal-demo-release.cjs
          node --check service-worker.js
          node --check js/app-catalogue.js
          node --check js/preferences.js
          node --check apps/production-tracker/src/domain/stage-flow.js
          node --check apps/production-tracker/src/domain/wip-balance.js
          node --check apps/production-tracker/src/domain/daily-output-ledger.js
          node --check apps/production-tracker/tests/domain.test.cjs
          node apps/production-tracker/tests/domain.test.cjs
          node --check apps/production-tracker/src/data/local-record-port.js
          node --check apps/production-tracker/src/data/saved-copy-codec.js
          node --check apps/production-tracker/src/i18n/app-copy.js
          node --check apps/production-tracker/src/application/workspace-controller.js
          node --check apps/production-tracker/src/bootstrap.js
          node --check apps/production-tracker/tests/save-reopen.test.cjs
          node --check apps/production-tracker/tests/browser-workflow.cjs
          node apps/production-tracker/tests/save-reopen.test.cjs
          node --check apps/production-tracker/src/domain/reviewed-reference.js
          node --check apps/production-tracker/src/reports/report-model.js
          node --check apps/production-tracker/tests/report-reference.test.cjs
          node apps/production-tracker/tests/report-reference.test.cjs
          node tests/vesa-next-app-starter.cjs
          node apps/shipment-documentation/tests/domain.test.cjs
          node apps/fabric-trims/tests/domain.test.cjs
          node apps/sampling-approval/tests/domain.test.cjs
          node apps/lc-payment/tests/domain.test.cjs
          node apps/purchase-order/tests/domain.test.cjs
          node apps/packing-container/tests/domain.test.cjs
          node apps/order-commission/tests/domain.test.cjs
          node apps/tech-pack-spec/tests/domain.test.cjs
          node apps/tna/tests/g02-domain.test.js
          node apps/tna/tests/g05-storage.test.js
          node apps/ppm/tests/p-g00-baseline.cjs
          node apps/aql/tests/a-g00-baseline.cjs
          node apps/aql/tests/a-g03-sampling.cjs
          node tests/vesa-workspace-shell-contract.cjs
          git diff --check HEAD~1 HEAD
      - name: Install real Chromium for Production browser proof
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Real browser Production daily, PO/TNA reference and XLSX/PDF workflow
        run: node apps/production-tracker/tests/browser-workflow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production360-m4-synthetic-browser
          path: output/playwright/prod-app09-*
          if-no-files-found: ignore
