# Checks served demo bytes only after GitHub Pages finishes publishing main.
# No buyer data, passwords, financial records or external storage are involved.
name: VESA Costing demo live smoke

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vesa-costing-demo-live-smoke.yml'
      - 'apps/costing/**'
      - 'apps/packing-container/**'
      - 'apps/order-commission/**'
      - 'apps/tech-pack-spec/**'
      - 'apps/purchase-order/**'
      - 'apps/lc-payment/**'
      - 'apps/sampling-approval/**'
      - 'apps/fabric-trims/**'
      - 'apps/index.html'
      - 'js/app-catalogue.js'
      - 'js/preferences.js'
      - 'service-worker.js'
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-demo:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main release source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Compare exact live Costing, App Centre and cache bytes
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 25 https://vesaent.com/apps/costing/ -o /tmp/vesa-costing-live.html &&
               curl --fail --silent --show-error --location --max-time 25 https://vesaent.com/apps/ -o /tmp/vesa-apps-live.html &&
               curl --fail --silent --show-error --location --max-time 25 'https://vesaent.com/js/app-catalogue.js?v=20261015-costing-demo' -o /tmp/vesa-catalogue-live.js &&
               curl --fail --silent --show-error --location --max-time 25 https://vesaent.com/service-worker.js -o /tmp/vesa-worker-live.js &&
               curl --fail --silent --show-error --location --max-time 25 https://vesaent.com/login/ -o /tmp/vesa-login-live.html &&
               cmp -s apps/costing/index.html /tmp/vesa-costing-live.html &&
               cmp -s apps/index.html /tmp/vesa-apps-live.html &&
               cmp -s js/app-catalogue.js /tmp/vesa-catalogue-live.js &&
               cmp -s service-worker.js /tmp/vesa-worker-live.js &&
               grep -Fq "id:'costing'" /tmp/vesa-catalogue-live.js &&
               grep -Fq 'id="loginForm"' /tmp/vesa-login-live.html; then
              verified=1
              break
            fi
            echo "Live static demo has not matched main yet (attempt ${attempt}/12)"
            sleep 8
          done
          if [ "$verified" -ne 1 ]; then
            echo "HOLD: served public routes do not exactly match approved main candidate" >&2
            exit 1
          fi
          for route in aql ppm tna; do
            curl --fail --silent --show-error --location --max-time 25 "https://vesaent.com/apps/$route/" -o /dev/null
          done
          for app in packing-container order-commission tech-pack-spec purchase-order lc-payment sampling-approval fabric-trims; do
            curl --fail --silent --show-error --location --max-time 25 "https://vesaent.com/apps/$app/" -o "/tmp/vesa-$app-live.html"
            cmp -s "apps/$app/index.html" "/tmp/vesa-$app-live.html" || {
              echo "HOLD: $app demo live HTML does not match main" >&2
              exit 1
            }
            grep -Fq 'NON-COMMERCIAL PERSONAL DEMO.' "/tmp/vesa-$app-live.html"
          done
          # The sampling app uses maintainable modules; verify those bytes, not only its index.
          for asset in assets/sampling-approval.css src/bootstrap.js src/domain/sampling-engine.js src/data/local-record-port.js src/reports/report-model.js src/i18n/app-copy.js src/application/workspace-controller.js; do
            curl --fail --silent --show-error --location --max-time 25 "https://vesaent.com/apps/sampling-approval/$asset" -o "/tmp/vesa-sampling-$(basename "$asset")"
            cmp -s "apps/sampling-approval/$asset" "/tmp/vesa-sampling-$(basename "$asset")" || {
              echo "HOLD: sampling module $asset does not exactly match main" >&2
              exit 1
            }
          done
          # Fabric is modular. Verify every source asset served by Pages matches this commit.
          for asset in assets/fabric-trims.css src/bootstrap.js src/domain/material-engine.js src/data/local-record-port.js src/reports/report-model.js src/i18n/app-copy.js src/application/workspace-controller.js; do
            curl --fail --silent --show-error --location --max-time 25 "https://vesaent.com/apps/fabric-trims/$asset" -o "/tmp/vesa-fabric-$(basename "$asset")"
            cmp -s "apps/fabric-trims/$asset" "/tmp/vesa-fabric-$(basename "$asset")" || {
              echo "HOLD: fabric source module $asset differs from main" >&2
              exit 1
            }
          done
          printf 'LIVE PASS: Login -> App Centre -> Costing, Packing, Commission, Tech Pack, Purchase Order, LC & Payment, Sampling and Fabric & Trims personal demos; exact public source bytes; existing AQL/PPM/TNA intact; main=%s\n' "$(git rev-parse HEAD)"
          echo "This check does not establish server-side authentication, buyer approval or production SaaS permission."
