name: VESA TNA garment-merchandising rework verification

on:
  push:
    branches:
      - feature/tna360-continuous
    paths:
      - '.github/workflows/tna-merchandising-verification.yml'
      - 'apps/tna/**'
      - 'service-worker.js'
      - 'js/**'
      - 'css/**'
  workflow_dispatch:

# Source pushes still register a lightweight check, but the complete suite runs
# only at an intentional review checkpoint ([verify]) or a manual dispatch.
# Never interpret a skipped intermediate run as acceptance or as release proof.
# Routine source pushes remain visible in GitHub history, but spend no full-test runner time.
permissions:
  contents: read

jobs:
  tna-garment-rework:
    # Retain every test below. Only the scheduling gate changes.
    # Complete source CI evidence must match a deliberate [verify] checkpoint SHA.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout actual VESA repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and non-mutating garments projection
        run: |
          node --check apps/tna/src/reports.js
          node --check apps/tna/src/storage.js
          node --check apps/tna/src/domain.js
          node --check apps/tna/src/merchandising-sheet.js
          node --check apps/tna/src/import-review.js
          node --check apps/tna/src/bootstrap.js
          node --check service-worker.js
          node --test apps/tna/tests/g11-merchandising-sheet.test.js apps/tna/tests/g12-merchandising-edits.test.js apps/tna/tests/g13-merchandising-report-parity.test.js apps/tna/tests/g14-reviewed-excel-import.test.js
      - name: Preserve existing TNA calculations, records and PPM/AQL rules
        run: |
          node apps/tna/tests/g01-shell.test.js
          node apps/tna/tests/g02-domain.test.js
          node apps/tna/tests/g03-scheduling.test.js
          node apps/tna/tests/g05-storage.test.js
          node apps/tna/tests/g07-reports.test.js
          node apps/tna/tests/g11-saved-copy-migration.test.js
          node apps/ppm/tests/p-g00-baseline.cjs
          node apps/aql/tests/a-g00-baseline.cjs
          node apps/aql/tests/a-g03-sampling.cjs
          node tests/vesa-workspace-shell-contract.cjs
      - name: Install browser test runner and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Real HTTP browser proof for garment sheet and older app routes
        run: |
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          mkdir -p output/playwright
          node apps/tna/tests/g11-merchandising-sheet.cjs
          node apps/tna/tests/g14-reviewed-excel-import-browser.cjs
          node apps/tna/tests/g12-merchandising-edits-browser.cjs
          node apps/tna/tests/g11-artifact-viewers.cjs
          node apps/tna/tests/g11-f06-order-master.cjs
          node apps/tna/tests/g11-unified-shell-browser.cjs
          node apps/tna/tests/g11-route-regression.cjs
          node tests/vesa-platform-pages.cjs
          node tests/vesa-shared-shell-matrix.cjs
