# APP-08 full personal synthetic demo gate: domain, static registration, Chromium and legacy.
name: VESA Factory Vendor 360 verification
on:
  push:
    branches:
      - feature/factory-vendor-360
      - feature/factory-g4-guided-practice
      - main
    paths:
      - 'apps/factory-vendor/**'
      - 'docs/factory-vendor/**'
      - '.github/workflows/factory-vendor.yml'
      - 'js/app-catalogue.js'
      - 'js/preferences.js'
      - 'service-worker.js'
      - 'tests/personal-demo-release.cjs'
      - '.github/workflows/vesa-costing-demo-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factory-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable original blueprints, APP-08 engine, prior apps
        run: |
          set -euo pipefail
          node tests/vesa-blueprint-integrity.cjs
          node --check apps/factory-vendor/src/domain/vendor-profile.js
          node --check apps/factory-vendor/src/domain/certification-evidence.js
          node --check apps/factory-vendor/src/domain/capability-matcher.js
          node --check apps/factory-vendor/tests/domain.test.cjs
          node apps/factory-vendor/tests/domain.test.cjs
          node --check apps/factory-vendor/src/bootstrap.js
          node --check apps/factory-vendor/src/application/workspace-controller.js
          node --check apps/factory-vendor/src/data/local-record-port.js
          node --check apps/factory-vendor/src/data/saved-copy-codec.js
          node --check apps/factory-vendor/src/i18n/app-copy.js
          node --check apps/factory-vendor/tests/save-reopen.test.cjs
          node --check apps/factory-vendor/tests/browser-workflow.cjs
          node apps/factory-vendor/tests/save-reopen.test.cjs
          node --check apps/factory-vendor/src/domain/reviewed-reference.js
          node --check apps/factory-vendor/src/reports/report-model.js
          node --check apps/factory-vendor/tests/report-reference.test.cjs
          node apps/factory-vendor/tests/report-reference.test.cjs
          node tests/personal-demo-release.cjs
          node --check js/app-catalogue.js
          node --check js/preferences.js
          node --check service-worker.js
          grep -Fq 'factory-vendor' .github/workflows/vesa-costing-demo-live-smoke.yml
          node tests/vesa-next-app-starter.cjs
          node apps/production-tracker/tests/domain.test.cjs
          node apps/production-tracker/tests/save-reopen.test.cjs
          node apps/production-tracker/tests/report-reference.test.cjs
          node apps/shipment-documentation/tests/domain.test.cjs
          node apps/fabric-trims/tests/domain.test.cjs
          node apps/sampling-approval/tests/domain.test.cjs
          node apps/lc-payment/tests/domain.test.cjs
          node apps/purchase-order/tests/domain.test.cjs
          node apps/packing-container/tests/domain.test.cjs
          node apps/order-commission/tests/domain.test.cjs
          node apps/tech-pack-spec/tests/domain.test.cjs
          node apps/tna/tests/g02-domain.test.js
          node apps/tna/tests/g05-storage.test.js
          node apps/ppm/tests/p-g00-baseline.cjs
          node apps/aql/tests/a-g00-baseline.cjs
          node apps/aql/tests/a-g03-sampling.cjs
          node tests/vesa-workspace-shell-contract.cjs
          git diff --check HEAD~1 HEAD
      - name: Install real Chromium for Factory browser proof
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Factory reviewed PO references, local Excel/PDF and Chromium journey
        run: node apps/factory-vendor/tests/browser-workflow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory360-m4-synthetic-browser
          path: output/playwright/factory-app08-*
          if-no-files-found: ignore
