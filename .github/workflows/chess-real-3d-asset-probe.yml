# One-shot licensing and offline bundle-size probe. Feature branch only.
# Does NOT publish assets or change main. Uses official Poly Haven API with a
# unique user-agent, never calls the remote API at application runtime.
name: Chess 3D art asset investigation
on:
  push:
    branches: [feature/chess-real-3d-mesh-20261018]
    paths:
      - '.github/workflows/chess-real-3d-asset-probe.yml'
      - 'docs/portfolio/CHESS_BEAST_360_REAL_3D_VISUAL_QA.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-cc0:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Discover official CC0 chess set download formats
        env:
          ASSET_ID: chess_set
          USER_AGENT: VESAChessBeast360AssetAudit/1.0 (github.com/venkatbangla-boop/vesahost)
        run: |
          set -euo pipefail
          mkdir -p output/chess-3d-art
          python3 - <<'PY'
          import json, os, urllib.request, hashlib, pathlib
          root=pathlib.Path("output/chess-3d-art")
          agent=os.environ["USER_AGENT"]
          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":agent,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=35) as r:return json.load(r)
          meta=fetch("https://api.polyhaven.com/info/chess_set")
          files=fetch("https://api.polyhaven.com/files/chess_set")
          auth=meta.get("authors",{})
          print("CC0_SOURCE polyhaven.com/a/chess_set")
          print("ASSET_AUTHOR "+json.dumps(auth)[:400])
          print("MANIFEST_KEYS "+json.dumps(list(files.keys())))
          candidates=[]
          def walk(v,path=()):
              if isinstance(v,dict):
                  if isinstance(v.get("url"),str):
                      u=v["url"];size=int(v.get("size",0))
                      if any(s in u.lower() for s in [".gltf",".glb",".zip",".blend"]):
                          candidates.append({"path":"/".join(map(str,path)),
                            "url":u,"size":size,"md5":v.get("md5","")})
                  for k,w in v.items():walk(w,path+(k,))
              elif isinstance(v,list):
                  for i,w in enumerate(v):walk(w,path+(i,))
          walk(files)
          candidates.sort(key=lambda x:(x["size"] or 2**40,x["path"]))
          report={"source":"https://polyhaven.com/a/chess_set",
              "sourceLicense":"CC0 per Poly Haven asset page",
              "assetAuthors":auth,"candidateFormats":candidates[:80],
              "allCount":len(candidates),
              "appOfflineOnly":True,"notYetApprovedOrShipped":True}
          (root/"cc0-chess-set-file-manifest.json").write_text(
              json.dumps(report,indent=2),encoding="utf-8")
          print("CANDIDATES "+json.dumps(candidates[:20])[:4700])
          filtered=[x for x in candidates if ("gltf" in x["path"].lower() or
              "glb" in x["path"].lower()) and x["size"]>0 and x["size"]<25_000_000]
          if not filtered:
              print("ART_DOWNLOAD_SKIPPED no locally shippable <25MB 3D candidate")
              raise SystemExit(0)
          item=filtered[0]
          url=item["url"]
          req=urllib.request.Request(url,headers={"User-Agent":agent})
          data=urllib.request.urlopen(req,timeout=60).read(26_000_000)
          if len(data)>25_000_000:raise SystemExit("MODEL_TOO_BIG_FOR_MOBILE: "+str(len(data)))
          if item["md5"] and hashlib.md5(data).hexdigest()!=item["md5"]:
              raise SystemExit("ASSET_MD5_MISMATCH")
          ext=".glb" if ".glb" in url.lower() else ".zip" if ".zip" in url.lower() else ".gltf"
          out=root/("polyhaven-original-cc0-1k"+ext)
          out.write_bytes(data)
          report["selected"]={"path":item["path"],"size":len(data),
              "sha256":hashlib.sha256(data).hexdigest(),"downloadedFile":out.name}
          (root/"cc0-chess-set-file-manifest.json").write_text(
              json.dumps(report,indent=2),encoding="utf-8")
          print("CHESS_3D_CC0_ASSET_PROBE_PASS "+json.dumps(report["selected"]))
          # Validate and download ONLY local relative geometry+texture dependencies
          # from the exact canonical Poly Haven model folder. No opaque CDN at runtime.
          if ext==".gltf":
              from urllib.parse import urljoin, urlparse
              gltf=json.loads(data.decode("utf-8"))
              dependencies=[v["uri"] for v in
                 [*gltf.get("buffers",[]),*gltf.get("images",[])]
                 if "uri" in v and not v["uri"].startswith("data:")]
              total=len(data)
              whitelist="https://dl.polyhaven.org/file/ph-assets/Models/"
              print("GLTF_ENTRY "+json.dumps(files.get("gltf",{}).get("1k",{}).get("gltf",{}))[:4800])
              collected=[]
              for relative in dependencies:
                  if ".." in pathlib.PurePosixPath(relative).parts:
                      raise SystemExit("Unsafe GLTF dependency: "+relative)
                  asset_url=urljoin(url,relative)
                  if not asset_url.startswith(whitelist):
                      raise SystemExit("Offsite GLTF dependency: "+asset_url)
                  dest=root/pathlib.PurePosixPath(relative)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  req=urllib.request.Request(asset_url,headers={"User-Agent":agent})
                  try:
                      dep=urllib.request.urlopen(req,timeout=50).read(12_000_000)
                  except urllib.error.HTTPError as exc:
                      if exc.code!=404:raise
                      # Poly Haven glTF file records can point to texture maps
                      # stored under Models/jpg/1k instead of gltf/1k.
                      stem=pathlib.PurePosixPath(relative).name
                      texture_key=stem.removeprefix("chess_set_").removesuffix("_1k.jpg")
                      tex=files.get(texture_key,{}).get("1k",{}).get("jpg",{})
                      if not tex.get("url"):
                          raise SystemExit("Missing official included texture metadata for "+relative)
                      asset_url=tex["url"]
                      if not asset_url.startswith(whitelist):
                          raise SystemExit("Untrusted material URL "+asset_url)
                      req=urllib.request.Request(asset_url,headers={"User-Agent":agent})
                      dep=urllib.request.urlopen(req,timeout=50).read(12_000_000)
                      if tex.get("md5") and hashlib.md5(dep).hexdigest()!=tex["md5"]:
                          raise SystemExit("Official texture checksum mismatch "+relative)
                  total+=len(dep)
                  if len(dep)>10_000_000 or total>20_000_000:
                      raise SystemExit("Offline mobile size budget exceeded")
                  dest.write_bytes(dep)
                  collected.append({"name":relative,"size":len(dep),
                    "sha256":hashlib.sha256(dep).hexdigest()})
                  print("OFFLINE_DEP "+relative+" "+str(len(dep)))
              report["selected"]["dependencies"]=collected
              report["selected"]["completePackageBytes"]=total
              (root/"cc0-chess-set-file-manifest.json").write_text(
                  json.dumps(report,indent=2),encoding="utf-8")
              (root/"ASSET_LICENSE_CC0.txt").write_text(
                  "Poly Haven Chess Set — author Riley Queen\n"
                  "Original source: https://polyhaven.com/a/chess_set\n"
                  "License: CC0 public-domain dedication\n"
                  "Downloaded through official API with build-time User-Agent.\n"
                  "Offline copies only; no app runtime requests to Poly Haven.\n"
                  "No claim of affiliation or exclusive authorship.\n",
                  encoding="utf-8")
              print("CHESS_3D_FULL_OFFLINE_PACKAGE_PASS "+json.dumps({
                "meshes":len(gltf.get("meshes",[])),
                "nodes":len(gltf.get("nodes",[])),
                "textures":len(gltf.get("images",[])),
                "dependencies":len(collected),"totalBytes":total}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chess-real-3d-cc0-asset-candidate
          path: output/chess-3d-art/
          if-no-files-found: ignore
          retention-days: 7
